.hc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#9aa0a6}.hc-ok{background:#2e9e5b}.hc-warn{background:#d9a21b}.hc-bad{background:#d14b3c}
/* Layout: one-column app shell, sticky date header, tabs on top (desktop) or a bottom bar (phone).
   Colours, type and motion come from the shared "Plate" theme kit (theme.css + motion.css). */
/* ==========================================================================
   Fitness app theme  ·  "Plate" system
   Neutrals: warm chalk (light) and warm charcoal (dark) — the "Warm Light" look (Nov 2026).
   Accents: coral (default) plus Aziz's bumper plates (2.5 kg red, 5 kg white,
   10 kg green, 15 kg yellow, 20 kg blue). Pick one with <html data-accent="blue">.
   Mode: <html data-theme="light|dark">, or no attribute to follow the system.
   Fonts (Google Fonts):
   https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap
   ========================================================================== */

:root {
  /* ---- Neutrals (light) ---- */
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface-2: #F1ECE4;
  --surface-3: #E6E0D6;
  --fg: #1C1917;
  --fg-muted: #625B55;
  --fg-faint: #8C847C;
  --line: #E4DED4;
  --overlay: rgba(28, 25, 23, .45);

  /* ---- Accent palettes (each has a light and dark value) ---- */
  --accent-light: #C64F19;  --accent-dark: #F08A57;      /* default: coral (Warm Light look, Nov 2026) */
  --on-accent-light: #FFFFFF; --on-accent-dark: #2A1208;
  --accent: var(--accent-light);
  --on-accent: var(--on-accent-light);
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));

  /* ---- Macros (fixed across accents so charts stay readable) ---- */
  --protein: #0F8B8D;
  --carbs: #BF7A0F;
  --fat: #7A5AD9;
  --kcal: var(--fg);

  /* ---- Status ---- */
  --good: #1E8A4C;
  --warn: #B86E00;
  --bad: #C8352E;

  /* ---- Type ---- */
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --text-xs: .75rem;    /* 12  captions, units */
  --text-sm: .875rem;   /* 14  secondary */
  --text-md: 1rem;      /* 16  body */
  --text-lg: 1.25rem;   /* 20  card titles */
  --text-xl: 1.75rem;   /* 28  screen titles (display) */
  --text-2xl: 2.5rem;   /* 40  hero numbers (display) */
  --text-3xl: 3.5rem;   /* 56  ring centre, PR number */

  /* ---- Space (4px grid) ---- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  /* ---- Shape & depth ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(18, 22, 27, .06), 0 1px 1px rgba(18, 22, 27, .04);
  --shadow-2: 0 6px 20px rgba(18, 22, 27, .10), 0 2px 6px rgba(18, 22, 27, .06);
  --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);

  --tap: 44px; /* minimum touch target */

  color-scheme: light;
}

/* ---- Accent choices ---- */
[data-accent="coral"]  { --accent-light: #C64F19; --accent-dark: #F08A57; --on-accent-light: #FFFFFF; --on-accent-dark: #2A1208; }
[data-accent="red"]    { --accent-light: #D0302A; --accent-dark: #F2665D; --on-accent-light: #FFFFFF; --on-accent-dark: #220B0A; }
[data-accent="blue"]   { --accent-light: #1F5FD1; --accent-dark: #6B9BF5; --on-accent-light: #FFFFFF; --on-accent-dark: #0B1222; }
[data-accent="yellow"] { --accent-light: #A87300; --accent-dark: #F2C230; --on-accent-light: #FFFFFF; --on-accent-dark: #221A02; }
/* 5 kg white plate: graphite on light backgrounds so it stays visible, white on dark */
[data-accent="white"]  { --accent-light: #2B3139; --accent-dark: #F2F4F6; --on-accent-light: #FFFFFF; --on-accent-dark: #0D1013; }
[data-accent="green"]  { --accent-light: #1B8048; --accent-dark: #43C47E; --on-accent-light: #FFFFFF; --on-accent-dark: #06200F; }

/* ---- Dark (system setting, unless light was chosen) ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120F; --surface: #1E1A17; --surface-2: #29241F; --surface-3: #342E28;
    --fg: #F3EEE6; --fg-muted: #A79E94; --fg-faint: #776F67; --line: #322C26;
    --overlay: rgba(0, 0, 0, .6);
    --accent: var(--accent-dark); --on-accent: var(--on-accent-dark);
    --protein: #3EC1C3; --carbs: #F0AE4A; --fat: #A08BF2;
    --good: #43C47E; --warn: #F2A93B; --bad: #F2665D;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 8px 24px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
/* ---- Dark (chosen explicitly) ---- */
:root[data-theme="dark"] {
  --bg: #15120F; --surface: #1E1A17; --surface-2: #29241F; --surface-3: #342E28;
  --fg: #F3EEE6; --fg-muted: #A79E94; --fg-faint: #776F67; --line: #322C26;
  --overlay: rgba(0, 0, 0, .6);
  --accent: var(--accent-dark); --on-accent: var(--on-accent-dark);
  --protein: #3EC1C3; --carbs: #F0AE4A; --fat: #A08BF2;
  --good: #43C47E; --warn: #F2A93B; --bad: #F2665D;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 8px 24px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* ==========================================================================
   Aliases for the app shell's existing token names (APP-SHELL.md).
   Inline this file in place of the app's own color/font token blocks;
   these follow mode and accent changes automatically.
   ========================================================================== */
:root {
  --sunk: var(--surface-2);
  --ink: var(--fg);
  --muted: var(--fg-muted);
  --accent-ink: var(--on-accent);
  --display: var(--font-display);
  --body: var(--font-body);
  --mono: var(--font-mono);
  --r: var(--radius-md);
}

/* ==========================================================================
   Fitness app motion
   Rule of thumb: motion confirms an action (a set logged, a meal eaten)
   or shows progress (rings, bars). It never delays reading.
   Everything collapses to instant under prefers-reduced-motion.
   ========================================================================== */

:root {
  --dur-tap: 120ms;     /* press feedback */
  --dur-ui: 220ms;      /* toggles, tabs, sheets */
  --dur-enter: 420ms;   /* cards entering a screen */
  --dur-fill: 900ms;    /* rings and bars filling */
  --dur-celebrate: 1200ms;

  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  --stagger: 50ms;      /* per item, via style="--i: 2" */
}

/* ---- Press feedback: any button or tappable card ---- */
.tap { transition: transform var(--dur-tap) var(--ease-out), background-color var(--dur-ui) var(--ease-out); }
.tap:active { transform: scale(.97); }

/* ---- Screen entry: cards rise in, staggered by --i ---- */
@keyframes fit-rise { from { opacity: 0; transform: translateY(12px); } }
.anim-rise {
  animation: fit-rise var(--dur-enter) var(--ease-out) backwards;
  animation-delay: calc(var(--i, 0) * var(--stagger));
}

/* ---- Warm Light motion (Nov 2026): bars and rings fill as their card rises in ---- */
@keyframes fit-fill { from { width: 0; } }
@keyframes fit-ring { from { stroke-dashoffset: 100; } }
.anim-rise .mbar .eaten, .anim-rise .mbar .planned, .anim-rise .bar > span {
  animation: fit-fill var(--dur-fill) var(--ease-out) backwards;
  animation-delay: calc(var(--i, 0) * var(--stagger) + 120ms);
}
.anim-rise .ring-fill { animation: fit-ring var(--dur-fill) var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * var(--stagger) + 120ms); }
.anim-rise .fsum .v.big { animation: fit-rise var(--dur-enter) var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * var(--stagger) + 80ms); }
/* ---- Press feedback everywhere (the logger has its own) ---- */
#main button, nav.drawer button, .fsheet button, .co-fab, .fold > summary { transition: transform var(--dur-tap) var(--ease-out), background-color var(--dur-ui) var(--ease-out), border-color var(--dur-ui) var(--ease-out); }
#main button:active, nav.drawer button:active, .fsheet button:active, .co-fab:active { transform: scale(.96); }
@media (prefers-reduced-motion: reduce) { #main button:active, nav.drawer button:active, .fsheet button:active { transform: none; } }

/* ---- Pop: checking off a set, marking a meal as eaten ---- */
@keyframes fit-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.anim-pop { animation: fit-pop 320ms var(--ease-spring); }

/* ---- Check mark draws itself (SVG path with pathLength="1") ---- */
@keyframes fit-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.anim-draw { stroke-dasharray: 1; animation: fit-draw 260ms var(--ease-out) both; }

/* ---- Progress ring: SVG circle with pathLength="100".
        Set style="--value: 82" (0-100) and the ring animates to it. ---- */
.ring-track { stroke: var(--surface-2); }
.ring-fill {
  stroke: var(--accent);
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: calc(100 - min(var(--value, 0), 100));
  transition: stroke-dashoffset var(--dur-fill) var(--ease-out);
  transform: rotate(-90deg);
  transform-origin: center;
}
.ring-fill.is-over { stroke: var(--warn); }

/* ---- Bars (macros, volume): width set via --value (0-100) ---- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span {
  display: block; height: 100%; border-radius: inherit;
  width: calc(min(var(--value, 0), 100) * 1%);
  background: var(--bar-color, var(--accent));
  transition: width var(--dur-fill) var(--ease-out);
}

/* ---- Tab / screen switch fallback (when View Transitions aren't supported) ---- */
@keyframes fit-slide-in-r { from { opacity: 0; transform: translateX(24px); } }
@keyframes fit-slide-in-l { from { opacity: 0; transform: translateX(-24px); } }
.anim-in-right { animation: fit-slide-in-r var(--dur-ui) var(--ease-out) backwards; }
.anim-in-left  { animation: fit-slide-in-l var(--dur-ui) var(--ease-out) backwards; }

/* ---- View Transitions (Chrome, Safari 18+): used by FitMotion.switchView ---- */
::view-transition-old(root),
::view-transition-new(root) { animation-duration: var(--dur-ui); animation-timing-function: var(--ease-out); }
::view-transition-old(fit-screen) { animation: var(--dur-ui) var(--ease-out) both fit-out; }
::view-transition-new(fit-screen) { animation: var(--dur-ui) var(--ease-out) both fit-slide-in-r; }
:root[data-nav="back"]::view-transition-new(fit-screen) { animation-name: fit-slide-in-l; }
@keyframes fit-out { to { opacity: 0; } }

/* ---- Bottom sheet (add food, log weight) ---- */
.sheet {
  transform: translateY(100%);
  transition: transform var(--dur-ui) var(--ease-out);
}
.sheet.is-open { transform: translateY(0); }

/* ---- Rest timer: soft pulse in the last 10 seconds ---- */
@keyframes fit-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
  50%      { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 0%, transparent); }
}
.anim-pulse { animation: fit-pulse 1s var(--ease-in-out) infinite; }

/* ---- Loading placeholder ---- */
@keyframes fit-shimmer { to { background-position: -200% 0; } }
.skeleton {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
  background-size: 200% 100%;
  animation: fit-shimmer 1.4s linear infinite;
}

/* ---- New PR: number lifts and a burst of plate-colored pieces (FitMotion.celebrate) ---- */
@keyframes fit-lift {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-6px) scale(1.12); }
  100% { transform: translateY(0) scale(1); }
}
.anim-pr { animation: fit-lift 600ms var(--ease-spring); color: var(--accent); }
.fit-burst-piece {
  position: absolute; width: 8px; height: 4px; border-radius: 1px;
  pointer-events: none;
  animation: fit-burst var(--dur-celebrate) var(--ease-out) forwards;
}
@keyframes fit-burst {
  from { transform: translate(0, 0) rotate(0); opacity: 1; }
  to   { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
}

/* ---- Theme switch: colors cross-fade instead of snapping ---- */
:root.is-theming, :root.is-theming * {
  transition: background-color var(--dur-ui) var(--ease-out),
              color var(--dur-ui) var(--ease-out),
              border-color var(--dur-ui) var(--ease-out),
              fill var(--dur-ui) var(--ease-out),
              stroke var(--dur-ui) var(--ease-out) !important;
}

/* ---- Reduced motion: keep state changes, drop movement ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .fit-burst-piece { display: none; }
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:10px 8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--accent)}
.datepick{display:flex;align-items:center;gap:6px}
.datepick .d{min-width:9.5em;text-align:center;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.today-link{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px}
/* Side drawer (replaces the bottom tab bar, Oct 31) */
.menubtn{font-size:1.25rem}
.drawer-wrap{position:fixed;inset:0;z-index:45;display:flex}
.drawer-wrap .scrim{position:absolute;inset:0;background:var(--overlay)}
nav.drawer{position:relative;width:min(300px,82vw);height:100%;background:var(--surface);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:var(--shadow-2);animation:fit-drawer-in var(--dur-ui) var(--ease-out);overflow-y:auto}
@keyframes fit-drawer-in{from{transform:translateX(-30px);opacity:0}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 14px}
nav.drawer button[data-tab]{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 12px;border-radius:12px;cursor:pointer;font-family:var(--display);font-size:1.3rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);text-align:left;min-height:52px}
nav.drawer button[data-tab] .ico{width:26px;text-align:center;font-size:1.1rem;font-family:var(--body)}
nav.drawer button[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.drawer .drawer-sep{height:1px;background:var(--line);margin:8px 12px}
nav.drawer .drawer-foot{margin-top:auto;padding:12px;font-size:.8rem;color:var(--muted)}
.sync{font-size:.75rem;color:var(--muted)}
.unsaved{margin-left:8px;border:1px solid var(--warn,#c77d00);color:var(--warn,#c77d00);background:transparent;border-radius:999px;padding:1px 8px;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer}
@media (max-width:720px){
  main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  .datepick .d{min-width:8em;font-size:.95rem}
  .brand{font-size:1.2rem}
}

#lbHost,#ppHost,#dioHost{padding-block:0 40px}
@media (max-width:720px){#lbHost,#ppHost,#dioHost{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}}
/* No bottom tab bar any more: floating things sit at the bottom edge */
.co-fab{bottom:calc(20px + env(safe-area-inset-bottom,0px))!important}
.lb-rest.floating{bottom:calc(12px + env(safe-area-inset-bottom,0px))!important}
main{padding-block:22px 40px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:.88rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rest{border-style:dashed}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--accent)}
input[type=number],input[type=text],input[type=search],select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{width:5.2em}
.field{display:flex;flex-direction:column;gap:4px}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:.92rem}
.note.info{border-color:var(--accent)}
.note.bad{border-color:var(--bad)}

/* macro bars */
.macros{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center}
.mbar{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.mbar .planned{position:absolute;inset:0 auto 0 0;opacity:.28}
.mbar .eaten{position:absolute;inset:0 auto 0 0}
.mbar .zone{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.5}
.mval{font-family:var(--mono);font-size:.85rem;white-space:nowrap;text-align:right}
.kcal{background:var(--ink)} .p{background:var(--protein)} .c{background:var(--carbs)} .f{background:var(--fat)}
.bigk{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:5.6em 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.tl li:first-child{border-top:0}
.tl .t{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding-top:1px}

/* list items */
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:.78rem}
.item .mac{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}

function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem("aziz-cut")||"null"); if(j) COLS.forEach(c=>S.docs[c]=j[c]||{}); }catch(e){} }

// Entries saved on this device without an account (or before signing in) go up to the account once the
// first server copy has arrived. Only docs the account doesn't have yet are added; nothing on the server is overwritten.
function uploadLocalOnly(local){
  let localAt=0, upAt=0; try{ localAt=+localStorage.getItem("aziz-cut-localAt")||0; upAt=+localStorage.getItem("aziz-cut-uploadedAt")||0; }catch(e){}
  const has=COLS.some(c=>Object.keys(local[c]||{}).length);
  if(window.claude || !has || (upAt && upAt>=localAt)) return;
  let added=0, kept=0;
  COLS.forEach(c=>Object.entries(local[c]||{}).forEach(([id,doc])=>{ if(S.docs[c][id]===undefined){ put(c,id,doc,{quiet:true}); added++; } else if(JSON.stringify(S.docs[c][id])!==JSON.stringify(doc)) kept++; }));
  try{ localStorage.setItem("aziz-cut-uploadedAt", String(Date.now())); }catch(e){}
  if(added){ render(); toast("Added "+added+" entr"+(added===1?"y":"ies")+" saved on this phone to your account."+(kept?" "+kept+" already in your account were left as they are.":"")); }
}
/* Outbox: every synced write is kept in localStorage until the db confirms it, retried on reconnect,
 * and days/prefs docs are sent as field merges so phone and PC edits to the same day don't erase each other. */
const outbox = PendingWrites.create({
  storage: window.localStorage, key: "aziz-cut-pending", mergeCols: ["days","prefs"],
  exec: async w => {
    const ref = S.db.collection(w.col).doc(w.id);
    if(w.op==="delete") return ref.delete();
    if(w.fields){ try{ return await ref.update(PendingWrites.pick(w.data, w.fields)); }catch(e){ if(!(e && e.code==="invalid_argument")) throw e; } }
    return ref.set(w.data);
  },
  onChange: n => { const b=document.getElementById("unsaved"); if(!b) return; b.hidden=!n; b.textContent = n+(n===1?" change":" changes")+" not saved yet · tap to retry"; },
  onFail: () => toast("Couldn't reach the server. Kept on this device, will retry.")
});
async function put(col,id,data,{quiet}={}){
  const dl=S.docs.prefs.main; if(col==="workouts" && dl && dl.deloadUntil && dl.deloadFrom && id>=dl.deloadFrom && id<=dl.deloadUntil && data && !data.deload) data={...data,deload:true};
  // the doc as last seen; a day not yet stored counts as the empty default so only the touched fields go out
  const before = S.docs[col][id] ?? (col==="days" ? getDay(id) : col==="prefs" ? {} : undefined);
  S.docs[col] = {...S.docs[col],[id]:data};
  if(!quiet) render();
  if(S.db) await outbox.put(col,id,data,before);
  else saveLocal();
}

const dioSnapshot=()=>{ const o={}; COLS.forEach(c=>o[c]=clone(S.docs[c])); return Object.assign(o, clone(lbCache)); };
async function dioDownload(filename,data){ const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null; if(dl) return dl.save({filename,data});

  toast("Downloads aren't available here."); return false; }

function syncDataCard(){
  const host=document.getElementById("dioHost"); host.hidden = view.tab!=="settings";

      snapshot: dioSnapshot,
      put: async (c,id,doc) => { if(COLS.includes(c)) await put(c,id,doc,{quiet:true}); else { (lbCache[c]=lbCache[c]||{})[id]=doc; if(S.db) await S.db.collection(c).doc(id).set(doc); } },
      remove: async (c,id) => { if(COLS.includes(c)) await remove(c,id); else { delete (lbCache[c]||{})[id]; if(S.db) await S.db.collection(c).doc(id).delete(); } },

const clone = o => JSON.parse(JSON.stringify(o||{}));

async function initStore(){
  loadLocal(); S.mode="local"; render();
  let db = null;
  try{ db = window.claude && await window.claude.use("db"); }catch(e){}
  // On its own website there is no Claude db: sign in to the cloud store instead (modules/cloud-store).
  if(!db && !window.claude && window.CloudStore && (await CloudStore.loadConfig()) && CloudStore.configured()){
    try{ db = await CloudStore.connect({mount:document.body}); }catch(e){ toast("Couldn't reach your account. Saving on this device for now."); }
  }
  if(!db){ setSync(); return; }
  let localOnly = {}; COLS.forEach(c=>localOnly[c]=S.docs[c]||{});
  S.db = db; S.mode="sync"; COLS.forEach(c=>S.docs[c]={});
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(qs=>{
      const o={}; qs.docs.forEach(d=>{ o[d.id]=d.data(); }); S.docs[c]=outbox.overlay(c,o); S.synced.add(c); if(localOnly && COLS.every(k=>S.synced.has(k))){ const l=localOnly; localOnly=null; uploadLocalOnly(l); } scheduleRender();
    }, err=>{ toast("Sync problem: "+err.message); });
  });
  outbox.load(); COLS.forEach(c=>outbox.overlay(c,S.docs[c])); outbox.retryAll();
  window.addEventListener("online", ()=>outbox.retryAll());
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") outbox.retryAll(); });
  setInterval(()=>{ if(outbox.size()) outbox.retryAll(); }, 30000);
  document.getElementById("unsaved").addEventListener("click", ()=>{ toast("Retrying…"); outbox.retryAll().then(()=>toast(outbox.size()?"Still can't reach the server. Your changes are kept on this device.":"All changes saved")); });
  LB_READ.forEach(c=>{ try{ db.collection(c).onSnapshot(qs=>{ const o={}; qs.docs.forEach(d=>{ o[d.id]=d.data(); }); S.docs[c]=o; if(view.tab!=="train") scheduleRender(); }, ()=>{}); }catch(e){} });
  setSync();
}

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
let TODAY = iso(new Date());
const fmt = (s,opt={weekday:"short",month:"short",day:"numeric"}) => parse(s).toLocaleDateString("en-US",opt);
function dayType(s){ const w=parse(s).getDay(); return w===5?"friday":w===6?"saturday":"training"; }

let undoToastEl=null;
function undoToast(msg, onUndo){ if(undoToastEl) undoToastEl.remove(); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); const b=document.createElement("button"); b.type="button"; b.className="undo"; b.textContent="Undo"; t.append(document.createTextNode(msg), b); document.body.appendChild(t); undoToastEl=t; const done=()=>{ clearTimeout(tm); t.remove(); if(undoToastEl===t) undoToastEl=null; }; const tm=setTimeout(done,5000); b.onclick=()=>{ done(); try{ onUndo(); }catch(e){ toast("Could not undo: "+(e.message||e)); } }; }
function totalWater(day){ return window.WaterH ? WaterH.totalWater(day) : (day.water||0); }
function getDay(d){ const day=Object.assign({date:d,food:[],water:0,supps:{},treadmill:false}, clone(S.docs.days[d])); try{ return window.SuppDrinks ? SuppDrinks.migrateDay(day, S.docs.prefs.main||{}) : day; }catch(e){ return day; } }
function dayFluid(day){ try{ return window.SuppDrinks ? SuppDrinks.totalFluid(day) : totalWater(day); }catch(e){ return totalWater(day); } }
function sum(items){ return items.reduce((a,i)=>({kcal:a.kcal+(+i.kcal||0),p:a.p+(+i.p||0),c:a.c+(+i.c||0),f:a.f+(+i.f||0)}),{kcal:0,p:0,c:0,f:0}); }
function isNever(name){ const n=(name||"").toLowerCase(); if(n.includes("french tacos")) return false; return NEVER_KEYS.concat((S.docs.prefs.main?.dislikes||[]).map(x=>x.toLowerCase())).some(k=>k && n.includes(k)); }
function weightsSorted(){ return Object.values(S.docs.weights).filter(w=>w&&w.kg).sort((a,b)=>a.date<b.date?-1:1); }
function avg7(date){ const ws=weightsSorted().filter(w=>w.date<=date && diffDays(w.date,date)<7); return ws.length>=7 ? ws.reduce((a,w)=>a+w.kg,0)/ws.length : null; }
function avgWindow(endDate){ const ws=weightsSorted().filter(w=>w.date<=endDate && diffDays(w.date,endDate)<7); return ws.length ? {avg:ws.reduce((a,w)=>a+w.kg,0)/ws.length,n:ws.length} : null; }

function sessionFor(date){
  const w = S.docs.workouts[date];
  if(w && w.session) return {session:w.session, idx:w.idx, chosen:true};
  const prev = Object.values(S.docs.workouts).filter(x=>x && x.date<date && x.session).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(prev && Number.isInteger(prev.idx)){ const idx=(prev.idx+1)%8; return {session:ROTATION[idx], idx, chosen:false, after:prev}; }
  return null;

function weightChart(){
  const ws=weightsSorted(); if(!ws.length) return `<p class="muted">Log your first weigh-in on the Today tab.</p>`;
  const W=640,H=220,L=44,R=12,T=14,B=28;
  const first=ws[0].date, last=ws[ws.length-1].date, span=Math.max(6,diffDays(first,last));
  const vals=ws.map(w=>w.kg); let lo=Math.floor(Math.min(...vals)-0.6), hi=Math.ceil(Math.max(...vals)+0.6);
  const x=d=>L+(diffDays(first,d)/span)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[]; const step=(hi-lo)>6?2:1; for(let v=lo; v<=hi; v+=step) ticks.push(v);
  const pts=ws.map(w=>`${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(" ");
  const avgPts=ws.map(w=>{const a=avg7(w.date); return a?`${x(w.date).toFixed(1)},${y(a).toFixed(1)}`:null}).filter(Boolean).join(" ");
  const lastW=ws[ws.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Morning weight over time">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join("")}
    <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fmt(first,{month:"short",day:"numeric"})}</text>
    <text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(addDays(first,span),{month:"short",day:"numeric"})}</text>
    ${ws.length>1?`<polyline points="${pts}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>`:""}
    ${ws.map(w=>`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3.5" fill="var(--muted)"/>`).join("")}
    ${avgPts.includes(" ")?`<polyline points="${avgPts}" fill="none" stroke="var(--accent)" stroke-width="3"/>`:""}
    <circle cx="${x(lastW.date)}" cy="${y(lastW.kg)}" r="5.5" fill="var(--accent)"/>
  </svg>
  <p class="muted" style="font-size:.82rem">Dots = daily weigh-ins. Blue line = 7-day average (shows once there are 7 readings in a week).</p></div>`;
}
function weightHero(){
  const ws=weightsSorted(), lastW=ws[ws.length-1];

  const pct = Math.max(0,Math.min(100, lost/(START.kg-GOAL_KG)*100));
  const wkNow = lastW ? avgWindow(lastW.date) : null, wkPrev = lastW ? avgWindow(addDays(lastW.date,-7)) : null;
  const rate = (wkNow && wkPrev && wkNow.n>=4 && wkPrev.n>=4) ? wkNow.avg-wkPrev.avg : null;
  const strictDays = Array.from({length:14},(_,i)=>addDays(STRICT.from,i));
  const logged = strictDays.filter(d=>S.docs.weights[d]).length;
  let table=[], prev=null;
  ws.forEach((w,i)=>{ const a=avg7(w.date); table.push({...w,n:diffDays(START.date,w.date)+1,ch:prev?w.kg-prev.kg:null,a}); prev=w; });
  table.reverse();
  return `<div class="card hero">
    <div class="spread"><h2>${lastW?`${lastW.kg.toFixed(1)} kg`:"No weigh-ins yet"}</h2><span class="label">Goal ${GOAL_KG} kg</span></div>

const GUIDE_SECTIONS = () => [
  {id:"rules", t:"Your cut rules", h:`<ul>
      <li>${fkc(TARGET.kcal)} kcal a day. Don't drop below ${fkc(KCAL_FLOOR)}, and don't add exercise calories back.</li>
      <li>Protein 160–170 g minimum. Fat ~55–70 g, carbs make up the rest (~180–220 g).</li>
      <li>Judge progress by weekly averages, never one weigh-in.</li>
      <li>Target loss: 0.5–1% of body weight a week, about 0.5–0.8 kg for you.</li>
      <li>Keep lifting heavy. The cut is for fat; the training keeps the muscle.</li>
      <li>Gatorade counts inside the ${fkc(TARGET.kcal)} on training days.</li>
      <li>Friday is a free day, not a dirty day.</li>
    </ul>`},
  {id:"train", t:"How to train on a cut", h:`<ul>
      <li><b>Double progression:</b> pick a rep range (8–12). When you hit the top of the range on every set, add weight next time and start back at the bottom.</li>
      <li><b>Effort:</b> stop 1–2 reps short of failure on most sets. Last set of an isolation move can go to failure.</li>
      <li><b>Rest:</b> 2.5–3 min on big compounds (bench, hack squat, rows), 1.5–2 min on isolation.</li>
      <li><b>Control:</b> lower the weight in 2–3 seconds and get a full stretch. Most growth comes from the stretched position.</li>
      <li><b>Warm up:</b> 2–4 ramping sets on the first compound, like your bench: bar, 40, 60, 70 kg.</li>
      <li><b>Hamstrings:</b> about 5 hard sets per cycle right now. Seated leg curls are a good add later.</li>
    </ul>`},
  {id:"pre", t:"Pre-workout food", h:`<ul>
      <li>Moderate meal (like the Saturday eggs): allow 1.5–2 h before training.</li>
      <li>Light, higher-carb meal: 60–90 min is enough.</li>
      <li>Keep fat lower before training; it slows digestion.</li>
      <li>Get protein in too. If you've already eaten enough, you don't need an extra bar or shake.</li>
    </ul>`},
  {id:"hydr", t:"Hydration", h:`<ul>
      <li>Rest days ~3 L total fluids. Training days ~3.5–4 L, including the Gatorade.</li>
      <li>Drink to thirst; aim for pale-yellow urine.</li>
      <li>Keep intake steady day to day. Swings in water and salt move the scale.</li>
      <li>Don't drink more than ~1 L per hour.</li>
    </ul>`},
  {id:"supps", t:"Supplements", h:`<ul>
      <li><b>Creatine 5 g:</b> more strength and reps over time. Holds 1–2 kg of steady water, which doesn't distort the trend. You won't "feel" it.</li>
      <li><b>Omega-3:</b> heart and joint health. Since you don't eat fish, 2–3 capsules a day is an optional upgrade.</li>
      <li><b>Vitamin D3 4,000 IU:</b> take it with a meal that has fat. That's the upper limit; don't go higher without a blood test.</li>
      <li><b>Magnesium bisglycinate:</b> in the evening; may help sleep. Gentle on the stomach.</li>

];

    const n=el.dataset.set, i=+el.dataset.i, k=el.dataset.k;

/* Strong CSV import (StrongCSV module) */
function importStrong(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const {docs, report} = StrongCSV.toWorkouts(String(fr.result), {program:programEff(), rotation:ROTATION, existing:S.docs.workouts});
      const list = Array.isArray(docs) ? docs : Object.values(docs);
      let sets=0; list.forEach(doc=>{ Object.values(doc.sets||{}).forEach(a=>sets+=a.length); put("workouts",doc.date,doc,{quiet:true}); });
      const un = (report && report.unmatched) || {};
      const unNames = Array.isArray(un) ? un.map(u=>typeof u==="string"?u:(u.name||"")).filter(Boolean) : Object.keys(un);
      view.strongMsg = `Imported <b>${list.length}</b> workout${list.length===1?"":"s"} with <b>${sets}</b> sets.` + (unNames.length?` Not in your program (saved under their own names): ${unNames.map(esc).join(", ")}.`:"");
    }catch(err){ view.strongMsg = "Couldn't read that file. Export it again from Strong as CSV and pick that file."; }
    render();
  };
  fr.onerror=()=>{ view.strongMsg="Couldn't open that file."; render(); };
  fr.readAsText(file);
}

/* rest timer: a bar above the tabs with −15 / +15 / Skip, like Strong */
let tInt=null, tEnd=0, tTotal=0;
function tickTimer(){
  const el=document.getElementById("timer"); const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  el.innerHTML=`<span class="tbar" style="width:${tTotal?Math.min(100,Math.max(0,100-left/tTotal*100)):100}%"></span><span class="label" style="color:inherit">${left?"Rest":"Go"}</span><span class="num">${Math.floor(left/60)}:${pad(left%60)}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><button type="button" data-t="-15" aria-label="15 seconds less">−15</button><button type="button" data-t="15" aria-label="15 seconds more">+15</button><button type="button" data-t="stop" id="tStop">${left?"Skip":"Done"}</button></span>`;
  if(!left){ clearInterval(tInt); tInt=null; restCue("rest-stop"); if(lbPref("sound")) window.GymSounds&&(GymSounds.play(lbRestSound())||GymSounds.play("restDone")); if(lbPref("vibrate")) try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){} }
}
// Quick log uses the logger's "Beep / Vibrate when rest ends" settings, and the same lb:rest events so
// the Android shell schedules the locked-screen "Rest is over" notification for it too.
function lbPref(k){ try{ return !(window.WorkoutLogger && WorkoutLogger.settings && WorkoutLogger.settings()[k]===false); }catch(_){ return true; } }
function lbRestSound(){ const s=lbSettings(); return (s&&s.restSound)||"restDone"; }
function restCue(kind){ try{ window.dispatchEvent(new CustomEvent("lb:"+kind, {detail:{end:tEnd, total:tTotal, sound:lbRestSound()}})); }catch(_){} }
function startTimer(sec){ const el=document.getElementById("timer"); tEnd=Date.now()+sec*1000; tTotal=sec; clearInterval(tInt); el.hidden=false; if(window.GymSounds) GymSounds.prime(); restCue("rest"); tickTimer(); tInt=setInterval(tickTimer,500); }
document.getElementById("timer").addEventListener("click",e=>{
  const b=e.target.closest("button[data-t]"); if(!b) return;
  if(b.dataset.t==="stop"){ clearInterval(tInt); tInt=null; restCue("rest-stop"); document.getElementById("timer").hidden=true; return; }
  const dt=+b.dataset.t; tEnd=Math.max(Date.now(), tEnd+dt*1000); tTotal=Math.max(15, tTotal+dt);
  restCue("rest"); clearInterval(tInt); tInt=setInterval(tickTimer,500); tickTimer();
});

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column app shell, sticky date header, tabs on top (desktop) or a bottom bar (phone).
   Colours, type and motion come from the shared "Plate" theme kit (theme.css + motion.css). */
/* ==========================================================================
   Fitness app theme  ·  "Plate" system
   Neutrals: cool chalk (light) and gunmetal (dark).
   Accents: named after Olympic bumper plates (25 kg red, 20 kg blue,
   15 kg yellow, 10 kg green). Pick one with <html data-accent="blue">.
   Mode: <html data-theme="light|dark">, or no attribute to follow the system.
   Fonts (Google Fonts):
   https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap
   ========================================================================== */

:root {
  /* ---- Neutrals (light) ---- */
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --surface-2: #E7EBEF;
  --surface-3: #DAE0E6;
  --fg: #12161B;
  --fg-muted: #586370;
  --fg-faint: #8A949F;
  --line: #D3DAE1;
  --overlay: rgba(18, 22, 27, .45);

  /* ---- Accent palettes (each has a light and dark value) ---- */
  --accent-light: #1F5FD1;  --accent-dark: #6B9BF5;      /* default: 20 kg blue */
  --on-accent-light: #FFFFFF; --on-accent-dark: #0B1222;
  --accent: var(--accent-light);
  --on-accent: var(--on-accent-light);
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));

  /* ---- Macros (fixed across accents so charts stay readable) ---- */
  --protein: #6E52D4;
  --carbs: #D07F12;
  --fat: #158C8C;
  --kcal: var(--fg);

  /* ---- Status ---- */
  --good: #1E8A4C;
  --warn: #B86E00;
  --bad: #C8352E;

  /* ---- Type ---- */
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --text-xs: .75rem;    /* 12  captions, units */
  --text-sm: .875rem;   /* 14  secondary */
  --text-md: 1rem;      /* 16  body */
  --text-lg: 1.25rem;   /* 20  card titles */
  --text-xl: 1.75rem;   /* 28  screen titles (display) */
  --text-2xl: 2.5rem;   /* 40  hero numbers (display) */
  --text-3xl: 3.5rem;   /* 56  ring centre, PR number */

  /* ---- Space (4px grid) ---- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  /* ---- Shape & depth ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(18, 22, 27, .06), 0 1px 1px rgba(18, 22, 27, .04);
  --shadow-2: 0 6px 20px rgba(18, 22, 27, .10), 0 2px 6px rgba(18, 22, 27, .06);
  --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);

  --tap: 44px; /* minimum touch target */

  color-scheme: light;
}

/* ---- Accent choices ---- */
[data-accent="red"]    { --accent-light: #D0302A; --accent-dark: #F2665D; --on-accent-light: #FFFFFF; --on-accent-dark: #220B0A; }
[data-accent="blue"]   { --accent-light: #1F5FD1; --accent-dark: #6B9BF5; --on-accent-light: #FFFFFF; --on-accent-dark: #0B1222; }
[data-accent="yellow"] { --accent-light: #A87300; --accent-dark: #F2C230; --on-accent-light: #FFFFFF; --on-accent-dark: #221A02; }
[data-accent="green"]  { --accent-light: #1B8048; --accent-dark: #43C47E; --on-accent-light: #FFFFFF; --on-accent-dark: #06200F; }

/* ---- Dark (system setting, unless light was chosen) ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1013; --surface: #161A1F; --surface-2: #1F252C; --surface-3: #29303A;
    --fg: #EDF0F3; --fg-muted: #9AA4AF; --fg-faint: #6B7580; --line: #2A323B;
    --overlay: rgba(0, 0, 0, .6);
    --accent: var(--accent-dark); --on-accent: var(--on-accent-dark);
    --protein: #A08BF2; --carbs: #F0AE4A; --fat: #3CC4C4;
    --good: #43C47E; --warn: #F2A93B; --bad: #F2665D;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 8px 24px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
/* ---- Dark (chosen explicitly) ---- */
:root[data-theme="dark"] {
  --bg: #0D1013; --surface: #161A1F; --surface-2: #1F252C; --surface-3: #29303A;
  --fg: #EDF0F3; --fg-muted: #9AA4AF; --fg-faint: #6B7580; --line: #2A323B;
  --overlay: rgba(0, 0, 0, .6);
  --accent: var(--accent-dark); --on-accent: var(--on-accent-dark);
  --protein: #A08BF2; --carbs: #F0AE4A; --fat: #3CC4C4;
  --good: #43C47E; --warn: #F2A93B; --bad: #F2665D;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 8px 24px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* ==========================================================================
   Aliases for the app shell's existing token names (APP-SHELL.md).
   Inline this file in place of the app's own color/font token blocks;
   these follow mode and accent changes automatically.
   ========================================================================== */
:root {
  --sunk: var(--surface-2);
  --ink: var(--fg);
  --muted: var(--fg-muted);
  --accent-ink: var(--on-accent);
  --display: var(--font-display);
  --body: var(--font-body);
  --mono: var(--font-mono);
  --r: var(--radius-md);
}

/* ==========================================================================
   Fitness app motion
   Rule of thumb: motion confirms an action (a set logged, a meal eaten)
   or shows progress (rings, bars). It never delays reading.
   Everything collapses to instant under prefers-reduced-motion.
   ========================================================================== */

:root {
  --dur-tap: 120ms;     /* press feedback */
  --dur-ui: 220ms;      /* toggles, tabs, sheets */
  --dur-enter: 420ms;   /* cards entering a screen */
  --dur-fill: 900ms;    /* rings and bars filling */
  --dur-celebrate: 1200ms;

  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  --stagger: 50ms;      /* per item, via style="--i: 2" */
}

/* ---- Press feedback: any button or tappable card ---- */
.tap { transition: transform var(--dur-tap) var(--ease-out), background-color var(--dur-ui) var(--ease-out); }
.tap:active { transform: scale(.97); }

/* ---- Screen entry: cards rise in, staggered by --i ---- */
@keyframes fit-rise { from { opacity: 0; transform: translateY(12px); } }
.anim-rise {
  animation: fit-rise var(--dur-enter) var(--ease-out) backwards;
  animation-delay: calc(var(--i, 0) * var(--stagger));
}

/* ---- Pop: checking off a set, marking a meal as eaten ---- */
@keyframes fit-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.anim-pop { animation: fit-pop 320ms var(--ease-spring); }

/* ---- Check mark draws itself (SVG path with pathLength="1") ---- */
@keyframes fit-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.anim-draw { stroke-dasharray: 1; animation: fit-draw 260ms var(--ease-out) both; }

/* ---- Progress ring: SVG circle with pathLength="100".
        Set style="--value: 82" (0-100) and the ring animates to it. ---- */
.ring-track { stroke: var(--surface-2); }
.ring-fill {
  stroke: var(--accent);
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: calc(100 - min(var(--value, 0), 100));
  transition: stroke-dashoffset var(--dur-fill) var(--ease-out);
  transform: rotate(-90deg);
  transform-origin: center;
}
.ring-fill.is-over { stroke: var(--warn); }

/* ---- Bars (macros, volume): width set via --value (0-100) ---- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span {
  display: block; height: 100%; border-radius: inherit;
  width: calc(min(var(--value, 0), 100) * 1%);
  background: var(--bar-color, var(--accent));
  transition: width var(--dur-fill) var(--ease-out);
}

/* ---- Tab / screen switch fallback (when View Transitions aren't supported) ---- */
@keyframes fit-slide-in-r { from { opacity: 0; transform: translateX(24px); } }
@keyframes fit-slide-in-l { from { opacity: 0; transform: translateX(-24px); } }
.anim-in-right { animation: fit-slide-in-r var(--dur-ui) var(--ease-out) backwards; }
.anim-in-left  { animation: fit-slide-in-l var(--dur-ui) var(--ease-out) backwards; }

/* ---- View Transitions (Chrome, Safari 18+): used by FitMotion.switchView ---- */
::view-transition-old(root),
::view-transition-new(root) { animation-duration: var(--dur-ui); animation-timing-function: var(--ease-out); }
::view-transition-old(fit-screen) { animation: var(--dur-ui) var(--ease-out) both fit-out; }
::view-transition-new(fit-screen) { animation: var(--dur-ui) var(--ease-out) both fit-slide-in-r; }
:root[data-nav="back"]::view-transition-new(fit-screen) { animation-name: fit-slide-in-l; }
@keyframes fit-out { to { opacity: 0; } }

/* ---- Bottom sheet (add food, log weight) ---- */
.sheet {
  transform: translateY(100%);
  transition: transform var(--dur-ui) var(--ease-out);
}
.sheet.is-open { transform: translateY(0); }

/* ---- Rest timer: soft pulse in the last 10 seconds ---- */
@keyframes fit-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
  50%      { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 0%, transparent); }
}
.anim-pulse { animation: fit-pulse 1s var(--ease-in-out) infinite; }

/* ---- Loading placeholder ---- */
@keyframes fit-shimmer { to { background-position: -200% 0; } }
.skeleton {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
  background-size: 200% 100%;
  animation: fit-shimmer 1.4s linear infinite;
}

/* ---- New PR: number lifts and a burst of plate-colored pieces (FitMotion.celebrate) ---- */
@keyframes fit-lift {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-6px) scale(1.12); }
  100% { transform: translateY(0) scale(1); }
}
.anim-pr { animation: fit-lift 600ms var(--ease-spring); color: var(--accent); }
.fit-burst-piece {
  position: absolute; width: 8px; height: 4px; border-radius: 1px;
  pointer-events: none;
  animation: fit-burst var(--dur-celebrate) var(--ease-out) forwards;
}
@keyframes fit-burst {
  from { transform: translate(0, 0) rotate(0); opacity: 1; }
  to   { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
}

/* ---- Theme switch: colors cross-fade instead of snapping ---- */
:root.is-theming, :root.is-theming * {
  transition: background-color var(--dur-ui) var(--ease-out),
              color var(--dur-ui) var(--ease-out),
              border-color var(--dur-ui) var(--ease-out),
              fill var(--dur-ui) var(--ease-out),
              stroke var(--dur-ui) var(--ease-out) !important;
}

/* ---- Reduced motion: keep state changes, drop movement ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .fit-burst-piece { display: none; }
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--accent)}
.datepick{display:flex;align-items:center;gap:6px}
.datepick .d{min-width:9.5em;text-align:center;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.today-link{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px}
nav.tabs{display:flex;gap:4px;padding-bottom:8px}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:var(--display);font-size:1.1rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sync{font-size:.75rem;color:var(--muted)}
.unsaved{margin-left:8px;border:1px solid var(--warn,#c77d00);color:var(--warn,#c77d00);background:transparent;border-radius:999px;padding:1px 8px;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{padding:8px 6px;font-size:1rem;flex:1}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .datepick .d{min-width:8em}
}

#lbHost,#ppHost,#dioHost{padding-block:0 40px}
@media (max-width:720px){#lbHost,#ppHost,#dioHost{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
main{padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:.88rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rest{border-style:dashed}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--accent)}
input[type=number],input[type=text],input[type=search],select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{width:5.2em}
.field{display:flex;flex-direction:column;gap:4px}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:.92rem}
.note.info{border-color:var(--accent)}
.note.bad{border-color:var(--bad)}

/* macro bars */
.macros{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center}
.mbar{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.mbar .planned{position:absolute;inset:0 auto 0 0;opacity:.28}
.mbar .eaten{position:absolute;inset:0 auto 0 0}
.mbar .zone{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.5}
.mval{font-family:var(--mono);font-size:.85rem;white-space:nowrap;text-align:right}
.kcal{background:var(--ink)} .p{background:var(--protein)} .c{background:var(--carbs)} .f{background:var(--fat)}
.bigk{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:5.6em 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.tl li:first-child{border-top:0}
.tl .t{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding-top:1px}

/* list items */
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:.78rem}
.item .mac{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.item.planned .nm b{font-weight:500;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--good)}

/* exercises */
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:8px;padding:4px 6px}
.set .i{font-family:var(--mono);font-size:.75rem;color:var(--muted);width:1.2em}
.set input{width:4.2em;background:var(--surface)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
details ul{margin:6px 0 0;padding-left:1.1em}
.timer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .num{font-size:1.4rem}
.timer button{background:transparent;border:1px solid var(--bg);color:var(--bg);border-radius:6px;padding:3px 8px;cursor:pointer}
@media (max-width:720px){.timer{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.banned td{color:var(--muted);text-decoration:line-through}
/* phones: let text columns wrap so Food and Main lifts tables fit a 360 px screen; numbers stay on one line */
@media (max-width:480px){
  table{font-size:.82rem}
  th,td{padding:6px 5px;white-space:normal;overflow-wrap:anywhere}
  td.n,th.n{white-space:nowrap;padding-left:4px;padding-right:4px}
  th{font-size:.62rem;letter-spacing:.04em}
  td .btn.small{padding:4px 8px;font-size:.78rem}
}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat .v{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.05}
.prog{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.days14{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.days14 span{height:26px;border-radius:4px;background:var(--sunk);font-family:var(--mono);font-size:.62rem;display:grid;place-items:center;color:var(--muted)}
.days14 span.has{background:var(--accent);color:var(--accent-ink)}
.days14 span.today{outline:2px solid var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.guide p+p{margin-top:8px}
.guide ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
.lib{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.lib .card{gap:6px}
.lib .card ul{font-size:.92rem}
.err-banner{background:var(--bad,#b3261e);color:#fff;padding:8px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between}.err-banner button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
.card.broken{border-style:dashed;opacity:.85}.card.broken details{font-size:.8rem}.card.broken pre{white-space:pre-wrap;font-size:.75rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:20;font-size:.9rem;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 24px)}
.toast .undo{background:none;border:0;color:var(--accent,#7cc4ff);font:inherit;font-weight:700;padding:0;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
/* Sign-in sheet on the app's own website (modules/cloud-store) */
.cs-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgb(0 0 0/.45)}
.cs-card{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.cs-card .field input{width:100%}

/* Outbox: every synced write is kept in localStorage until the db confirms it, retried on reconnect,
 * and days/prefs docs are sent as field merges so phone and PC edits to the same day don't erase each other. */
const outbox = PendingWrites.create({
  storage: window.localStorage, key: "aziz-cut-pending", mergeCols: ["days","prefs"],
  exec: async w => {
    const ref = S.db.collection(w.col).doc(w.id);
    if(w.op==="delete") return ref.delete();
    if(w.fields){ try{ return await ref.update(PendingWrites.pick(w.data, w.fields)); }catch(e){ if(!(e && e.code==="invalid_argument")) throw e; } }
    return ref.set(w.data);
  },
  onChange: n => { const b=document.getElementById("unsaved"); if(!b) return; b.hidden=!n; b.textContent = n+(n===1?" change":" changes")+" not saved yet · tap to retry"; },
  onFail: () => toast("Couldn't reach the server. Kept on this device, will retry.")
});
async function put(col,id,data,{quiet}={}){
  const dl=S.docs.prefs.main; if(col==="workouts" && dl && dl.deloadUntil && dl.deloadFrom && id>=dl.deloadFrom && id<=dl.deloadUntil && data && !data.deload) data={...data,deload:true};
  // the doc as last seen; a day not yet stored counts as the empty default so only the touched fields go out
  const before = S.docs[col][id] ?? (col==="days" ? getDay(id) : col==="prefs" ? {} : undefined);
  S.docs[col] = {...S.docs[col],[id]:data};
  if(!quiet) render();
  if(S.db) await outbox.put(col,id,data,before);
  else saveLocal();
}

async function dioDownload(filename,data){ const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null; if(dl) return dl.save({filename,data});
  // Own website: a plain browser download.
  if(!window.claude && typeof data==="string"){ const type=/\.ics$/i.test(filename)?"text/calendar":/\.json$/i.test(filename)?"application/json":"text/plain"; const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000); return true; }
  toast("Downloads aren't available here."); return false; }
/* One-tap backup (Today nudge): same file as the Your data card, stamps prefs/main.lastBackup */
async function backupNow(){

}
function backupNudge(){
  if(!window.DataIO || S.mode==="loading") return "";

    <div class="spread"><span class="label">Backup</span><span class="pill warn">${esc(bs.label)}</span></div>
    <p class="muted">${bs.lastBackup?`Everything you log lives in this app's database. A fresh file every week keeps it safe.`:`Your food, weights, workouts and settings are only in this app. Save a copy to your phone.`}</p>

}

function trainSwitch(){
  return `<div class="row" role="group" aria-label="Logger style"><button class="chip" data-act="tmode" data-m="quick" aria-pressed="${view.trainMode==="quick"}">Quick log</button><button class="chip" data-act="tmode" data-m="full" aria-pressed="${view.trainMode==="full"}">Full logger (Strong-style)</button></div>`;
}
function effortBits(){
  if(!window.EffortDeload) return {nudge:"",picker:""};
  const d=view.date, w=S.docs.workouts[d];
  let nudge=""; try{ nudge=EffortDeload.nudgeHtml(EffortDeload.analyze(S.docs.workouts,{today:TODAY, dismissedAt:S.docs.prefs.main?.deloadDismissedAt})); }catch(e){}
  const has = w && w.session!=="Rest" && w.sets && Object.values(w.sets).some(a=>(a||[]).some(x=>x.w||x.r));
  const picker = has ? safe("Effort", ()=>EffortDeload.pickerHtml(d, w.effort)) : "";
  return {nudge, picker};
}
function vTrain(){ const eb=effortBits(), ses=sessionFor(view.date); const cardio = (ses && ses.session==="Rest") ? "" : shortCardioMin(view.date)===0 ? `<div class="card"><h3>Cardio</h3><p class="muted">Skipped today: the short session uses the time for lifting. <button class="btn ghost small" data-act="ssclear">Back to the full session</button></p></div>` : cdSafe(()=>`<div id="cdoHost">${Cardio.cardHTML(view.date, cdDocsDay(view.date), cardioOpts)}</div>`); const run = safeMod("RunTracker",()=>RunTracker.cardHTML(view.date, S.docs)); const feel = window.MuscleFeedback ? safe("Muscle feedback", ()=>MuscleFeedback.cardHtml(S.docs.workouts[view.date], view.date, mfOpts())) : ""; return rfSafe(()=>RecoveryFatigue.warningsHtml(RecoveryFatigue.fatigue(S.docs, rfOpts()))) + safeMod("MuscleMap",()=>MuscleMap.html(S.docs, mmOpts())) + eb.nudge + safe("Workout", vTrainBody) + eb.picker + feel + cardio + run; }
function vTrainBody(){ return view.trainMode==="full" ? `<div class="card">${trainSwitch()}<p class="muted" style="font-size:.88rem">Templates, live workout with rest timer, PRs, plate calculator and history. Finished workouts also land in Today, Progress and the weekly report.</p></div>` : `<div>${trainSwitch()}</div>` + vTrainSession() + otherLogged() + strongCard(); }
function otherLogged(){
  const d=view.date, wk=S.docs.workouts[d]; if(!wk||!wk.sets) return "";
  const known=new Set((PROGRAM[wk.session]||[]).map(e=>e[0]).concat(Object.keys(wk.swapped||{})));
  const extra=Object.keys(wk.sets).filter(n=>!known.has(n) && (wk.sets[n]||[]).some(x=>x.w||x.r));
  if(!extra.length) return "";
  return `<div class="card"><h3>Other exercises logged</h3>${wk.source==="strong"?`<p class="muted" style="font-size:.88rem">Imported from Strong${wk.strong&&wk.strong.title?`: ${esc(wk.strong.title)}`:""}</p>`:""}<div class="items">${extra.map(n=>`<div class="item" style="grid-template-columns:1fr auto"><b>${esc(n)}</b><span class="mac">${wk.sets[n].filter(x=>x.w||x.r).map(x=>`${esc(x.w)}×${esc(x.r)}`).join(", ")}</span></div>`).join("")}</div></div>`;
}
function strongCard(){
  return `<div class="card"><div class="spread"><h3>Import from Strong</h3><label class="btn ghost small" style="cursor:pointer">Choose CSV file<input type="file" id="strongFile" accept=".csv,text/csv" hidden></label></div>
  <p class="muted" style="font-size:.9rem">In Strong, open Settings, then Export Strong Data, and pick the CSV here. Warm-ups are skipped, weights convert to each exercise's unit, and importing again replaces that day's Strong sets instead of doubling them.</p>
  ${view.strongMsg?`<p class="note info">${view.strongMsg}</p>`:""}</div>`;
}
function usedFor(wk, planName){ const m=(wk&&wk.swapped)||{}; return Object.keys(m).find(u=>m[u]===planName) || null; }
function swapState(){ return clone(S.docs.prefs.swaps || (window.ExerciseSwap ? ExerciseSwap.empty() : {})); }
function workoutDoc(d){ const w=Object.assign({date:d,sets:{}},clone(S.docs.workouts[d])); if(!w.session){ const ses=sessionFor(d); if(ses){ w.session=ses.session; w.idx=ses.idx; } } return w; }
function doSwap(planName, usedName, reason){
  const d=view.date; let w=workoutDoc(d);
  const prev=usedFor(w, planName); if(prev){ w=ExerciseSwap.linkSwap(w, null, prev); }
  w = usedName ? ExerciseSwap.linkSwap(w, planName, usedName) : w;
  put("workouts", d, w);
  if(usedName) put("prefs","swaps", ExerciseSwap.recordSwap(swapState(), {date:d, session:w.session, from:planName, to:usedName, reason:reason||"taken"}), {quiet:true});
}
function openSwap(planName){
  const d=view.date, w=workoutDoc(d), others=(PROGRAM[w.session]||[]).map(e=>e[0]).filter(n=>n!==planName);
  ExerciseSwap.openSheet({exercise:planName, state:swapState(), workouts:S.docs.workouts, exclude:others,
    onPick:opt=>{ doSwap(planName, opt.name, "taken"); toast(`Swapped to ${opt.name}. Sets log under its own name.`); },
    onHurt:note=>{ put("prefs","swaps", ExerciseSwap.flagHurt(swapState(), planName, {date:d, note})); toast("Flagged. The app will suggest a swap next time."); },
    onFine:()=>{ put("prefs","swaps", ExerciseSwap.clearHurt(swapState(), planName)); }
  });
}
function mountSwapNotice(){
  const el=document.getElementById("xsNotice"); if(!el || !window.ExerciseSwap) return;
  const w=S.docs.workouts[view.date]||{}, ses=w.session||(sessionFor(view.date)||{}).session;
  if(!ses || !PROGRAM[ses]) return;
  try{ ExerciseSwap.renderNotice(el, {exercises:PROGRAM[ses], state:swapState(), workouts:S.docs.workouts,
    onSwap:(exercise,opt)=>{ doSwap(typeof exercise==="string"?exercise:exercise[0]||exercise.name, opt.name, "hurt"); },
    onKeep:exercise=>{ put("prefs","swaps", ExerciseSwap.clearHurt(swapState(), typeof exercise==="string"?exercise:exercise[0]||exercise.name)); } }); }catch(e){}
}
/* Travel workout: dumbbell / band / bodyweight version of today's session (TravelWorkout module). */

/* BreakRamp: lighter weights after 7+ days off a lift (nothing stored) */
const brStep = (name,unit) => unit==="lb" ? 5 : /\bDB\b|Dumbbell/i.test(name) ? 2 : 2.5;
function brPlan(name,unit){ try{ return window.BreakRamp ? BreakRamp.plan(BreakRamp.fromShell(S.docs.workouts, name).filter(h=>h.date<view.date), {today:view.date, step:brStep(name,unit)}) : null; }catch(e){ return null; } }
function brCard(rows){ if(!window.BreakRamp) return ""; try{
  return ["kg","lb"].map(u=>{ const names=rows.filter(r=>r.unit===u).map(r=>r.name); if(!names.length) return "";
    const lifts=names.map(n=>({name:n, ...brPlan(n,u)})).filter(l=>l.ramp); return lifts.length ? BreakRamp.cardHtml({lifts, count:lifts.length}, u) : ""; }).join("");
}catch(e){ return ""; } }
function vTrainSession(){
  const d=view.date, ses=sessionFor(d), wk=S.docs.workouts[d]||{};

      let cmp="";

        ${isMain&&dropping(name)?`<p class="note bad">Dropped 2 sessions in a row. Check sleep, pre-workout food and volume before touching calories.</p>`:""}
        ${brOn?BreakRamp.noteHtml(brp, unit):""}
        <div class="sets">${Array.from({length:n},(_,i)=>{ const s=logged[i]||{}; const phw = brOn && brp.sets[Math.min(i, brp.sets.length-1)] ? brp.sets[Math.min(i, brp.sets.length-1)].w : bw; return `<div class="set"><span class="i">${i+1}</span>
          <input type="number" inputmode="decimal" step="0.5" placeholder="${phw}" value="${esc(s.w??"")}" data-set="${esc(name)}" data-i="${i}" data-k="w" aria-label="${esc(name)} set ${i+1} weight ${unit}"><span class="muted">${unit} ×</span>
          <input type="number" inputmode="numeric" placeholder="${br}" value="${esc(s.r??"")}" data-set="${esc(name)}" data-i="${i}" data-k="r" aria-label="${esc(name)} set ${i+1} reps"></div>`; }).join("")}
          <button class="btn ghost small" data-act="addset" data-n="${esc(name)}">+ set</button></div>

  </div>`;

function runPicker(){
  const P=window.NutreezePicker, d=view.date, text=document.getElementById("menuText").value;
  try{ localStorage.setItem("aziz-cut-menu",text); }catch(e){}

  if(ok.length<2){ view.pick={date:d,error:"Add at least 2 meals, each as: name kcal protein carbs fat."}; render(); return; }
  const dt=pickerDayType(d);

  const skipped = ok.filter(m=>P.bannedReason(m,bans)).map(m=>m.name);
  view.pick = r.options && r.options.length ? {date:d, options:r.options, fixed:r.fixed, skipped} : {date:d, error:"No combination fits. Add more meals from the menu.", skipped};
  render();
}
function usePick(i){
  const P=window.NutreezePicker, d=view.date, o=view.pick.options[i];
  const items = P.toFoodItems(o, view.pick.fixed).map(it=>({...it, id:uid(), slot:SLOT_MAP[it.slot]||it.slot, eaten:false}));
  const day=getDay(d);
  day.food = day.food.filter(x=>x.eaten).concat(items.filter(it=>!day.food.some(x=>x.eaten && x.name===it.name)));
  view.pick=null; saveDay(day); toast("Plan added. Tick items as you eat them.");
}

/* ---------- PROGRESS ---------- */
function weightChart(){
  const ws=weightsSorted(); if(!ws.length) return `<p class="muted">Log your first weigh-in on the Today tab.</p>`;
  const W=640,H=220,L=44,R=12,T=14,B=28;
  const first=ws[0].date, last=ws[ws.length-1].date, span=Math.max(6,diffDays(first,last));
  const vals=ws.map(w=>w.kg); let lo=Math.floor(Math.min(...vals)-0.6), hi=Math.ceil(Math.max(...vals)+0.6);
  const x=d=>L+(diffDays(first,d)/span)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[]; const step=(hi-lo)>6?2:1; for(let v=lo; v<=hi; v+=step) ticks.push(v);
  const pts=ws.map(w=>`${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(" ");
  const avgPts=ws.map(w=>{const a=avg7(w.date); return a?`${x(w.date).toFixed(1)},${y(a).toFixed(1)}`:null}).filter(Boolean).join(" ");
  const lastW=ws[ws.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Morning weight over time">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join("")}
    <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fmt(first,{month:"short",day:"numeric"})}</text>
    <text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(addDays(first,span),{month:"short",day:"numeric"})}</text>
    ${ws.length>1?`<polyline points="${pts}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>`:""}
    ${ws.map(w=>`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3.5" fill="var(--muted)"/>`).join("")}
    ${avgPts.includes(" ")?`<polyline points="${avgPts}" fill="none" stroke="var(--accent)" stroke-width="3"/>`:""}
    <circle cx="${x(lastW.date)}" cy="${y(lastW.kg)}" r="5.5" fill="var(--accent)"/>
  </svg>
  <p class="muted" style="font-size:.82rem">Dots = daily weigh-ins. Blue line = 7-day average (shows once there are 7 readings in a week).</p></div>`;
}

    try{
      const {docs, report} = StrongCSV.toWorkouts(String(fr.result), {program:PROGRAM, rotation:ROTATION, existing:S.docs.workouts});
      const list = Array.isArray(docs) ? docs : Object.values(docs);
      let sets=0; list.forEach(doc=>{ Object.values(doc.sets||{}).forEach(a=>sets+=a.length); put("workouts",doc.date,doc,{quiet:true}); });
      const un = (report && report.unmatched) || {};
      const unNames = Array.isArray(un) ? un.map(u=>typeof u==="string"?u:(u.name||"")).filter(Boolean) : Object.keys(un);
      view.strongMsg = `Imported <b>${list.length}</b> workout${list.length===1?"":"s"} with <b>${sets}</b> sets.` + (unNames.length?` Not in your program (saved under their own names): ${unNames.map(esc).join(", ")}.`:"");
    }catch(err){ view.strongMsg = "Couldn't read that file. Export it again from Strong as CSV and pick that file."; }
    render();
  };
  fr.onerror=()=>{ view.strongMsg="Couldn't open that file."; render(); };
  fr.readAsText(file);
}

/* Full workout logger (WorkoutLogger module), mounted once into its own host so re-renders don't wipe it */
let lbMounted=false;
function syncLogger(){
  const host=document.getElementById("lbHost"), show = view.tab==="train" && view.trainMode==="full";
  host.hidden = !show;
  if(!show || lbMounted || !window.WorkoutLogger || S.mode==="loading") return;
  lbMounted=true;
  const db=S.db;
  const storage = db ? {
    list: c => db.collection(c).get().then(qs=>qs.docs.map(d=>clone(d.data()))),
    put: (c,id,doc) => db.collection(c).doc(id).set(doc),
    remove: (c,id) => db.collection(c).doc(id).delete()
  } : undefined;
  try{
    WorkoutLogger.mount(host, {
      storage, targets: APPT || undefined,
      formCues: (window.FormCues && window.FORM_GUIDE) ? FormCues.create(window.FORM_GUIDE, { demoLinks: !(window.ExerciseDemos && window.EXERCISE_DEMOS) }) : undefined,
      anim: window.ExerciseAnim ? ExerciseAnim.create() : undefined,
      breakRamp: window.BreakRamp || undefined,
      demos: (window.ExerciseDemos && window.EXERCISE_DEMOS) ? ExerciseDemos.create(window.EXERCISE_DEMOS, { library: WorkoutLogger.library }) : undefined,
      weights: { list: async()=>weightsSorted().map(w=>({date:w.date,kg:w.kg})), put: async(date,kg)=>put("weights",date,{date,kg:Math.round(kg*10)/10},{quiet:true}) },
      onFinish(workout, rec){
        if(!rec || !rec.date) return;
        const w=Object.assign({date:rec.date,sets:{}}, clone(S.docs.workouts[rec.date]));
        if(rec.session){ w.session=rec.session; if(Number.isInteger(rec.idx)) w.idx=rec.idx; }
        w.sets=Object.assign({}, w.sets, rec.sets||{});
        if(rec.durationMin) w.durationMin=rec.durationMin;
        w.source = w.source || "logger";
        put("workouts", rec.date, w, {quiet:true});
        if(rec.treadmill){ const day=getDay(rec.date); day.treadmill=true; put("days", rec.date, day, {quiet:true}); }
        try{ const got=window.Cardio ? Cardio.fromLogger(workout) : []; if(got.length){ const cd=got[0].date, before=S.docs.cardio[cd]; const doc=Cardio.mergeLogger(before, got, cd); put("cardio", cd, doc, {quiet:true}); put("days", cd, Cardio.treadmillFlag(getDay(cd), doc, before), {quiet:true}); } }catch(e){}
        view.date=rec.date; render(); toast("Workout saved. Rate how hard it was below.");
      }
    });
  }catch(e){ lbMounted=false; host.innerHTML='<div class="card"><p>The full logger could not start. Use Quick log for now.</p></div>'; }
}

/* rest timer */
let tInt=null;
function startTimer(sec){
  const el=document.getElementById("timer"); const end=Date.now()+sec*1000; clearInterval(tInt); el.hidden=false;
  const tick=()=>{ const left=Math.max(0,Math.round((end-Date.now())/1000)); el.innerHTML=`<span class="label" style="color:inherit">${left?"Rest":"Go"}</span><span class="num">${Math.floor(left/60)}:${pad(left%60)}</span><button type="button" id="tStop">${left?"Stop":"Close"}</button>`; document.getElementById("tStop").onclick=()=>{clearInterval(tInt);el.hidden=true;}; if(!left){ clearInterval(tInt); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){} } };
  tick(); tInt=setInterval(tick,500);
}

// Home-screen shortcuts (manifest "shortcuts"): #log-weight etc. open a tab and focus one control.
function runShortcut(){
  const sc = window.AppShortcuts && AppShortcuts.parse(location.hash);
  if(!sc) return;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(_){}
  view.date = TODAY; view.tab = sc.tab; render(); window.scrollTo(0,0);
  requestAnimationFrame(()=>{ const el = sc.focus && document.querySelector(sc.focus); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } });
}

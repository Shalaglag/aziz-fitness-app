<script>
/* StrongCSV: turns a Strong app export (Settings > Export Strong Data > CSV) into
 * the app's workouts/{date} docs. Plain JS, no imports, no network.
 *
 *   StrongCSV.parse(text, {unit})            -> [{date, title, durationMin, exercises:[{name, sets:[{w,r,kind,unit}]}]}]
 *   StrongCSV.toWorkouts(text, opts)          -> {docs:{<date>:workoutDoc}, report}
 *     opts.program   PROGRAM object ({session:[[name,w,r,sets,unit,...]]}), required
 *     opts.rotation  ROTATION array, required
 *     opts.existing  current workouts docs by date (manual sets are kept for exercises Strong didn't log)
 *     opts.unit      "kg" | "lb": weight unit when the CSV header doesn't say (Strong's own unit setting). Default "kg".
 *     opts.since     ISO date; skip workouts before it
 *   StrongCSV.matchName(strongName, programNames) -> app exercise name or null
 *
 * Handles both export layouts: the older comma file ("Weight", "Duration" like "1h 5m")
 * and the newer semicolon file ("Weight (kg)" / "Weight (lbs)", "Duration (sec)", "Workout #").
 * Warm-up sets ("W") are dropped; drop ("D") and failure ("F") sets are kept. "Rest Timer" rows are ignored.
 * Weights are converted to the unit the program lists for that exercise (lb for the DB lifts).
 */
const StrongCSV = (() => {
  const LB = 0.45359237;

  function splitRows(text, delim) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.some(c => c !== "")) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur); if (row.some(c => c !== "")) rows.push(row);
    return rows;
  }

  const norm = s => String(s || "").toLowerCase().replace(/\(.*?\)/g, m => " " + m.slice(1, -1) + " ")
    .replace(/[^a-z0-9]+/g, " ").trim();

  function num(v) {
    if (v == null) return null;
    const s = String(v).trim().replace(",", ".");
    if (s === "") return null;
    const n = parseFloat(s); return isFinite(n) ? n : null;
  }

  function durationMin(v, secHeader) {
    if (v == null || v === "") return null;
    if (secHeader) { const n = num(v); return n == null ? null : Math.round(n / 60); }
    let m = 0, hit = false;
    String(v).replace(/(\d+)\s*h/, (_, h) => { m += h * 60; hit = true; }).replace(/(\d+)\s*m/, (_, x) => { m += +x; hit = true; });
    if (!hit) { const n = num(v); return n == null ? null : Math.round(n / 60); }
    return m;
  }

  function parse(text, opts) {
    opts = opts || {};
    text = String(text || "").replace(/^﻿/, "");
    const first = text.split(/\r?\n/, 1)[0] || "";
    const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",";
    const rows = splitRows(text, delim);
    if (!rows.length) throw new Error("The file is empty.");
    const head = rows[0].map(h => h.trim());
    const col = re => head.findIndex(h => re.test(h));
    const c = {
      date: col(/^date$/i), title: col(/^workout name$/i), dur: col(/^duration/i), ex: col(/^exercise name$/i),
      order: col(/^set order$/i), w: col(/^weight/i), r: col(/^reps$/i), num: col(/^workout #$/i),
    };
    if (c.date < 0 || c.ex < 0 || c.w < 0 || c.r < 0) throw new Error("This doesn't look like a Strong export (no Date / Exercise Name / Weight / Reps columns).");
    const wHead = head[c.w];
    const unit = /lb/i.test(wHead) ? "lb" : /kg/i.test(wHead) ? "kg" : (opts.unit === "lb" ? "lb" : "kg");
    const secDur = c.dur >= 0 && /sec/i.test(head[c.dur]);

    const byKey = new Map();
    for (const r of rows.slice(1)) {
      const rawDate = (r[c.date] || "").trim();
      const order = c.order >= 0 ? (r[c.order] || "").trim() : "";
      if (!rawDate || /rest/i.test(order)) continue;
      const date = rawDate.slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
      const key = (c.num >= 0 ? r[c.num] : "") + "|" + rawDate + "|" + (r[c.title] || "");
      let wo = byKey.get(key);
      if (!wo) {
        wo = { date, start: rawDate, title: (c.title >= 0 ? r[c.title] : "").trim(), durationMin: c.dur >= 0 ? durationMin(r[c.dur], secDur) : null, exercises: [] };
        byKey.set(key, wo);
      }
      const name = (r[c.ex] || "").trim(); if (!name) continue;
      let ex = wo.exercises.find(e => e.name === name);
      if (!ex) { ex = { name, sets: [] }; wo.exercises.push(ex); }
      const kind = /^w$/i.test(order) ? "warmup" : /^d$/i.test(order) ? "drop" : /^f$/i.test(order) ? "failure" : "working";
      const w = num(r[c.w]), reps = num(r[c.r]);
      if (reps == null && w == null) continue;
      ex.sets.push({ w: w == null ? 0 : w, r: reps == null ? 0 : Math.round(reps), kind, unit });
    }
    return [...byKey.values()].sort((a, b) => (a.start < b.start ? -1 : 1));
  }

  // Strong built-in names Aziz's gym exercises are likely saved under -> app names.
  const ALIASES = {
    "bench press barbell": "Bench Press (Barbell)",
    "lateral raise cable": "Lateral Raise (Cable)",
    "incline bench press dumbbell": "Incline DB Press",
    "incline dumbbell press": "Incline DB Press",
    "cable crossover": "Cable Crossover",
    "triceps extension cable": "Triceps Extension (Cable)",
    "triceps pushdown cable straight bar": "Triceps Pushdown (Straight bar)",
    "triceps pushdown": "Triceps Pushdown (Straight bar)",
    "triceps pushdown cable": "Triceps Pushdown (Straight bar)",
    "triceps pushdown rope": "Triceps Rope",
    "triceps rope pushdown": "Triceps Rope",
    "lateral raise machine": "Standing Side Delts (Machine)",
    "lat pulldown cable": "Lat Pulldown, Wide",
    "lat pulldown wide grip": "Lat Pulldown, Wide",
    "wide grip lat pulldown": "Lat Pulldown, Wide",
    "lat pulldown single arm": "Lat Pulldown, Single Arm",
    "single arm lat pulldown": "Lat Pulldown, Single Arm",
    "seated row cable": "Seated Row (Cable)",
    "seated cable row": "Seated Row (Cable)",
    "pullover machine": "Pullover (Machine)",
    "bicep curl dumbbell": "DB Curl",
    "biceps curl dumbbell": "DB Curl",
    "bicep curl machine": "Seated Bicep Curl",
    "preacher curl machine": "Seated Bicep Curl",
    "reverse fly machine": "Reverse Fly (Machine)",
    "rear delt fly machine": "Reverse Fly (Machine)",
    "leg extension machine": "Leg Extension",
    "hack squat": "Hack Squat",
    "hack squat machine": "Hack Squat",
    "squat smith machine": "Smith Squat",
    "smith machine squat": "Smith Squat",
    "lying leg curl machine": "Lying Leg Curl",
    "leg curl machine": "Lying Leg Curl",
    "hip adductor machine": "Hip Adductor",
    "hip abductor machine": "Hip Abductor",
    "standing calf raise machine": "Standing Calf Raise",
    "calf press on leg press": "Calf Press on Seated Leg Press",
    "calf press machine": "Calf Press on Seated Leg Press",
    "seated calf raise machine": "Calf Press on Seated Leg Press",
    "crunch machine": "Seated Abs",
    "ab crunch machine": "Seated Abs",
    "chest press machine": "Gundam (Chest Machine)",
    "seated overhead press dumbbell": "Seated DB Overhead Press",
    "overhead press dumbbell": "Seated DB Overhead Press",
    "shoulder press dumbbell": "Seated DB Overhead Press",
    "front raise dumbbell": "Front Raise (DB)",
    "lateral raise dumbbell": "Side Delts",
    "t bar row": "T-Bar Row",
    "iso lateral row machine": "Iso-Lateral Low Row",
    "iso lateral low row": "Iso-Lateral Low Row",
    "shrug machine": "Traps Machine",
    "bicep curl cable": "Cable Standing Biceps",
    "biceps curl cable": "Cable Standing Biceps",
  };

  function matchName(strongName, names) {
    const n = norm(strongName);
    const exact = names.find(x => norm(x) === n);
    if (exact) return exact;
    const a = ALIASES[n];
    if (a && names.includes(a)) return a;
    // Token overlap fallback, only when it's clearly one exercise.
    const toks = new Set(n.split(" ").filter(t => t.length > 1));
    let best = null, bestScore = 0, second = 0;
    for (const x of names) {
      const xt = norm(x).split(" ").filter(t => t.length > 1);
      const hit = xt.filter(t => toks.has(t)).length;
      const score = hit / Math.max(xt.length, toks.size);
      if (score > bestScore) { second = bestScore; bestScore = score; best = x; } else if (score > second) second = score;
    }
    return bestScore >= 0.6 && bestScore - second >= 0.2 ? best : null;
  }

  function convert(w, from, to) {
    if (from === to) return w;
    const v = from === "lb" ? w * LB : w / LB;
    return Math.round(v * 4) / 4;
  }

  function toWorkouts(text, opts) {
    const { program, rotation } = opts || {};
    if (!program || !rotation) throw new Error("toWorkouts needs opts.program and opts.rotation.");
    const existing = opts.existing || {};
    const sessions = Object.keys(program);
    const unitOf = {};
    sessions.forEach(s => program[s].forEach(e => { unitOf[e[0]] = e[4] || "kg"; }));
    const allNames = Object.keys(unitOf);
    const parsed = parse(text, opts).filter(w => !opts.since || w.date >= opts.since);

    const docs = {}, report = { workouts: 0, days: 0, sets: 0, unmatched: {}, sessions: {} };
    for (const wo of parsed) {
      // Session: from the Strong workout title ("Push A", "Pull B – day 5"…), else best exercise overlap.
      const t = norm(wo.title);
      let session = sessions.find(s => t.includes(norm(s))) || null;
      if (!session) {
        let best = 0;
        for (const s of sessions) {
          const names = program[s].map(e => e[0]);
          const hits = wo.exercises.filter(e => matchName(e.name, names)).length;
          if (hits > best) { best = hits; session = s; }
        }
      }
      const pool = session ? program[session].map(e => e[0]) : [];
      const doc = docs[wo.date] || Object.assign({ date: wo.date, sets: {} }, JSON.parse(JSON.stringify(existing[wo.date] || {})));
      doc.sets = doc.sets || {};
      if (session && (!doc.session || doc.source === "strong" || !docs[wo.date])) {
        doc.session = session; doc.idx = rotation.indexOf(session);
      }
      for (const ex of wo.exercises) {
        const name = matchName(ex.name, pool) || matchName(ex.name, allNames);
        if (!name) { report.unmatched[ex.name] = (report.unmatched[ex.name] || 0) + 1; }
        const key = name || ex.name;
        const to = unitOf[key] || ex.sets[0]?.unit || "kg";
        const sets = ex.sets.filter(s => s.kind !== "warmup" && s.r > 0).map(s => ({ w: convert(s.w, s.unit, to), r: s.r }));
        if (!sets.length) continue;
        doc.sets[key] = (docs[wo.date] && docs[wo.date].strongNames && docs[wo.date].strongNames.includes(key)) ? doc.sets[key].concat(sets) : sets;
        doc.strongNames = (doc.strongNames || []).concat(key);
        report.sets += sets.length;
      }
      doc.source = "strong";
      doc.strong = { title: wo.title, durationMin: wo.durationMin, importedAt: new Date().toISOString() };
      if (!docs[wo.date]) report.days++;
      docs[wo.date] = doc;
      report.workouts++;
      if (session) report.sessions[session] = (report.sessions[session] || 0) + 1;
    }
    for (const d of Object.values(docs)) delete d.strongNames;
    return { docs, report };
  }

  return { parse, toWorkouts, matchName, ALIASES };
})();
if (typeof module !== "undefined") module.exports = StrongCSV;

window.StrongCSV=StrongCSV;
</script>
<script>
window.WaterH=(function(){
// WaterH import: turns what the phone hands over (a Shortcut line, a Health
// Connect / Health Auto Export CSV, or Apple Health's export.xml) into daily
// water totals, and folds them into a `days/{date}` doc. Plain ES module, no
// dependencies, no network.
//
// WaterH has no public API. It writes every sip to Apple Health (iPhone) or
// Google Fit / Health Connect (Android), so the bridge is the phone's health
// store, not WaterH itself.
//
// Accepted input (any mix, one paste or one file):
//   WATERH 2026-10-25 2350          <- the iPhone Shortcut line (ml)
//   WATERH 2026-10-25 2.35 L        <- units: ml, l, L, oz, fl oz, cup
//   2350                            <- a bare number = today
//   CSV with a date/time column and a water/volume/hydration column
//   Apple export.xml <Record type="HKQuantityTypeIdentifierDietaryWater" .../>
//
// Day doc fields this module owns:
//   waterh: { ml, at (ISO of import), source: "shortcut"|"csv"|"apple-xml"|"manual" }
// `water` stays the manual counter (Gatorade, shakes, glasses not from the
// bottle). The day's total is totalWater(day) = water + waterh.ml.

const UNIT_ML = { ml: 1, milliliter: 1, milliliters: 1, l: 1000, liter: 1000, liters: 1000, litre: 1000, litres: 1000,
  oz: 29.5735, floz: 29.5735, "fl oz": 29.5735, "fl_oz_us": 29.5735, cup: 236.588, cups: 236.588 };

function toMl(value, unit, fallbackUnit) {
  const n = parseFloat(String(value).replace(",", "."));
  if (!isFinite(n)) return null;
  let u = String(unit || fallbackUnit || "").toLowerCase().replace(/[()\s]+/g, " ").trim();
  if (u === "fl oz" || u === "fl_oz" || u === "fl oz us") u = "oz";
  let f = UNIT_ML[u];
  if (f == null) f = n < 20 ? 1000 : 1; // unitless: small numbers are litres
  return Math.round(n * f);
}

function localISODate(d) {
  const z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}

// "2026-10-25 14:03:00 +0300", "2026-10-25T11:03:00Z", "10/25/2026", "25/10/2026 14:03"
function toDate(s) {
  s = String(s || "").trim().replace(/^"|"$/g, "");
  // The date as written is the phone's local day, which is the day Aziz drank it.
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{4})/);
  if (m) {
    let a = +m[1], b = +m[2]; // month/day unless the first can't be a month
    const [mo, da] = a > 12 ? [b, a] : [a, b];
    return `${m[3]}-${String(mo).padStart(2, "0")}-${String(da).padStart(2, "0")}`;
  }
  return null;
}

function splitCsvLine(line, sep) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === sep && !q) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}

function parseShortcutLines(text, today) {
  const rows = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    let m = line.match(/^WATERH\s+(\d{4}-\d{2}-\d{2})\s+([\d.,]+)\s*([a-zA-Z ]*)$/i);
    if (m) { rows.push({ date: m[1], ml: toMl(m[2], m[3], "ml"), source: "shortcut", whole: true }); continue; }
    m = line.match(/^([\d.,]+)\s*(ml|l|oz|fl oz|cups?)?$/i);
    if (m && line) rows.push({ date: today, ml: toMl(m[1], m[2], "ml"), source: "manual", whole: true });
  }
  return rows;
}

function parseAppleXml(text) {
  const rows = [];
  const re = /<Record\b[^>]*type="HKQuantityTypeIdentifierDietaryWater"[^>]*>/g;
  let m;
  while ((m = re.exec(text))) {
    const tag = m[0], attr = k => (tag.match(new RegExp(`\\b${k}="([^"]*)"`)) || [])[1];
    const date = toDate(attr("startDate"));
    const ml = toMl(attr("value"), attr("unit"), "ml");
    if (date && ml != null) rows.push({ date, ml, source: "apple-xml" });
  }
  return rows;
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const sep = [",", ";", "\t"].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0];
  const head = splitCsvLine(lines[0], sep).map(h => h.toLowerCase());
  const dateCol = head.findIndex(h => /(^|\b)(date|start|time|day)/.test(h));
  let volCol = head.findIndex(h => /water|hydration|volume|intake/.test(h) && !/date|time|type/.test(h));
  // Long format (time,type,value,unit): keep only the water rows.
  const typeCol = head.findIndex(h => /^(type|data ?type|metric|record ?type)$/.test(h));
  if (volCol < 0) volCol = head.findIndex(h => /^(value|amount|quantity|qty)/.test(h));
  if (dateCol < 0 || volCol < 0) return [];
  const unitCol = head.findIndex(h => /^unit/.test(h));
  const headUnit = (head[volCol].match(/\(([^)]+)\)/) || [])[1]
    || (head[volCol].match(/\b(ml|l|oz|fl oz|liters?|litres?)\b/) || [])[1];
  const rows = [];
  for (const line of lines.slice(1)) {
    const c = splitCsvLine(line, sep);
    if (typeCol >= 0 && !/water|hydration/i.test(c[typeCol] || "")) continue;
    const date = toDate(c[dateCol]);
    if (!date || c[volCol] === "" || c[volCol] == null) continue;
    const ml = toMl(c[volCol], unitCol >= 0 ? c[unitCol] : headUnit, headUnit || "ml");
    if (ml != null) rows.push({ date, ml, source: "csv" });
  }

}

// Returns [{date, ml, source}] sorted by date, one row per day (summed).
function parseWaterH(text, now = new Date()) {
  text = String(text || "");
  const today = localISODate(now);
  let rows;
  if (/HKQuantityTypeIdentifierDietaryWater/.test(text)) rows = parseAppleXml(text);
  else if (/^\s*WATERH\s|^\s*[\d.,]+\s*(ml|l|oz|fl oz|cups?)?\s*$/im.test(text) && !/[,;\t].*[,;\t]/.test(text.split(/\r?\n/)[0])) rows = parseShortcutLines(text, today);
  else rows = parseCsv(text);
  const byDay = {};
  for (const r of rows) {
    if (!r.ml || r.ml < 0) continue;
    const d = byDay[r.date] || (byDay[r.date] = { date: r.date, ml: 0, source: r.source });
    // A Shortcut line is already the day's total: the latest line wins, never summed.
    d.ml = r.whole ? r.ml : d.ml + r.ml;
  }
  return Object.values(byDay).filter(r => r.ml > 0 && r.ml < 20000).sort((a, b) => a.date.localeCompare(b.date));
}

// Writes the WaterH total onto a day doc (returns a new object). Re-importing
// the same day replaces the old figure, so syncing twice never double counts.
function applyWaterH(day, row, now = new Date()) {
  return Object.assign({}, day, { waterh: { ml: Math.round(row.ml), at: now.toISOString(), source: row.source } });
}

function totalWater(day) {
  return (day && day.water || 0) + (day && day.waterh && day.waterh.ml || 0);
}

return {parseWaterH, applyWaterH, totalWater};
})();

  let exTab = 'about';

    });

  function exDetail(id) {
    const ex = getEx(id), ss = sessions(id), R = records(id), weighted = isWeighted(ex);
    if (exTab === 'about') {
      return '<div class="lb-tiles"><div><b>' + esc(ex.part) + '</b><span>Body part</span></div><div><b>' + esc(ex.cat) + '</b><span>Equipment</span></div><div><b>' + ss.length + '</b><span>Sessions</span></div><div><b>' + mmss(restFor(id)) + '</b><span>Rest timer</span></div></div>' +
        (ex.avoided ? '<p class="lb-warnbox">Your plan avoids this lift (no deadlifts, RDLs, hip thrusts, back extensions, glute-ham raises, reverse hypers or cable pull-throughs). Pick a machine-based option instead.</p>' : '') +
        (MAIN_LIFTS.includes(id) ? '<p class="lb-note">Main lift on your watchlist. If it drops 2 sessions in a row, check sleep, pre-workout food and volume before touching calories.</p>' : '') +
        '<h4>Machine settings and notes</h4><p class="' + (ex.memo ? '' : 'lb-muted') + '">' + (ex.memo ? esc(ex.memo).replace(/\n/g, '<br>') : 'Nothing saved. Tap Edit to keep seat height, pin positions or cues here.') + '</p>' +
        (ss.length ? '<p class="lb-muted small">First logged ' + fmtDate(ss[ss.length - 1].w.start, { month: 'short', day: 'numeric', year: 'numeric' }) + ' · last ' + relDay(ss[0].w.start).toLowerCase() + '</p>' : '') +
        (S.opts.formCues ? S.opts.formCues.detailHtml(formFor(id)) : '');
    }
    if (!ss.length) return '<div class="lb-empty">No sets logged for this exercise yet.</div>';
    if (exTab === 'history') {
      return ss.slice(0, 60).map(({ w, e }) => { let n = 0; return '<div class="lb-hex"><div class="lb-tpl-top"><button class="lb-link strong" data-a="histOpen" data-id="' + w.id + '">' + esc(w.name) + '</button><span class="lb-muted small">' + fmtDate(w.start, { month: 'short', day: 'numeric', year: 'numeric' }) + '</span></div><table class="lb-tbl"><tbody>' + e.sets.map(s => '<tr><td class="lb-settag ' + s.t + '">' + (s.t === 'n' ? ++n : s.t.toUpperCase()) + '</td><td>' + esc(fmtSet(s, e, ex)) + '</td><td class="r">' + (weighted && s.t !== 'w' && num(s.r) ? '<span class="lb-muted small">' + fmtN(e1rm(+s.w, +s.r), 1) + ' ' + e.unit + '</span>' : '') + (s.pr && s.pr.length ? ' <span class="lb-pr">PR</span>' : '') + '</td></tr>').join('') + '</tbody></table></div>'; }).join('');
    }
    const asc = ss.slice().reverse();
    if (exTab === 'charts') {
      if (!weighted) {
        const f = fieldsFor(ex);
        const key = f[0] === 'km' ? 'km' : f[0] === 'sec' ? 'sec' : 'r';
        return chartBlock('Best ' + (key === 'km' ? 'distance (km)' : key === 'sec' ? 'time (s)' : 'reps'), asc.map(({ w, e }) => ({ x: w.start, y: Math.max(0, ...working(e).map(s => num(s[key]) || 0)) })));
      }
      const u = S.settings.unit, conv = v => u === 'lb' ? v / LB : v;
      return chartBlock('Estimated 1RM (' + u + ')', asc.map(({ w, e }) => { const b = bestSet(e); return { x: w.start, y: b ? conv(b.v) : 0 }; })) +
        chartBlock('Heaviest weight (' + u + ')', asc.map(({ w, e }) => ({ x: w.start, y: conv(Math.max(0, ...working(e).map(s => toKg(num(s.w) || 0, e.unit)))) }))) +
        chartBlock('Session volume (' + u + ')', asc.map(({ w, e }) => ({ x: w.start, y: conv(working(e).reduce((a, s) => a + toKg(num(s.w) || 0, e.unit) * (num(s.r) || 0), 0)) }))) +
        chartBlock('Best set volume (' + u + ')', asc.map(({ w, e }) => ({ x: w.start, y: conv(Math.max(0, ...working(e).map(s => toKg(num(s.w) || 0, e.unit) * (num(s.r) || 0)))) })));
    }
    // records
    const u = S.settings.unit, show = r => r ? fmtN(u === 'lb' ? r.v / LB : r.v, 1) + ' ' + u : '–';
    if (!weighted) return '<div class="lb-tiles">' + [['reps', 'Max reps'], ['km', 'Max distance (km)'], ['min', 'Longest (min)'], ['sec', 'Longest (s)']].filter(([k]) => R[k]).map(([k, l]) => '<div><b>' + fmtN(R[k].v, 2) + '</b><span>' + l + '</span></div>').join('') + '</div>';
    const reps = Object.keys(R.reps0).map(Number).sort((a, b) => a - b);
    return '<div class="lb-tiles"><div><b>' + show(R.e1rm) + '</b><span>Est. 1RM</span></div><div><b>' + show(R.weight) + '</b><span>Heaviest weight</span></div><div><b>' + show(R.volume) + '</b><span>Best set volume</span></div><div><b>' + show(R.sessionVol) + '</b><span>Best session volume</span></div></div>' +
      (R.e1rm ? '<p class="lb-muted small">Est. 1RM from ' + fmtN(R.e1rm.w, 2) + ' ' + R.e1rm.unit + ' × ' + R.e1rm.r + ' on ' + fmtDate(R.e1rm.at, { month: 'short', day: 'numeric' }) + ' (Epley formula).</p>' : '') +

  }

  // Charts
  function chartBlock(title, pts, opts) { return '<div class="lb-chart"><h4>' + esc(title) + '</h4>' + lineChart(pts.filter(p => p.y > 0), opts) + '</div>'; }
  function niceTicks(min, max, n) {
    const span = max - min || Math.abs(max) || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || mag * 10;
    const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(6)); return out;
  }
  function lineChart(pts, opts) {
    opts = opts || {};
    if (pts.length < 1) return '<p class="lb-muted small">Not enough data yet.</p>';
    const W = 320, H = 150, L = 34, R = 14, T = 14, B = 22;
    const ys = pts.map(p => p.y).concat(opts.goal != null ? [opts.goal] : []);
    let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.12 || hi * 0.05 || 1; lo -= pad; hi += pad;
    const x0 = pts[0].x, x1 = pts[pts.length - 1].x, sx = x => pts.length === 1 ? (L + W - R) / 2 : L + (x - x0) / (x1 - x0 || 1) * (W - L - R), sy = y => T + (hi - y) / (hi - lo) * (H - T - B);
    const ticks = niceTicks(lo, hi, 3);
    const line = pts.map(p => sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    let svg = '<svg class="lb-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Chart">';
    ticks.forEach(t => { svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(t) + '" y2="' + sy(t) + '" class="grid"/><text x="' + (L - 4) + '" y="' + (sy(t) + 3) + '" text-anchor="end" class="ax">' + fmtN(t, 1) + '</text>'; });
    if (opts.goal != null) svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(opts.goal) + '" y2="' + sy(opts.goal) + '" class="goal"/><text x="' + (W - R) + '" y="' + (sy(opts.goal) - 4) + '" text-anchor="end" class="ax goaltxt">Goal ' + opts.goal + '</text>';
    if (pts.length > 1) svg += '<polygon class="area" points="' + sx(x0) + ',' + (H - B) + ' ' + line + ' ' + sx(x1) + ',' + (H - B) + '"/><polyline class="ln" points="' + line + '"/>';
    if (pts.length <= 40) pts.forEach(p => { svg += '<circle class="pt" cx="' + sx(p.x) + '" cy="' + sy(p.y) + '" r="2.4"/>'; });
    svg += '<circle class="pt end" cx="' + sx(last.x) + '" cy="' + sy(last.y) + '" r="4.2"/><text class="val" x="' + Math.min(sx(last.x), W - R - 2) + '" y="' + (sy(last.y) - 9) + '" text-anchor="' + (pts.length === 1 ? 'middle' : 'end') + '">' + fmtN(last.y, 1) + '</text>';
    svg += '<text x="' + L + '" y="' + (H - 6) + '" class="ax">' + fmtDate(x0, { month: 'short', day: 'numeric' }) + '</text>' + (pts.length > 1 ? '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" class="ax">' + fmtDate(x1, { month: 'short', day: 'numeric' }) + '</text>' : '');
    return svg + '</svg>';
  }
  function barChart(bars, label) {
    const W = 320, H = 130, L = 22, R = 6, T = 12, B = 22, max = Math.max(1, ...bars.map(b => b.v));
    const bw = (W - L - R) / bars.length;
    let svg = '<svg class="lb-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">';
    niceTicks(0, max, 2).forEach(t => { const y = T + (1 - t / max) * (H - T - B); svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" class="grid"/><text x="' + (L - 4) + '" y="' + (y + 3) + '" text-anchor="end" class="ax">' + t + '</text>'; });
    bars.forEach((b, i) => { const h = b.v / max * (H - T - B), x = L + i * bw + bw * 0.18; svg += '<rect class="bar' + (b.hi ? ' hi' : '') + '" x="' + x.toFixed(1) + '" y="' + (H - B - h).toFixed(1) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + Math.max(h, b.v ? 1.5 : 0).toFixed(1) + '" rx="2"/>' + (b.l ? '<text x="' + (x + bw * 0.32).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" class="ax">' + esc(b.l) + '</text>' : ''); });
    return svg + '</svg>';
  }

  // Progress tab
  function weightPoints() {
    if (S.shellWeights) return S.shellWeights.filter(w => w && w.date && w.kg).map(w => ({ x: fromIso(w.date), y: +w.kg })).sort((a, b) => a.x - b.x);

  }
  function measurePoints(type) { return type === 'weight' ? weightPoints() : Object.values(S.data.measures).filter(m => m.type === type).map(m => ({ x: m.date, y: +m.value, id: m.id })).sort((a, b) => a.x - b.x); }
  function viewProgress() {
    const ws = workouts(), now = Date.now(), wk0 = startOfWeek(now);
    const weeks = []; for (let i = 11; i >= 0; i--) { const s = wk0 - i * 7 * DAY; weeks.push({ s, v: ws.filter(w => w.start >= s && w.start < s + 7 * DAY).length }); }
    let streak = 0; for (let i = weeks.length - 1; i >= 0; i--) { if (weeks[i].v) streak++; else if (i === weeks.length - 1) continue; else break; }
    const thisWeek = weeks[weeks.length - 1].v;
    const vol7 = ws.filter(w => w.start > now - 7 * DAY).reduce((a, w) => a + workoutStats(w).vol, 0);
    const parts = {}; ws.filter(w => w.start > now - 7 * DAY).forEach(w => w.exercises.forEach(e => { const p = getEx(e.exId).part; if (p !== 'Cardio') parts[p] = (parts[p] || 0) + working(e).length; }));
    const partRows = Object.entries(parts).sort((a, b) => b[1] - a[1]);
    const maxP = Math.max(1, ...partRows.map(p => p[1]));
    const lifts = MAIN_LIFTS.map(id => ({ id, ex: getEx(id), t: liftTrend(id) }));
    const wp = weightPoints(), lastW = wp[wp.length - 1];
    return '<div class="lb-tiles"><div><b>' + thisWeek + '</b><span>Workouts this week</span></div><div><b>' + streak + '</b><span>Week streak</span></div><div><b>' + fmtN(vol7 / 1000, 1) + 't</b><span>Volume, last 7 days</span></div><div><b>' + ws.length + '</b><span>Total workouts</span></div></div>' +
      '<section class="lb-card"><h4>Workouts per week</h4>' + barChart(weeks.map((w, i) => ({ v: w.v, hi: i === weeks.length - 1, l: i % 3 === 2 || i === weeks.length - 1 ? fmtDate(w.s, { month: 'numeric', day: 'numeric' }) : '' })), 'Workouts per week') + '</section>' +
      '<section class="lb-card"><h4>Main lifts</h4><p class="lb-muted small">Best working set per session (estimated 1RM). A red flag means it dropped 2 sessions in a row.</p><div class="lb-lifts">' + lifts.map(({ id, ex, t }) => { const s0 = t.ss[0]; return '<button class="lb-lift' + (t.dropping ? ' drop' : '') + '" data-a="exOpen" data-id="' + id + '"><span class="nm">' + esc(ex.name) + '</span><span class="lb-mono">' + (s0 ? esc(fmtSet(s0.s, { unit: s0.unit, exId: id })) : '<span class="lb-muted">no sets yet</span>') + '</span>' + spark(t.ss.slice().reverse().map(s => s.v)) + (t.dropping ? '<span class="lb-flag">Dropped 2 sessions in a row. Check sleep, pre-workout food and volume first.</span>' : '') + '</button>'; }).join('') + '</div></section>' +
      '<section class="lb-card"><h4>Sets per muscle, last 7 days</h4>' + (partRows.length ? '<div class="lb-bars">' + partRows.map(([p, n]) => '<div><span>' + esc(p) + '</span><i style="width:' + (n / maxP * 100).toFixed(0) + '%"></i><b>' + n + '</b></div>').join('') + '</div>' : '<p class="lb-muted">No working sets in the last 7 days.</p>') + '</section>' +
      '<div class="lb-section-head"><h3>Measurements</h3><button class="lb-btn small" data-a="logMeasure" data-k="weight">Log</button></div>' +
      '<button class="lb-card lb-weight" data-a="measureOpen" data-k="weight"><div class="lb-tpl-top"><b>Body weight</b><span class="lb-muted small">Goal ' + GOAL_KG + ' kg</span></div>' + (lastW ? '<div class="lb-big">' + fmtN(lastW.y, 1) + ' <small>kg</small></div><p class="lb-muted small">' + fmtDate(lastW.x) + ' · ' + fmtN(lastW.y - GOAL_KG, 1) + ' kg to go</p>' + lineChart(wp.slice(-30), { goal: GOAL_KG }) : '<p class="lb-muted">No weigh-ins yet.</p>') + '</button>' +

    if (!doneCount) { openSheet({ title: 'Nothing logged yet', body: () => '<p>Check off at least one set to save this workout, or cancel it.</p><div class="lb-row"><button class="lb-btn primary" data-a="closeSheet">Keep going</button><button class="lb-btn danger" data-a="cancelLiveFromSheet">Discard workout</button></div>' }); return; }

  function templateChanged(tpl, d) {

    if (updateTpl) {
      const tpl = clone(S.data.templates[d.templateId]);

<script>
/*
 * Saved meals: keep a food combo (for example a usual Nutreeze day) and add it
 * back to any day with one tap. Pure logic plus one HTML card builder, no DOM
 * access, no imports, no network. Works as a browser global (window.SavedMeals)
 * or as a CommonJS module.
 *
 * Stored as one doc per combo in the app's `meals` collection, keyed by id:
 *   meals/{id}: { id, name, items:[{name,slot,kcal,p,c,f,est}], created, lastUsed, uses }
 * Items use the same shape as days/{date}.food[] minus the per-day id/eaten.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SavedMeals = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const MAX_ITEMS = 30;
  const num = v => { const n = +v; return isFinite(n) ? Math.round(n * 10) / 10 : 0; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const key = i => String(i.slot || '').toLowerCase() + '|' + String(i.name || '').trim().toLowerCase();

  function slug(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'meal';
  }

  // Strip a food item down to what a combo stores.
  function cleanItem(i) {
    const o = { name: String(i.name || '').trim(), slot: String(i.slot || 'Extra'), kcal: num(i.kcal), p: num(i.p), c: num(i.c), f: num(i.f) };
    if (i.est) o.est = true;
    return o;
  }

  function totals(items) {
    return (items || []).reduce((t, i) => ({ kcal: t.kcal + num(i.kcal), p: t.p + num(i.p), c: t.c + num(i.c), f: t.f + num(i.f) }), { kcal: 0, p: 0, c: 0, f: 0 });
  }

  // A default name from the day's main meals, e.g. "French Tacos Chicken + Chicken Biryani".
  function suggestName(items) {
    const meals = (items || []).filter(i => /meal/i.test(i.slot)).map(i => String(i.name).split(' (')[0]);
    if (meals.length) return meals.slice(0, 2).join(' + ');
    return (items && items[0] && String(items[0].name).split(' (')[0]) || 'My usual day';
  }

  // Build a combo from a day's food (or any list of food items).
  // opts: { name, id, onlyEaten, now (ms), existing (meals map, for unique ids) }
  function fromItems(items, opts) {
    opts = opts || {};
    let list = (items || []).filter(i => i && String(i.name || '').trim());
    if (opts.onlyEaten) list = list.filter(i => i.eaten);
    list = list.slice(0, MAX_ITEMS).map(cleanItem);
    if (!list.length) return null;
    const name = String(opts.name || '').trim() || suggestName(list);
    let id = opts.id || slug(name);
    const taken = opts.existing || {};
    if (!opts.id) { let n = 2, base = id; while (taken[id]) id = base + '-' + n++; }
    return { id, name, items: list, created: opts.now || Date.now(), lastUsed: 0, uses: 0 };
  }

  // Add a combo to a day. Returns { day, added, skipped } and never mutates its input.
  // opts: { uid: () => string (required for unique item ids), eaten: bool,
  //         mode: 'append' (default) | 'replace' (drop the day's planned items, keep eaten ones),
  //         allowDuplicates: bool (default false: skip items already on the day, same name + slot) }
  function applyToDay(day, combo, opts) {
    opts = opts || {};
    const uid = opts.uid || (() => 'm' + Math.random().toString(36).slice(2, 10));
    const base = Object.assign({ food: [] }, day);
    let food = (base.food || []).slice();
    if (opts.mode === 'replace') food = food.filter(i => i.eaten);
    const have = new Set(food.map(key));
    const added = [], skipped = [];
    (combo && combo.items || []).forEach(it => {
      const k = key(it);
      if (!opts.allowDuplicates && have.has(k)) { skipped.push(it.name); return; }
      have.add(k);
      const o = Object.assign({ id: uid() }, cleanItem(it), { eaten: !!opts.eaten });
      food.push(o); added.push(o);
    });
    return { day: Object.assign({}, base, { food }), added, skipped };
  }

  // Bump usage stats after a combo was added. Returns a new combo object.
  function markUsed(combo, now) {
    return Object.assign({}, combo, { uses: (combo.uses || 0) + 1, lastUsed: now || Date.now() });
  }

  // meals map or array -> array, most used first, then most recent, then name.
  function sorted(meals) {
    const arr = Array.isArray(meals) ? meals.slice() : Object.values(meals || {});
    return arr.filter(m => m && m.items && m.items.length)
      .sort((a, b) => (b.uses || 0) - (a.uses || 0) || (b.lastUsed || 0) - (a.lastUsed || 0) || String(a.name).localeCompare(String(b.name)));
  }

  function rename(combo, name) {
    name = String(name || '').trim();
    return name ? Object.assign({}, combo, { name }) : combo;
  }

  // Read a combo from JSON text (export/import, or a pasted share). Returns null if invalid.
  function parse(text, opts) {
    let o; try { o = typeof text === 'string' ? JSON.parse(text) : text; } catch (e) { return null; }
    if (!o || !Array.isArray(o.items)) return null;
    return fromItems(o.items, Object.assign({ name: o.name }, opts));
  }

  // The Food tab card. Buttons use the app's data-act click convention:
  //   data-act="meal-add"  data-id   one-tap add to the selected day
  //   data-act="meal-del"  data-id   delete (first tap asks to confirm via data-confirm)
  //   data-act="meal-save"           save the selected day's food as a new combo
  //   form data-form="meal-save" with input #mealName (optional name)
  // opts: { day (the selected day's doc), open (id of combo to expand, optional) }
  function cardHTML(meals, opts) {
    opts = opts || {};
    const list = sorted(meals);
    const dayFood = (opts.day && opts.day.food) || [];
    const r0 = n => Math.round(n).toLocaleString('en-US');
    const rows = list.map(m => {
      const t = totals(m.items);
      const names = m.items.map(i => esc(String(i.name).split(' (')[0])).join(', ');
      return '<div class="item sm-row">' +
        '<div class="nm"><b>' + esc(m.name) + '</b><small>' + m.items.length + ' items · ' + names + '</small></div>' +
        '<div class="mac">' + r0(t.kcal) + ' kcal<br><span style="color:var(--protein)">' + r0(t.p) + 'P</span> <span style="color:var(--carbs)">' + r0(t.c) + 'C</span> <span style="color:var(--fat)">' + r0(t.f) + 'F</span></div>' +
        '<button class="btn small" data-act="meal-add" data-id="' + esc(m.id) + '" aria-label="Add ' + esc(m.name) + '">Add</button>' +
        '<button class="x" data-act="meal-del" data-id="' + esc(m.id) + '" aria-label="Delete saved meal">×</button>' +
        '</div>';
    }).join('');
    const save = dayFood.length
      ? '<form data-form="meal-save" class="row" style="margin-top:10px">' +
        '<input type="text" id="mealName" placeholder="' + esc(suggestName(dayFood)) + '" style="flex:1;min-width:10em" aria-label="Name for this combo" maxlength="60">' +
        '<button class="btn ghost small" type="submit">Save this day as a combo</button></form>'
      : '';
    return '<div class="card sm-card">' +
      '<div class="spread"><h3>Saved meals</h3><span class="muted" style="font-size:.85rem">One tap adds the whole combo as planned</span></div>' +
      (rows ? '<div class="items">' + rows + '</div>' : '<p class="muted">No saved combos yet. Plan a day you like, then save it here to add it again with one tap.</p>') +
      save + '</div>';
  }

  return { fromItems, applyToDay, markUsed, sorted, totals, suggestName, rename, parse, cardHTML, cleanItem, slug, MAX_ITEMS };
});
</script>
<script>
/* Workout effort rating + deload nudge for the Aziz Cut Tracker.
 * Plain JS, no imports, no network. Reads and writes the app's own workouts/{date} docs:
 *   {date, session, idx, sets:{"<exercise>":[{w,r}]}, effort: 1-10, deload: true (optional)}
 * API:
 *   EffortDeload.css                              -> string, inject once (uses the app's tokens)
 *   EffortDeload.LEVELS                           -> [{n, label}] for 1..10
 *   EffortDeload.clean(value)                     -> integer 1..10 or null
 *   EffortDeload.withEffort(workoutDoc, n)        -> copy of the doc with effort set (null clears it)
 *   EffortDeload.pickerHtml(date, current)        -> "How hard was it?" card, buttons carry
 *                                                    data-effort="<n>" data-effort-date="<date>"
 *   EffortDeload.analyze(workouts, {today, dismissedAt}) -> {nudge, reason, text, weeks, lifts}
 *   EffortDeload.nudgeHtml(result)                -> lighter-week card ("" when no nudge); its buttons
 *                                                    carry data-deload="dismiss" | "start"
 * Host wiring: show pickerHtml after a workout is finished (Quick log save and the Full logger's
 * onFinish); on click put("workouts", date, EffortDeload.withEffort(doc, n)). Render nudgeHtml on
 * Train (and/or Today). "dismiss" stores prefs/main.deloadDismissedAt = today; "start" marks the
 * next 7 days' workouts with deload:true as they are logged (or just dismisses, host's choice).
 *
 * The rule (rolling 7-day windows ending today: C = last 7 days, B = the 7 before, A = the 7 before that):
 *   effort rising  = avg(C) >= avg(B) >= avg(A) and avg(C) - avg(A) >= 1, or B and C both average >= 8.5
 *   e1RM stalled   = across lifts logged in A..C, fewer than a third set a best in B or C that beats
 *                    their best from the 4 weeks before B by more than 1% (needs 2+ lifts)
 *   nudge          = both, with 2+ rated sessions in B and in C and 1+ in A,
 *                    no deload-marked workout in the last 21 days, and not dismissed in the last 14 days.
 */
const EffortDeload = (() => {
  const DAY = 864e5;
  const LEVELS = [
    [1, "Barely a workout"], [2, "Very easy"], [3, "Easy"], [4, "Comfortable"], [5, "Moderate"],

  const f1 = n => (Math.round(n * 10) / 10).toFixed(1);

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function list(workouts) {

    // C: today-6..today, B: today-13..today-7, A: today-20..today-14, prior: 4 weeks before B
    const bounds = { A: [add(today, -20), add(today, -14)], B: [add(today, -13), add(today, -7)], C: [add(today, -6), today] };
    const weeks = ["A", "B", "C"].map(k => {
      const rated = win(...bounds[k]).map(w => clean(w.effort)).filter(e => e != null);
      return { key: k, from: bounds[k][0], to: bounds[k][1], sessions: win(...bounds[k]).length, rated: rated.length, avg: mean(rated) };
    });
    const [A, B, C] = weeks;

    const prior = bestByLift(win(add(today, -41), add(today, -14)));
    const recent = bestByLift(win(bounds.B[0], today));
    const lifts = Object.keys(recent).filter(n => prior[n]).map(name => {
      const change = recent[name] / prior[name] - 1;
      return { name, before: prior[name], recent: recent[name], change, progressed: change > 0.01 };
    }).sort((a, b) => a.change - b.change);
    const progressed = lifts.filter(l => l.progressed).length;

    const enough = A.rated >= 1 && B.rated >= 2 && C.rated >= 2;
    const rising = enough && ((C.avg >= B.avg && B.avg >= A.avg && C.avg - A.avg >= 1) || (B.avg >= 8.5 && C.avg >= 8.5));
    const stalled = lifts.length >= 2 && progressed < lifts.length / 3;
    const recentDeload = ws.some(w => w.deload && w.date >= add(today, -20));
    const dismissed = isDate(opts.dismissedAt) && opts.dismissedAt > add(today, -14) && opts.dismissedAt <= today;

    let reason;
    if (!enough) reason = "not-enough-ratings";
    else if (!rising) reason = "effort-ok";
    else if (lifts.length < 2) reason = "not-enough-lifts";
    else if (!stalled) reason = "still-progressing";
    else if (recentDeload) reason = "recent-deload";
    else if (dismissed) reason = "dismissed";
    else reason = "deload";
    const nudge = reason === "deload";

    const text = nudge
      ? `Effort is up from ${f1(A.avg)} to ${f1(C.avg)} out of 10 over 2 weeks while your lifts have stalled (${progressed} of ${lifts.length} improved). ` +
        "Take a lighter week: same exercises, one less set each, about 90% of your usual weights, and stop 3 or more reps before failure. Keep protein and steps as normal. Then go back to your normal loads."
      : "";
    return { nudge, reason, text, today, weeks, lifts, rising: !!rising, stalled };
  }

  function pickerHtml(date, current) {
    const cur = clean(current);
    const lab = cur ? LEVELS[cur - 1].label : "Tap a number";
    return `<div class="card ed-card"><div class="ed-head"><b>How hard was it?</b><span class="ed-lab">${cur ? cur + " · " : ""}${esc(lab)}</span></div>` +
      `<div class="ed-scale" role="group" aria-label="Effort from 1 to 10">` +
      LEVELS.map(l => `<button type="button" class="ed-n${l.n === cur ? " on" : ""}${l.n >= 9 ? " hi" : ""}" data-effort="${l.n}" data-effort-date="${esc(date)}" aria-pressed="${l.n === cur}" title="${esc(l.label)}">${l.n}</button>`).join("") +
      `</div><div class="ed-ends"><span>Easy</span><span>Max</span></div></div>`;
  }

  function nudgeHtml(res) {
    if (!res || !res.nudge) return "";
    const C = res.weeks[2], A = res.weeks[0];
    const top = res.lifts.slice(0, 3).map(l => `<li>${esc(l.name)} <span class="ed-muted">${l.change >= 0 ? "+" : "−"}${f1(Math.abs(l.change) * 100)}%</span></li>`).join("");
    return `<div class="card ed-nudge"><div class="ed-head"><b>Time for a lighter week?</b><span class="ed-lab">Effort ${f1(A.avg)} → ${f1(C.avg)}</span></div>` +
      `<p>${esc(res.text)}</p>${top ? `<ul class="ed-lifts">${top}</ul>` : ""}` +
      `<div class="ed-row"><button type="button" class="ed-btn" data-deload="start">Start lighter week</button><button type="button" class="ed-btn ghost" data-deload="dismiss">Not now</button></div></div>`;
  }

  const css = `
.ed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.ed-lab,.ed-muted{color:var(--muted);font-size:.85em}
.ed-scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.ed-n{min-height:44px;border:1px solid var(--line);border-radius:calc(var(--r,12px)*.6);background:var(--sunk);color:var(--ink);font:600 15px var(--mono,monospace);cursor:pointer;padding:0}
.ed-n.hi{color:var(--warn)}
.ed-n.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ed-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.75em;margin-top:4px}
.ed-nudge{border-left:4px solid var(--warn)}
.ed-nudge p{margin:0 0 8px}
.ed-lifts{margin:0 0 10px;padding-left:18px}
.ed-row{display:flex;gap:8px;flex-wrap:wrap}
.ed-btn{min-height:44px;padding:0 16px;border-radius:calc(var(--r,12px)*.6);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.ed-btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
`;

  return { css, LEVELS, clean, withEffort, pickerHtml, analyze, nudgeHtml };
})();

if (typeof module !== "undefined") module.exports = { EffortDeload };

window.EffortDeload=EffortDeload;
</script>
<script>
/* Over-budget day recovery for the Aziz Cut Tracker.
 * Plain JS, no imports, no network. Reads the app's own days/{date} docs:
 *   {date, food:[{kcal, eaten, ...}], budgetAdj:{<sourceDate>: -kcal}, recovery:{choice, at, ...}}
 * API:
 *   BudgetRecovery.css                          -> string, inject once (uses the app's tokens)
 *   BudgetRecovery.eatenKcal(dayDoc)            -> kcal of items marked eaten
 *   BudgetRecovery.plan(date, days)             -> {date, eaten, target, surplus, reason, text,
 *                                                   recommended, options:{spread, walk}}
 *   BudgetRecovery.apply(plan, choice, at)      -> [{date, patch}] to merge into days/{date}
 *                                                   (choice: "spread" | "walk" | "skip")
 *   BudgetRecovery.targetFor(date, days)        -> that day's kcal target after any recovery cuts
 *   BudgetRecovery.cardHtml(plan)               -> "Went over today?" card ("" when nothing to do);
 *                                                   buttons carry data-recover="spread|walk|skip"
 *                                                   and data-recover-date="<source date>"
 *
 * The rule (from the plan: 2,000 kcal, never cut to 1,500-1,700 or 1,800, Friday is a free day):
 *   surplus <= 100 kcal       -> nothing to do (the app already calls 1,900-2,100 "on target")
 *   Friday                    -> nothing to do, and nothing is ever taken from Saturday for it
 *   otherwise, two options:
 *     spread -> take the surplus off the next 3 non-Friday days, at most 150 kcal a day, so no day
 *               drops below 1,850. Anything above 450 kcal is let go: one day does not undo a week.
 *     walk   -> one extra 30-min brisk walk (~150-200 kcal at ~92 kg, on top of the post-lift
 *               treadmill). If the surplus is above ~175 kcal, the rest is spread as above.
 *   recommended: walk when the surplus fits inside it (<= 200 kcal), otherwise spread.
 *   Cuts come from carbs or fat; protein stays at 160 g+.
 */
const BudgetRecovery = (() => {
  const TARGET = 2000;
  const FLOOR = 1850;          // lowest a recovery day may go
  const MAX_CUT = TARGET - FLOOR;
  const DAYS = 3;
  const IGNORE = 100;          // within this, the day is on target
  const WALK = { minutes: 30, kcal: [150, 200], credit: 175 };
  const DAY = 864e5;

  const iso = ms => new Date(ms).toISOString().slice(0, 10);
  const addDays = (date, n) => iso(Date.parse(date + "T00:00:00Z") + n * DAY);
  const isFriday = date => new Date(date + "T00:00:00Z").getUTCDay() === 5;
  const fmt = n => Math.round(n).toLocaleString("en-US");
  const round10 = n => Math.round(n / 10) * 10;

  function eatenKcal(doc) {
    if (!doc || !Array.isArray(doc.food)) return 0;
    return doc.food.reduce((s, i) => s + (i && i.eaten ? Number(i.kcal) || 0 : 0), 0);
  }

  // Sum of cuts already planned on a day, from any source day.
  function existingCut(doc) {
    const adj = doc && doc.budgetAdj;
    if (!adj) return 0;
    return Object.values(adj).reduce((s, v) => s + Math.min(0, Number(v) || 0), 0);
  }

  function targetFor(date, days) {
    if (isFriday(date)) return TARGET;
    return Math.max(FLOOR, TARGET + existingCut((days || {})[date]));
  }

  // Spread `kcal` over the next DAYS non-Friday days after `date`, respecting room left above FLOOR.
  function spreadFrom(date, kcal, days, sourceDate) {
    const out = [];
    let d = date;
    while (out.length < DAYS) {
      d = addDays(d, 1);
      if (isFriday(d)) continue;
      const doc = (days || {})[d];
      const already = existingCut(doc) - Math.min(0, Number(doc && doc.budgetAdj && doc.budgetAdj[sourceDate]) || 0);
      out.push({ date: d, room: Math.max(0, MAX_CUT + already) });
    }
    let left = Math.max(0, round10(kcal));
    const even = round10(left / DAYS);
    out.forEach((day, i) => {
      const want = i === DAYS - 1 ? left : Math.min(left, even);
      day.cut = Math.min(day.room, want);
      left -= day.cut;
    });
    // second pass: push anything a full day could not take onto days with room
    out.forEach(day => { const more = Math.min(day.room - day.cut, left); day.cut += more; left -= more; });
    const list = out.filter(d => d.cut > 0).map(d => ({ date: d.date, cut: d.cut, target: TARGET - (MAX_CUT - d.room) - d.cut }));
    return { days: list, covered: list.reduce((s, d) => s + d.cut, 0) };
  }

  function plan(date, days) {
    days = days || {};
    const doc = days[date];
    const eaten = eatenKcal(doc);
    const target = targetFor(date, days);
    const surplus = Math.round(eaten - target);
    const base = { date, eaten, target, surplus, options: null, recommended: null };
    if (doc && doc.recovery && doc.recovery.choice) return { ...base, reason: "handled", choice: doc.recovery.choice, text: handledText(doc.recovery) };
    if (surplus <= IGNORE) return { ...base, reason: surplus > 0 ? "small" : "under", text: "" };
    if (isFriday(date)) return { ...base, reason: "friday", text: "Friday is a free day. Nothing to make up, and Saturday stays at 2,000." };

    const spread = spreadFrom(date, surplus, days, date);
    spread.letGo = Math.max(0, surplus - spread.covered);
    const walkRest = Math.max(0, surplus - WALK.credit);
    const walkSpread = walkRest > IGNORE / 2 ? spreadFrom(date, walkRest, days, date) : { days: [], covered: 0 };
    const walk = { ...WALK, days: walkSpread.days, covered: walkSpread.covered, letGo: Math.max(0, walkRest - walkSpread.covered) };
    const recommended = surplus <= WALK.kcal[1] ? "walk" : "spread";
    return { ...base, reason: "recover", options: { spread, walk }, recommended,
      text: `${fmt(surplus)} kcal over ${fmt(target)}. No need to starve tomorrow: pick one.` };
  }

  function handledText(r) {
    if (r.choice === "spread") return "Spread over the next days.";
    if (r.choice === "walk") return "Extra 30-min walk planned.";
    return "Let it go. Weekly average is what counts.";
  }

  function apply(p, choice, at) {
    if (!p || p.reason !== "recover") return [];
    const stamp = at || new Date().toISOString();
    const opt = choice === "spread" ? p.options.spread : choice === "walk" ? p.options.walk : null;
    const writes = [{ date: p.date, patch: { recovery: { choice: opt ? choice : "skip", surplus: p.surplus, at: stamp } } }];
    if (opt) opt.days.forEach(d => writes.push({ date: d.date, patch: { budgetAdj: { [p.date]: -d.cut } } }));
    return writes;
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const day = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  const list = ds => ds.map(d => `${day(d.date)} ${fmt(d.target)} (−${d.cut})`).join(", ");

  function cardHtml(p) {
    if (!p || p.reason !== "recover") return "";
    const { spread, walk } = p.options;
    const spreadLine = `Next ${spread.days.length} days: ${list(spread.days)}.` + (spread.letGo ? ` The last ${fmt(spread.letGo)} kcal is let go.` : "");
    const walkLine = `One extra 30-min brisk walk, today or tomorrow (~${walk.kcal[0]}–${walk.kcal[1]} kcal).` +
      (walk.days.length ? ` Plus ${list(walk.days)}.` : "") + (walk.letGo ? ` The last ${fmt(walk.letGo)} kcal is let go.` : "");
    const opt = (key, title, body) => `<div class="br-opt${p.recommended === key ? " rec" : ""}"><b>${title}${p.recommended === key ? ' <span class="br-tag">Suggested</span>' : ""}</b><p>${esc(body)}</p>` +
      `<button class="br-btn" data-recover="${key}" data-recover-date="${p.date}">${key === "walk" ? "I'll walk" : "Spread it"}</button></div>`;
    return `<div class="card br-card"><h3>Went over today?</h3><p class="br-sum">${esc(p.text)}</p>` +
      opt("walk", "Walk it off", walkLine) + opt("spread", "Spread it", spreadLine) +
      `<p class="br-note">Cuts come from carbs or fat. Protein stays at 160 g+. No day goes below ${fmt(FLOOR)}, and Fridays are never touched.</p>` +
      `<button class="br-btn ghost" data-recover="skip" data-recover-date="${p.date}">Let it go</button></div>`;
  }

  const css = `
.br-card{border-left:4px solid var(--warn)}
.br-sum{margin:0 0 10px}
.br-opt{border:1px solid var(--line);border-radius:var(--r,12px);padding:10px 12px;margin:0 0 8px;background:var(--sunk)}
.br-opt.rec{border-color:var(--accent)}
.br-opt p{margin:4px 0 8px;color:var(--muted)}
.br-tag{font:600 .7em var(--mono);color:var(--accent);margin-left:6px;text-transform:uppercase}
.br-note{color:var(--muted);font-size:.85em;margin:4px 0 10px}
.br-btn{min-height:44px;padding:0 16px;border-radius:calc(var(--r,12px)*.6);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.br-btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
`;

  return { css, TARGET, FLOOR, WALK, eatenKcal, targetFor, plan, apply, cardHtml };
})();

if (typeof module !== "undefined") module.exports = { BudgetRecovery };

window.BudgetRecovery=BudgetRecovery;
</script>
<script>
/* Daily score and streak for the Aziz Cut Tracker.
 * Plain JS, no imports, no network. Reads the app's own collections:
 *   docs = { days: {date: {food:[{kcal,p,eaten}], water, waterh:{ml}, supps:{creatine,omega,d3,mag}, treadmill, sleep}},
 *            workouts: {date: {session, sets:{name:[{w,r}]}, treadmill}} }
 * One score out of 100 per day, from six parts:
 *   Protein 25 (≥160 g eaten, partial from 120 g) · Calories 20 (1,850–2,150 eaten, partial to ±300; Friday free day skipped)
 *   Water 15 (3.5 L training days, 3 L otherwise) · Training 15 (sets logged 10 + treadmill 5; rest days and Fridays full marks)
 *   Supplements 10 (2.5 each) · Sleep 15 (≥7 h, partial from 5 h)
 * Sleep is optional: the app has no sleep input yet, so until days/{date}.sleep (hours slept the night before) is set,
 * that part is left out and the score is scaled from the other parts. Everything else counts as 0 when not logged.
 * A good day scores 80 or more with no part at zero (so skipping a lift or all supplements can't still pass). The streak counts good days in a row; today only joins once it reaches 80,
 * so an unfinished today never breaks it.
 * API:
 *   DailyScore.css                                -> string, inject once (uses the app's tokens)
 *   DailyScore.score(docs, date, {session})       -> {date, score, good, logged, parts:[{key,label,got,max,ok,detail}]}
 *   DailyScore.streak(docs, today, {sessionFor})  -> {current, best, todayGood, last7:[{date,score,good}]}
 *   DailyScore.html(docs, date, {today, sessionFor}) -> HTML string for a card on the Today tab
 * session / sessionFor(date) is the planned session name (the app's sessionFor(d).session) so a rotation Rest day
 * without a workout doc still counts as rest. Without it, workouts/{date}.session is used.
 */
const DailyScore = (() => {
  const START = "2026-10-25", GOOD = 80;
  const PRO = 160, PRO_FLOOR = 120, KCAL_LO = 1850, KCAL_HI = 2150, KCAL_SLACK = 300;
  const WATER_TRAIN = 3500, WATER_REST = 3000, SLEEP_OK = 7, SLEEP_FLOOR = 5;
  const SUPPS = ["creatine", "omega", "d3", "mag"];
  const DAY = 864e5, WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  const ms = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const add = (s, n) => iso(ms(s) + n * DAY);
  const wday = s => new Date(ms(s)).getUTCDay();
  const localToday = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const num = v => { const n = typeof v === "string" && v.trim() !== "" ? Number(v) : v; return typeof n === "number" && isFinite(n) ? n : null; };
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const ramp = (v, lo, hi) => clamp01((v - lo) / (hi - lo));
  const fint = n => Math.round(n).toLocaleString("en-US");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function score(docs, date, opts = {}) {
    const day = (docs.days && docs.days[date]) || {};
    const wk = (docs.workouts && docs.workouts[date]) || {};
    const food = (day.food || []).filter(i => i && i.eaten);
    const kcal = food.reduce((s, i) => s + (num(i.kcal) || 0), 0);
    const p = food.reduce((s, i) => s + (num(i.p) || 0), 0);
    const friday = wday(date) === 5;
    const session = opts.session || wk.session || null;
    const training = !friday && session !== "Rest";
    const water = (num(day.water) || 0) + ((day.waterh && num(day.waterh.ml)) || 0);
    const waterGoal = training ? WATER_TRAIN : WATER_REST;
    const lifted = Object.values(wk.sets || {}).some(a => (a || []).some(x => x && (num(x.w) || num(x.r))));
    const tread = !!(day.treadmill || wk.treadmill);
    const supps = SUPPS.filter(k => day.supps && day.supps[k]).length;
    const sleep = num(day.sleep);
    const parts = [];
    const part = (key, label, max, frac, detail) => parts.push({ key, label, max, got: Math.round(max * frac * 10) / 10, ok: frac >= 1, detail });

    part("protein", "Protein", 25, food.length ? ramp(p, PRO_FLOOR, PRO) : 0, food.length ? Math.round(p) + " / " + PRO + " g" : "No food ticked as eaten");
    if (!friday) {
      const off = kcal < KCAL_LO ? KCAL_LO - kcal : kcal > KCAL_HI ? kcal - KCAL_HI : 0;
      part("kcal", "Calories", 20, food.length ? clamp01(1 - off / KCAL_SLACK) : 0, food.length ? fint(kcal) + " kcal (1,850–2,150)" : "No food ticked as eaten");
    }
    part("water", "Water", 15, clamp01(water / waterGoal), (water / 1000).toFixed(1) + " / " + waterGoal / 1000 + " L");
    if (training) part("training", "Training + treadmill", 15, (lifted ? 10 : 0) / 15 + (tread ? 5 : 0) / 15,
      (lifted ? "Lifted" : "No sets logged") + " · " + (tread ? "treadmill done" : "no treadmill"));
    else part("training", "Training", 15, 1, friday ? "Friday free day" : "Rest day");
    part("supps", "Supplements", 10, supps / SUPPS.length, supps + " of " + SUPPS.length);
    if (sleep != null) part("sleep", "Sleep", 15, ramp(sleep, SLEEP_FLOOR, SLEEP_OK), sleep + " h (7+)");

    const got = parts.reduce((s, x) => s + x.got, 0), max = parts.reduce((s, x) => s + x.max, 0);
    const pct = max ? Math.round(got / max * 100) : 0;
    const logged = food.length > 0 || water > 0 || lifted || tread || supps > 0 || sleep != null;
    return { date, score: logged ? pct : 0, good: logged && pct >= GOOD && parts.every(x => x.got > 0), logged, sleepLogged: sleep != null, parts };
  }

  function streak(docs, today, opts = {}) {
    today = today || localToday();
    const sc = d => score(docs, d, { session: opts.sessionFor ? opts.sessionFor(d) : undefined });
    const todayGood = today >= START && sc(today).good;
    let current = 0;
    for (let d = todayGood ? today : add(today, -1); d >= START && sc(d).good; d = add(d, -1)) current++;
    let best = 0, run = 0;
    for (let d = START; d <= today; d = add(d, 1)) { if (sc(d).good) best = Math.max(best, ++run); else run = 0; }
    const last7 = [];
    for (let i = 6; i >= 0; i--) { const d = add(today, -i); const s = sc(d); last7.push({ date: d, score: s.score, good: s.good, logged: s.logged, future: d < START }); }
    return { current, best, todayGood, last7 };
  }

  function html(docs, date, opts = {}) {
    const today = opts.today || localToday();
    const s = score(docs, date, { session: opts.sessionFor ? opts.sessionFor(date) : undefined });
    const st = streak(docs, date < today ? date : today, opts);
    const tone = s.good ? "good" : s.score >= 60 ? "warn" : "bad";
    const ring = (() => {
      const r = 34, c = 2 * Math.PI * r, f = s.score / 100;
      return '<svg class="ds-ring" viewBox="0 0 80 80" role="img" aria-label="Daily score ' + s.score + ' out of 100">' +
        '<circle cx="40" cy="40" r="' + r + '" class="ds-track"/>' +
        '<circle cx="40" cy="40" r="' + r + '" class="ds-fill ds-' + tone + '" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 40 40)"/>' +
        '<text x="40" y="46" text-anchor="middle" class="ds-num">' + s.score + '</text></svg>';
    })();
    const rows = s.parts.map(x => '<li class="' + (x.ok ? "ok" : "") + '"><span class="ds-lab">' + esc(x.label) + '</span><span class="ds-det">' + esc(x.detail) + '</span><span class="ds-pts">' + (Math.round(x.got * 10) / 10) + '<small>/' + x.max + '</small></span></li>').join("");
    const dots = st.last7.filter(d => !d.future).map(d => '<span class="ds-dot' + (d.good ? " good" : d.logged ? " part" : "") + '" title="' + d.date + ": " + (d.future ? "before the plan" : d.score) + '">' + WD[wday(d.date)][0] + '</span>').join("");
    const streakLine = st.current
      ? st.current + (st.current === 1 ? " good day" : " good days in a row") + (st.todayGood || date < today ? "" : ". Hit 80 today to make it " + (st.current + 1) + ".")
      : (date === today ? "Hit 80 today to start a streak." : "No streak on this day.");
    return '<div class="card ds-card"><div class="spread"><h3>Daily score</h3><span class="muted ds-small">Good day = 80+, nothing skipped</span></div>' +
      '<div class="ds-top">' + ring + '<div><p class="ds-streak"><b>' + streakLine + '</b></p><p class="muted ds-small">Best streak ' + st.best + ' · last 7 days</p><div class="ds-dots">' + dots + '</div></div></div>' +
      '<ul class="ds-parts">' + rows + '</ul>' +
      (date === today && !s.good ? '<p class="muted ds-small">So far today. Food counts once it’s ticked as eaten.</p>' : "") +
      (s.sleepLogged ? "" : '<p class="muted ds-small">Sleep isn’t logged, so the score is out of the other parts.</p>') + '</div>';
  }

  const css = `
.ds-card .ds-top{display:flex;gap:16px;align-items:center;margin:8px 0}
.ds-ring{width:84px;height:84px;flex:none}
.ds-track{fill:none;stroke:var(--sunk);stroke-width:8}
.ds-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray .6s}
.ds-fill.ds-good{stroke:var(--good)}.ds-fill.ds-warn{stroke:var(--warn)}.ds-fill.ds-bad{stroke:var(--bad)}
.ds-num{font-family:var(--display);font-size:24px;font-weight:700;fill:var(--ink)}
.ds-streak{margin:0}.ds-small{font-size:.82rem}
.ds-dots{display:flex;gap:6px;margin-top:6px}
.ds-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-family:var(--mono);background:var(--sunk);color:var(--muted)}
.ds-dot.part{background:color-mix(in srgb,var(--warn) 30%,var(--sunk));color:var(--ink)}
.ds-dot.good{background:var(--good);color:var(--surface)}
.ds-parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ds-parts li{display:grid;grid-template-columns:7.5rem 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.ds-lab{font-weight:600}.ds-det{color:var(--muted);font-size:.84rem}
.ds-pts{font-family:var(--mono);color:var(--muted)}.ds-parts li.ok .ds-pts{color:var(--good)}
@media (max-width:420px){.ds-parts li{grid-template-columns:1fr auto}.ds-det{grid-column:1/-1;grid-row:2}}
`;

  return { score, streak, html, css, GOOD, START };
})();
if (typeof module !== "undefined") module.exports = DailyScore;

window.DailyScore=DailyScore;
</script>
<script>
/* Goal date to 80 kg for the Aziz Cut Tracker.
 * Plain JS, no imports, no network. Reads the app's weights collection:
 *   weights = { "YYYY-MM-DD": {date, kg} }  (an array of {date, kg} works too)
 * API:
 *   GoalDate.css                               -> string, inject once (uses the app's tokens)
 *   GoalDate.trend(weights, {alpha})           -> [{date, kg, trend}] smoothed weight (EWMA, gap-aware)
 *   GoalDate.project(weights, {today, trend})  -> projection object (see below)
 *   GoalDate.html(weights, {today, trend})     -> card body HTML for the Progress tab
 *   GoalDate.compact(weights, {today, trend})  -> one-line HTML for the Today tab
 * opts.trend: optional series from the trend weight module, TrendTDEE.series(weights, {today}) -> [{date, kg, trend}].
 *   When given it is used as is, so both features show the same trend line. Without it the same
 *   smoothing is computed here (daily interpolation + EWMA 0.1). The weekly rate is always a
 *   least-squares slope on raw weigh-ins over the last 28 days, needing 5+ weigh-ins across 14+ days.
 * project() returns
 *   {status, today, current, start, goal, ratePerWeek, goalDate, range:{early, late}, daysLeft,
 *    weeksLeft, pctDone, milestones:[{kg, reachedOn, eta}], note}
 *   status: "empty" | "plan" (too little data, dates use the 0.5–0.8 kg/wk plan pace)
 *           | "trend" (dates from the trend slope) | "stalled" (trend not going down) | "reached"
 */
const GoalDate = (() => {
  const START = "2026-10-25", START_KG = 91.9, GOAL = 80, MILESTONES = [90, 85, 80];
  const ALPHA = 0.1, WINDOW = 28, MIN_SPAN = 14, MIN_POINTS = 5;
  const PLAN_FAST = 0.8, PLAN_SLOW = 0.5, WATER_FAST = 1.2, STALL = 0.1, RECENT = 14;
  const DAY = 864e5, WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  const ms = d => Date.parse(d + "T00:00:00Z");
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const add = (d, n) => iso(ms(d) + Math.round(n) * DAY);
  const days = (a, b) => Math.round((ms(b) - ms(a)) / DAY);
  const r1 = n => Math.round(n * 10) / 10;
  const todayIso = () => { const n = new Date(); return iso(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
  // Dates show the year only when it differs from the year of `ref` (today).
  const yr = (d, ref) => (d.slice(0, 4) !== String(ref || "").slice(0, 4) ? ", " + d.slice(0, 4) : "");
  const fmt = (d, ref) => { const t = new Date(ms(d)); return WD[t.getUTCDay()] + ", " + MON[t.getUTCMonth()] + " " + t.getUTCDate() + yr(d, ref); };
  const fmtShort = (d, ref) => { const t = new Date(ms(d)); return MON[t.getUTCMonth()] + " " + t.getUTCDate() + yr(d, ref); };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function clean(weights) {
    const list = Array.isArray(weights) ? weights : Object.values(weights || {});
    return list.filter(w => w && /^\d{4}-\d{2}-\d{2}$/.test(w.date) && +w.kg > 30 && +w.kg < 250)
      .map(w => ({ date: w.date, kg: +w.kg })).sort((a, b) => (a.date < b.date ? -1 : 1));
  }

  // Same smoothing as TrendTDEE.series: one point per calendar day, gaps filled by linear interpolation
  // between weigh-ins, then an EWMA (alpha 0.1) seeded at the first weigh-in. kg is null on filled days.
  function trend(weights, opts = {}) {
    const a = opts.alpha || ALPHA, ws = clean(weights), out = [];
    let t = null;
    for (let i = 0; i < ws.length; i++) {
      const w = ws[i], next = ws[i + 1];
      const gap = next ? days(w.date, next.date) : 1;
      for (let d = 0; d < gap; d++) {
        const v = w.kg + (next ? (next.kg - w.kg) * d / gap : 0);
        t = t == null ? v : t + a * (v - t);
        out.push({ date: add(w.date, d), kg: d ? null : w.kg, trend: Math.round(t * 100) / 100 });
      }
    }
    return out;
  }

  function fromExternal(series) {
    return (series || []).map(p => ({ date: p.date, kg: p.kg ?? null, trend: +(p.trend ?? p.kg) }))
      .filter(p => p.date && isFinite(p.trend)).sort((a, b) => (a.date < b.date ? -1 : 1));
  }

  // Least-squares slope (kg/day) and its standard error over points [{x: day number, y: kg}].
  function fit(pts) {
    const n = pts.length, mx = pts.reduce((s, p) => s + p.x, 0) / n, my = pts.reduce((s, p) => s + p.y, 0) / n;
    let sxx = 0, sxy = 0;
    for (const p of pts) { sxx += (p.x - mx) ** 2; sxy += (p.x - mx) * (p.y - my); }
    const b = sxx ? sxy / sxx : 0, a = my - b * mx;
    const rss = pts.reduce((s, p) => s + (p.y - a - b * p.x) ** 2, 0);
    const se = n > 2 && sxx ? Math.sqrt(rss / (n - 2) / sxx) : 0;
    return { a, b, se };
  }

  function project(weights, opts = {}) {
    const today = opts.today || todayIso(), goal = opts.goal || GOAL;
    const raw = clean(weights).filter(w => w.date <= today);
    const series = (opts.trend ? fromExternal(opts.trend) : trend(raw)).filter(p => p.date <= today);
    const base = { today, goal, start: START_KG, milestones: [], range: { early: null, late: null } };
    if (!series.length) {
      return Object.assign(base, { status: "empty", current: null, ratePerWeek: null, goalDate: null, daysLeft: null, weeksLeft: null, pctDone: 0,
        note: "Log a morning weigh-in to get your goal date." });
    }
    // Anchor on the last real weigh-in: a series padded to today holds the trend flat after it.
    const last = series.filter(p => p.kg != null).pop() || series[series.length - 1], current = last.trend;
    const pctDone = Math.max(0, Math.min(100, (START_KG - current) / (START_KG - goal) * 100));
    const reachedOn = kg => { const p = series.find(s => s.trend <= kg); return p ? p.date : null; };
    const ms_ = (kg, eta) => ({ kg, reachedOn: reachedOn(kg), eta: reachedOn(kg) ? null : eta(kg) });
    const marks = MILESTONES.filter(k => k >= goal);

    if (current <= goal) {
      return Object.assign(base, { status: "reached", current, ratePerWeek: null, goalDate: reachedOn(goal), daysLeft: 0, weeksLeft: 0, pctDone: 100,
        milestones: marks.map(k => ms_(k, () => null)), note: "You reached " + goal + " kg. Time to plan maintenance." });
    }

    // Rate is a least-squares slope on the raw weigh-ins of the last 28 days (as TrendTDEE does): the EWMA lags.
    const from = add(last.date, -(WINDOW - 1));
    const win = raw.filter(w => w.date >= from && w.date <= last.date);
    const span = win.length ? days(win[0].date, last.date) : 0;
    const left = current - goal;
    // The trend's own date is the anchor: projections count forward from the last weigh-in, not from today.
    const at = (rate, kg) => add(last.date, (current - kg) / rate * 7);

    if (win.length < MIN_POINTS || span < MIN_SPAN) {
      const eta = kg => at((PLAN_FAST + PLAN_SLOW) / 2, kg);
      return Object.assign(base, {
        status: "plan", current, ratePerWeek: null, pctDone,
        goalDate: eta(goal), range: { early: at(PLAN_FAST, goal), late: at(PLAN_SLOW, goal) },
        daysLeft: days(today, eta(goal)), weeksLeft: r1(left / ((PLAN_FAST + PLAN_SLOW) / 2)),
        milestones: marks.map(k => ms_(k, eta)),
        note: "Based on the plan pace of " + PLAN_SLOW + "–" + PLAN_FAST + " kg a week. Your own trend takes over once you have " +
          MIN_POINTS + "+ weigh-ins across 2 weeks (" + (win.length >= MIN_POINTS ? "from " : "earliest ") + fmtShort(add(win.length ? win[0].date : last.date, MIN_SPAN), today) + ").",
      });
    }

    const f = fit(win.map(w => ({ x: days(START, w.date), y: w.kg })));
    const rate = -f.b * 7;
    const recent = win.filter(w => w.date >= add(last.date, -(RECENT - 1)));
    const recentRate = recent.length >= 4 ? -fit(recent.map(w => ({ x: days(START, w.date), y: w.kg }))).b * 7 : rate;
    if (rate < STALL || recentRate < STALL) {
      return Object.assign(base, { status: "stalled", current, ratePerWeek: r1(Math.min(rate, recentRate)) || 0, goalDate: null, daysLeft: null, weeksLeft: null, pctDone,
        milestones: marks.map(k => ms_(k, () => null)),
        note: "Your weight has not gone down over the last " + (rate < STALL ? Math.round(span / 7) : 2) + " weeks, so there's no date to show. Check the weekly report before changing calories." });
    }
    const fast = -(f.b - f.se) * 7, slow = -(f.b + f.se) * 7;
    const eta = kg => at(rate, kg);
    const note = rate > WATER_FAST && days(START, last.date) < 28
      ? "Early weeks include water loss, so this date will likely move later as the trend settles."
      : rate < PLAN_SLOW ? "Slower than the " + PLAN_SLOW + "–" + PLAN_FAST + " kg a week plan." : rate > PLAN_FAST ? "Faster than the " + PLAN_SLOW + "–" + PLAN_FAST + " kg a week plan." : "On the plan pace of " + PLAN_SLOW + "–" + PLAN_FAST + " kg a week.";
    return Object.assign(base, {
      status: "trend", current, ratePerWeek: r1(rate), pctDone,
      goalDate: eta(goal), range: { early: at(fast, goal), late: slow > 0.05 ? at(slow, goal) : null },
      daysLeft: days(today, eta(goal)), weeksLeft: r1(left / rate),
      milestones: marks.map(k => ms_(k, eta)), note,
    });
  }

  function rangeText(p) {
    const { early, late } = p.range;
    if (!early || early === late) return "";
    if (!late) return "earliest " + fmtShort(early, p.today);
    const sameYear = early.slice(0, 4) === late.slice(0, 4);
    return (sameYear ? fmtShort(early, late) : fmtShort(early, p.today)) + " – " + fmtShort(late, p.today);
  }

  function html(weights, opts = {}) {
    const p = project(weights, opts);
    if (p.status === "empty") return '<div class="gd"><p class="gd-sub">' + esc(p.note) + "</p></div>";
    const head = p.status === "reached"
      ? '<div class="gd-big">' + esc(p.goal) + " kg reached</div><div class=\"gd-sub\">" + (p.goalDate ? "On " + esc(fmt(p.goalDate, p.today)) : "") + "</div>"
      : p.status === "stalled"
        ? '<div class="gd-big">No date yet</div><div class="gd-sub">Trend ' + esc(r1(p.current)) + " kg, not going down</div>"
        : '<div class="gd-big">' + esc(fmt(p.goalDate, p.today)) + '</div><div class="gd-sub">' +
          (p.status === "plan" ? "Plan estimate" : "At " + esc(p.ratePerWeek) + " kg a week") + " · " + esc(p.weeksLeft) + " weeks to go" +
          (rangeText(p) ? " · likely " + esc(rangeText(p)) : "") + "</div>";
    const bar = '<div class="gd-bar" role="img" aria-label="' + Math.round(p.pctDone) + '% of the way from ' + START_KG + " to " + p.goal + ' kg"><i style="width:' + p.pctDone.toFixed(1) + '%"></i>' +
      p.milestones.map(m => '<b class="' + (m.reachedOn ? "on" : "") + '" style="left:' + ((START_KG - m.kg) / (START_KG - p.goal) * 100).toFixed(1) + '%"></b>').join("") + "</div>" +
      '<div class="gd-ends"><span>' + START_KG + " kg</span><span>Trend " + r1(p.current) + " kg</span><span>" + p.goal + " kg</span></div>";
    const list = '<ul class="gd-ms">' + p.milestones.map(m => "<li" + (m.reachedOn ? ' class="on"' : "") + "><b>" + m.kg + " kg</b><span>" +
      (m.reachedOn ? "Reached " + esc(fmtShort(m.reachedOn, p.today)) : m.eta ? esc(fmt(m.eta, p.today)) : "–") + "</span></li>").join("") + "</ul>";
    return '<div class="gd">' + head + bar + list + '<p class="gd-note">' + esc(p.note) + "</p></div>";
  }

  function compact(weights, opts = {}) {
    const p = project(weights, opts);
    if (p.status === "empty") return "";
    const next = p.milestones.find(m => !m.reachedOn && m.eta && m.kg !== p.goal);
    const txt = p.status === "reached" ? "You reached " + p.goal + " kg."
      : p.status === "stalled" ? "Trend " + r1(p.current) + " kg and flat, no goal date yet."
        : p.goal + " kg around <b>" + esc(fmtShort(p.goalDate, p.today)) + "</b>" + (p.status === "plan" ? " (plan pace)" : "") +
          (next ? " · " + next.kg + " kg by " + esc(fmtShort(next.eta, p.today)) : "");
    return '<div class="gd-line">' + txt + "</div>";
  }

  const css = [
    ".gd{display:flex;flex-direction:column;gap:10px}",
    ".gd-big{font-family:var(--display);font-size:1.8rem;font-weight:700;line-height:1.05}",
    ".gd-sub,.gd-note,.gd-ends{font-size:.85rem;color:var(--muted)}.gd-note{margin:0}",
    ".gd-bar{position:relative;height:10px;border-radius:999px;background:var(--sunk);margin-top:4px}",
    ".gd-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--accent);transition:width .4s}",
    ".gd-bar b{position:absolute;top:-3px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--line)}.gd-bar b.on{background:var(--good)}",
    ".gd-ends{display:flex;justify-content:space-between}",
    ".gd-ms{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}",
    ".gd-ms li{border:1px solid var(--line);border-radius:var(--r,10px);padding:6px 8px;display:flex;flex-direction:column;gap:2px}",
    ".gd-ms li span{font-size:.8rem;color:var(--muted)}.gd-ms li.on{border-color:var(--good)}.gd-ms li.on b{color:var(--good)}",
    ".gd-line{font-size:.92rem;color:var(--muted)}.gd-line b{color:var(--ink)}",
  ].join("\n");

  return { css, trend, project, html, compact, START, START_KG, GOAL, MILESTONES };
})();

if (typeof module !== "undefined" && module.exports) module.exports = GoalDate;

window.GoalDate=GoalDate;
</script>
<script>
window.Steps=(function(){
// Daily steps: parses what the phone hands over (a typed number, or an export
// from Health Connect or a step app), folds it into a `days/{date}` doc, and
// renders the "Steps" goal card for the Today tab. Plain ES module, no
// dependencies, no network.
//
// A Claude Artifact can't read Health Connect or any step app's account, so
// the phone hands the numbers over. Health Connect is the hub on Android:
// most step apps write to it, and one exporter covers them all. Where an app
// doesn't, its own data export is read directly (see STEP_SOURCES).
//
// Accepted input (one paste or one file; the format is detected):
//   8432 / 8,432 / 8.4k             <- a bare number = today
//   STEPS 2026-10-25 8432           <- one line per day (latest line wins)
//   Health Connect exporter CSV     daily (Date,Steps), records (start_time,count,data_origin), long (time,type,value)
//   Samsung Health "Download personal data": step_daily_trend / step_count CSVs
//   Fitbit: steps-*.json (Takeout / data export) or the account export CSV
//   Garmin: Connect Reports CSV (,Actual,Goal) or UDSFile_*.json
//   Google Fit Takeout: Daily activity metrics.csv ("Step count")

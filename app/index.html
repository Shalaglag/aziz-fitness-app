<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column app shell, sticky date header, tabs on top (desktop) or a bottom bar (phone).
   Colours, type and motion come from the shared "Plate" theme kit (theme.css + motion.css). */
/* ==========================================================================
   Fitness app theme  ·  "Plate" system
   Neutrals: cool chalk (light) and gunmetal (dark).
   Accents: named after Olympic bumper plates (25 kg red, 20 kg blue,
   15 kg yellow, 10 kg green). Pick one with <html data-accent="blue">.
   Mode: <html data-theme="light|dark">, or no attribute to follow the system.
   Fonts (Google Fonts):
   https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap
   ========================================================================== */

:root {
  /* ---- Neutrals (light) ---- */
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --surface-2: #E7EBEF;
  --surface-3: #DAE0E6;
  --fg: #12161B;
  --fg-muted: #586370;
  --fg-faint: #8A949F;
  --line: #D3DAE1;
  --overlay: rgba(18, 22, 27, .45);

  /* ---- Accent palettes (each has a light and dark value) ---- */
  --accent-light: #1F5FD1;  --accent-dark: #6B9BF5;      /* default: 20 kg blue */
  --on-accent-light: #FFFFFF; --on-accent-dark: #0B1222;
  --accent: var(--accent-light);
  --on-accent: var(--on-accent-light);
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));

  /* ---- Macros (fixed across accents so charts stay readable) ---- */
  --protein: #6E52D4;
  --carbs: #D07F12;
  --fat: #158C8C;
  --kcal: var(--fg);

  /* ---- Status ---- */
  --good: #1E8A4C;
  --warn: #B86E00;
  --bad: #C8352E;

  /* ---- Type ---- */
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --text-xs: .75rem;    /* 12  captions, units */
  --text-sm: .875rem;   /* 14  secondary */
  --text-md: 1rem;      /* 16  body */
  --text-lg: 1.25rem;   /* 20  card titles */
  --text-xl: 1.75rem;   /* 28  screen titles (display) */
  --text-2xl: 2.5rem;   /* 40  hero numbers (display) */
  --text-3xl: 3.5rem;   /* 56  ring centre, PR number */

  /* ---- Space (4px grid) ---- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  /* ---- Shape & depth ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(18, 22, 27, .06), 0 1px 1px rgba(18, 22, 27, .04);
  --shadow-2: 0 6px 20px rgba(18, 22, 27, .10), 0 2px 6px rgba(18, 22, 27, .06);
  --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);

  --tap: 44px; /* minimum touch target */

  color-scheme: light;
}

/* ---- Accent choices ---- */
[data-accent="red"]    { --accent-light: #D0302A; --accent-dark: #F2665D; --on-accent-light: #FFFFFF; --on-accent-dark: #220B0A; }
[data-accent="blue"]   { --accent-light: #1F5FD1; --accent-dark: #6B9BF5; --on-accent-light: #FFFFFF; --on-accent-dark: #0B1222; }
[data-accent="yellow"] { --accent-light: #A87300; --accent-dark: #F2C230; --on-accent-light: #FFFFFF; --on-accent-dark: #221A02; }
[data-accent="green"]  { --accent-light: #1B8048; --accent-dark: #43C47E; --on-accent-light: #FFFFFF; --on-accent-dark: #06200F; }

/* ---- Dark (system setting, unless light was chosen) ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1013; --surface: #161A1F; --surface-2: #1F252C; --surface-3: #29303A;
    --fg: #EDF0F3; --fg-muted: #9AA4AF; --fg-faint: #6B7580; --line: #2A323B;
    --overlay: rgba(0, 0, 0, .6);
    --accent: var(--accent-dark); --on-accent: var(--on-accent-dark);
    --protein: #A08BF2; --carbs: #F0AE4A; --fat: #3CC4C4;
    --good: #43C47E; --warn: #F2A93B; --bad: #F2665D;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 8px 24px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
/* ---- Dark (chosen explicitly) ---- */
:root[data-theme="dark"] {
  --bg: #0D1013; --surface: #161A1F; --surface-2: #1F252C; --surface-3: #29303A;
  --fg: #EDF0F3; --fg-muted: #9AA4AF; --fg-faint: #6B7580; --line: #2A323B;
  --overlay: rgba(0, 0, 0, .6);
  --accent: var(--accent-dark); --on-accent: var(--on-accent-dark);
  --protein: #A08BF2; --carbs: #F0AE4A; --fat: #3CC4C4;
  --good: #43C47E; --warn: #F2A93B; --bad: #F2665D;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 8px 24px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* ==========================================================================
   Aliases for the app shell's existing token names (APP-SHELL.md).
   Inline this file in place of the app's own color/font token blocks;
   these follow mode and accent changes automatically.
   ========================================================================== */
:root {
  --sunk: var(--surface-2);
  --ink: var(--fg);
  --muted: var(--fg-muted);
  --accent-ink: var(--on-accent);
  --display: var(--font-display);
  --body: var(--font-body);
  --mono: var(--font-mono);
  --r: var(--radius-md);
}

/* ==========================================================================
   Fitness app motion
   Rule of thumb: motion confirms an action (a set logged, a meal eaten)
   or shows progress (rings, bars). It never delays reading.
   Everything collapses to instant under prefers-reduced-motion.
   ========================================================================== */

:root {
  --dur-tap: 120ms;     /* press feedback */
  --dur-ui: 220ms;      /* toggles, tabs, sheets */
  --dur-enter: 420ms;   /* cards entering a screen */
  --dur-fill: 900ms;    /* rings and bars filling */
  --dur-celebrate: 1200ms;

  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  --stagger: 50ms;      /* per item, via style="--i: 2" */
}

/* ---- Press feedback: any button or tappable card ---- */
.tap { transition: transform var(--dur-tap) var(--ease-out), background-color var(--dur-ui) var(--ease-out); }
.tap:active { transform: scale(.97); }

/* ---- Screen entry: cards rise in, staggered by --i ---- */
@keyframes fit-rise { from { opacity: 0; transform: translateY(12px); } }
.anim-rise {
  animation: fit-rise var(--dur-enter) var(--ease-out) backwards;
  animation-delay: calc(var(--i, 0) * var(--stagger));
}

/* ---- Pop: checking off a set, marking a meal as eaten ---- */
@keyframes fit-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.anim-pop { animation: fit-pop 320ms var(--ease-spring); }

/* ---- Check mark draws itself (SVG path with pathLength="1") ---- */
@keyframes fit-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.anim-draw { stroke-dasharray: 1; animation: fit-draw 260ms var(--ease-out) both; }

/* ---- Progress ring: SVG circle with pathLength="100".
        Set style="--value: 82" (0-100) and the ring animates to it. ---- */
.ring-track { stroke: var(--surface-2); }
.ring-fill {
  stroke: var(--accent);
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: calc(100 - min(var(--value, 0), 100));
  transition: stroke-dashoffset var(--dur-fill) var(--ease-out);
  transform: rotate(-90deg);
  transform-origin: center;
}
.ring-fill.is-over { stroke: var(--warn); }

/* ---- Bars (macros, volume): width set via --value (0-100) ---- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span {
  display: block; height: 100%; border-radius: inherit;
  width: calc(min(var(--value, 0), 100) * 1%);
  background: var(--bar-color, var(--accent));
  transition: width var(--dur-fill) var(--ease-out);
}

/* ---- Tab / screen switch fallback (when View Transitions aren't supported) ---- */
@keyframes fit-slide-in-r { from { opacity: 0; transform: translateX(24px); } }
@keyframes fit-slide-in-l { from { opacity: 0; transform: translateX(-24px); } }
.anim-in-right { animation: fit-slide-in-r var(--dur-ui) var(--ease-out) backwards; }
.anim-in-left  { animation: fit-slide-in-l var(--dur-ui) var(--ease-out) backwards; }

/* ---- View Transitions (Chrome, Safari 18+): used by FitMotion.switchView ---- */
::view-transition-old(root),
::view-transition-new(root) { animation-duration: var(--dur-ui); animation-timing-function: var(--ease-out); }
::view-transition-old(fit-screen) { animation: var(--dur-ui) var(--ease-out) both fit-out; }
::view-transition-new(fit-screen) { animation: var(--dur-ui) var(--ease-out) both fit-slide-in-r; }
:root[data-nav="back"]::view-transition-new(fit-screen) { animation-name: fit-slide-in-l; }
@keyframes fit-out { to { opacity: 0; } }

/* ---- Bottom sheet (add food, log weight) ---- */
.sheet {
  transform: translateY(100%);
  transition: transform var(--dur-ui) var(--ease-out);
}
.sheet.is-open { transform: translateY(0); }

/* ---- Rest timer: soft pulse in the last 10 seconds ---- */
@keyframes fit-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
  50%      { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 0%, transparent); }
}
.anim-pulse { animation: fit-pulse 1s var(--ease-in-out) infinite; }

/* ---- Loading placeholder ---- */
@keyframes fit-shimmer { to { background-position: -200% 0; } }
.skeleton {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
  background-size: 200% 100%;
  animation: fit-shimmer 1.4s linear infinite;
}

/* ---- New PR: number lifts and a burst of plate-colored pieces (FitMotion.celebrate) ---- */
@keyframes fit-lift {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-6px) scale(1.12); }
  100% { transform: translateY(0) scale(1); }
}
.anim-pr { animation: fit-lift 600ms var(--ease-spring); color: var(--accent); }
.fit-burst-piece {
  position: absolute; width: 8px; height: 4px; border-radius: 1px;
  pointer-events: none;
  animation: fit-burst var(--dur-celebrate) var(--ease-out) forwards;
}
@keyframes fit-burst {
  from { transform: translate(0, 0) rotate(0); opacity: 1; }
  to   { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
}

/* ---- Theme switch: colors cross-fade instead of snapping ---- */
:root.is-theming, :root.is-theming * {
  transition: background-color var(--dur-ui) var(--ease-out),
              color var(--dur-ui) var(--ease-out),
              border-color var(--dur-ui) var(--ease-out),
              fill var(--dur-ui) var(--ease-out),
              stroke var(--dur-ui) var(--ease-out) !important;
}

/* ---- Reduced motion: keep state changes, drop movement ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .fit-burst-piece { display: none; }
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--accent)}
.datepick{display:flex;align-items:center;gap:6px}
.datepick .d{min-width:9.5em;text-align:center;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.today-link{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px}
nav.tabs{display:flex;gap:4px;padding-bottom:8px}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:var(--display);font-size:1.1rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sync{font-size:.75rem;color:var(--muted)}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{padding:8px 6px;font-size:1rem;flex:1}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .datepick .d{min-width:8em}
}

#lbHost,#ppHost{padding-block:0 40px}
@media (max-width:720px){#lbHost,#ppHost{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
main{padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:.88rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rest{border-style:dashed}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--accent)}
input[type=number],input[type=text],input[type=search],select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{width:5.2em}
.field{display:flex;flex-direction:column;gap:4px}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:.92rem}
.note.info{border-color:var(--accent)}
.note.bad{border-color:var(--bad)}

/* macro bars */
.macros{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center}
.mbar{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.mbar .planned{position:absolute;inset:0 auto 0 0;opacity:.28}
.mbar .eaten{position:absolute;inset:0 auto 0 0}
.mbar .zone{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.5}
.mval{font-family:var(--mono);font-size:.85rem;white-space:nowrap;text-align:right}
.kcal{background:var(--ink)} .p{background:var(--protein)} .c{background:var(--carbs)} .f{background:var(--fat)}
.bigk{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:5.6em 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.tl li:first-child{border-top:0}
.tl .t{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding-top:1px}

/* list items */
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:.78rem}
.item .mac{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.item.planned .nm b{font-weight:500;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--good)}

/* exercises */
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:8px;padding:4px 6px}
.set .i{font-family:var(--mono);font-size:.75rem;color:var(--muted);width:1.2em}
.set input{width:4.2em;background:var(--surface)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
details ul{margin:6px 0 0;padding-left:1.1em}
.timer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .num{font-size:1.4rem}
.timer button{background:transparent;border:1px solid var(--bg);color:var(--bg);border-radius:6px;padding:3px 8px;cursor:pointer}
@media (max-width:720px){.timer{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.banned td{color:var(--muted);text-decoration:line-through}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat .v{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.05}
.prog{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.days14{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.days14 span{height:26px;border-radius:4px;background:var(--sunk);font-family:var(--mono);font-size:.62rem;display:grid;place-items:center;color:var(--muted)}
.days14 span.has{background:var(--accent);color:var(--accent-ink)}
.days14 span.today{outline:2px solid var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.guide p+p{margin-top:8px}
.guide ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
.lib{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.lib .card{gap:6px}
.lib .card ul{font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:20;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<header class="top">
  <div class="wrap">

<script>
/* Fitness app motion helpers. Pairs with motion.css.
   API:
     FitMotion.reduced()                  -> true if the user prefers less motion
     FitMotion.countUp(el, to, opts)      -> animates a number (opts: from, duration, decimals, suffix)
     FitMotion.pop(el)                    -> replays the .anim-pop bounce (set done, meal eaten)
     FitMotion.celebrate(el)              -> PR burst around el (plate colors)
     FitMotion.switchView(update, dir)    -> runs update() inside a screen transition; dir "forward" | "back"
     FitMotion.setProgress(el, value)     -> sets --value (0-100) on a .ring-fill or .bar > span
*/
(function () {
  var mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reduced() { return !!(mq && mq.matches); }

  function format(n, decimals, suffix) {
    return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + (suffix || "");
  }

  function countUp(el, to, opts) {
    opts = opts || {};
    var from = opts.from != null ? opts.from : 0;
    var decimals = opts.decimals || 0;
    var duration = opts.duration || 900;
    if (reduced()) { el.textContent = format(to, decimals, opts.suffix); return; }
    var start = null;
    function frame(t) {
      if (start === null) start = t;
      var p = Math.min((t - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = format(from + (to - from) * eased, decimals, opts.suffix);
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth; // restart the animation
    el.classList.add(cls);
  }

  function pop(el) { replay(el, "anim-pop"); }

  // Olympic plate colors: 25 kg red, 20 kg blue, 15 kg yellow, 10 kg green.
  var PLATES = ["#D0302A", "#1F5FD1", "#F2C230", "#1B8048"];

  function celebrate(el) {
    replay(el, "anim-pr");
    if (reduced()) return;
    var host = el.offsetParent || document.body;
    var r = el.getBoundingClientRect();
    var h = host.getBoundingClientRect();
    var cx = r.left - h.left + r.width / 2 + host.scrollLeft;
    var cy = r.top - h.top + r.height / 2 + host.scrollTop;
    for (var i = 0; i < 18; i++) {
      var piece = document.createElement("span");
      piece.className = "fit-burst-piece";
      var angle = (Math.PI * 2 * i) / 18 + Math.random() * .3;
      var dist = 40 + Math.random() * 50;
      piece.style.left = cx + "px";
      piece.style.top = cy + "px";
      piece.style.background = PLATES[i % 4];
      piece.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      piece.style.setProperty("--dy", Math.sin(angle) * dist - 20 + "px");
      piece.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
      host.appendChild(piece);
      setTimeout(piece.remove.bind(piece), 1300);
    }
  }

  function switchView(update, dir) {
    var root = document.documentElement;
    root.setAttribute("data-nav", dir === "back" ? "back" : "forward");
    if (document.startViewTransition && !reduced()) {
      document.startViewTransition(update);
    } else {
      update();
    }
  }

  function setProgress(el, value) {
    el.style.setProperty("--value", Math.max(0, value));
    if (el.classList.contains("ring-fill")) el.classList.toggle("is-over", value > 100);
  }

  window.FitMotion = { reduced: reduced, countUp: countUp, pop: pop, celebrate: celebrate, switchView: switchView, setProgress: setProgress };
})();

</script>
<script>
/*
 * Nutreeze daily meal picker engine.
 * Pure logic, no DOM. Works as a browser global (window.NutreezePicker)
 * or as a CommonJS module, so the main app can import it as-is.
 *
 * Rules come from Aziz's plan (sections 3, 5-8 and 14):
 *   2 main meals + 2 Nutreeze snacks + Adonis (+ Gatorade on training days),
 *   ~2,000 kcal, 160-170 g protein minimum, fat ~55-70 g, carbs ~180-220 g.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NutreezePicker = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const TARGETS = { kcal: 2000, proteinMin: 160, proteinMax: 170, fat: [55, 70], carbs: [180, 220] };

  // Fixed "Sweet" tab snack menu. Banned snacks are kept so they can be shown as removed.
  const SNACKS = [
    { name: 'Chopped Pineapple', cat: 'Fruit', kcal: 44, p: 0, c: 11, f: 0 },
    { name: 'Fruit Salad', cat: 'Fruit', kcal: 48, p: 1, c: 11, f: 0 },
    { name: 'Mango', cat: 'Fruit', kcal: 52, p: 1, c: 12, f: 0 },
    { name: 'Pomegranate', cat: 'Fruit', kcal: 60, p: 1, c: 14, f: 0 },
    { name: 'Grapes', cat: 'Fruit', kcal: 68, p: 1, c: 16, f: 0 },
    { name: 'Dry Fruits', cat: 'Fruit', kcal: 93, p: 1, c: 20, f: 1 },
    { name: 'Green Apple', cat: 'Fruit', kcal: 104, p: 1, c: 25, f: 0 },
    { name: 'Banana', cat: 'Fruit', kcal: 121, p: 1, c: 27, f: 1 },
    { name: 'Zaafaran Cake', cat: 'Sweet', kcal: 105, p: 2, c: 13, f: 5 },
    { name: 'Chocolate Chip Cookies', cat: 'Sweet', kcal: 113, p: 3, c: 14, f: 5 },
    { name: 'Pro Mud Cake', cat: 'Sweet', kcal: 252, p: 4, c: 14, f: 20 },
    { name: 'Tamari Roasted Seeds (Pumpkin & Sunflower)', cat: 'Nuts', kcal: 167, p: 6, c: 11, f: 11 },
    { name: 'Roasted Rosemary Almonds', cat: 'Nuts', kcal: 183, p: 6, c: 6, f: 15 },
    { name: 'Herbs Roasted Walnut', cat: 'Nuts', kcal: 248, p: 6, c: 11, f: 20 },
    { name: 'Kinder Protein Ball', cat: 'Sweet', kcal: 162, p: 3, c: 15, f: 10 },
    { name: 'Popcorn', cat: 'Sweet', kcal: 61, p: 7, c: 6, f: 1 },
    { name: 'Blueberry Vanilla Muffin', cat: 'Sweet', kcal: 166, p: 8, c: 11, f: 10 },
  ];

  const ADONIS = { name: 'Adonis Protein Cookie Dough (50 g)', kcal: 192, p: 22, c: 11.4, f: 6.2 };
  const GATORADE = { name: 'Gatorade 1 L', kcal: 240, p: 0, c: 60, f: 0, estimate: true };
  // Midpoint of the plan's ~460-520 kcal | 31 P | 40-50 C | 20 F estimate.
  const SATURDAY_EGGS = { name: '3 eggs + Kraft spread + 1½ khubz', kcal: 490, p: 31, c: 45, f: 20, estimate: true };

  // Never pick. Each rule: label shown to the user + matcher on the lowercased name.
  const NEVER = [
    { label: 'Creamy Garlic Cheesy Chicken & Potato', test: n => /creamy garlic/.test(n) },
    { label: 'Chicken Mushroom with Sourdough', test: n => /mushroom/.test(n) && /chicken/.test(n) || /sourdough/.test(n) },
    { label: 'Chicken Shawarma', test: n => /shawarma/.test(n) },
    { label: 'Champion Chicken', test: n => /champion/.test(n) },
    { label: 'Minced Beef with Rice', test: n => /minced beef/.test(n) },
    { label: 'Tandoori Chicken with Grilled Tomato Jam', test: n => /tandoori/.test(n) },
    { label: 'Tuna, fish or shrimp', test: n => /\b(tuna|fish|shrimps?|prawns?|salmon|hammour|hamour|cod|tilapia|sea ?bass|zubaidi|seafood|calamari|sushi)\b/.test(n) },
    { label: 'Sandwiches (except French Tacos Chicken)', test: n => /\b(sandwich|sandwiches|panini|sub)\b/.test(n) && !/french tacos/.test(n) },
    { label: 'Protein balls', test: n => /protein ball|kinder/.test(n) },
    { label: 'Popcorn', test: n => /popcorn/.test(n) },
    { label: 'Blueberry Vanilla Muffin', test: n => /blueberry vanilla muffin/.test(n) },
  ];

  // Preference bonuses (subtracted from the penalty score).
  const LIKES = [
    { label: 'Favorite', bonus: 40, test: n => /french tacos/.test(n) },
    { label: 'Liked', bonus: 15, test: n => /buffalo/.test(n) && /sweet potato/.test(n) },
    { label: 'Liked', bonus: 15, test: n => /(majboos|machboos|biryani)/.test(n) },
    { label: 'Liked', bonus: 15, test: n => /steak/.test(n) && /potato/.test(n) },
    { label: 'Likes this type', bonus: 5, test: n => /(chicken|rice|steak|pasta|beef)/.test(n) },
  ];

  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();

  function bannedReason(name, extraBans) {
    if (name && typeof name === 'object') {
      if (name.bannedReason) return name.bannedReason;
      name = name.name;
    }
    const n = norm(name);
    for (const r of NEVER) if (r.test(n)) return r.label;
    for (const b of extraBans || []) if (b && n.includes(norm(b))) return 'Your never-pick list: ' + b;
    return null;
  }

  function likeOf(name) {
    const n = norm(name);
    for (const l of LIKES) if (l.test(n)) return l;
    return null;
  }

  /*
   * Parse a pasted menu. One meal per line; the last four numbers are kcal, protein, carbs, fat.
   * Accepts "French Tacos Chicken — 620 kcal | 55 P | 60 C | 18 F", "Name, 620, 55, 60, 18", etc.
   */
  function parseMenu(text) {
    const json = parseMenuJson(text);
    if (json) return json;
    const out = [];
    String(text || '').split(/\r?\n/).forEach((raw, i) => {
      const line = raw.trim();
      if (!line || line.startsWith('#')) return;
      const nums = [...line.matchAll(/\d+(?:\.\d+)?/g)];
      if (nums.length < 4) {
        out.push({ line: i + 1, raw: line, name: line.replace(/[\s,|:—–-]+$/, ''), error: 'Needs 4 numbers: kcal, protein, carbs, fat' });
        return;
      }
      const last = nums.slice(-4);
      const name = line.slice(0, last[0].index).replace(/[\s,|:;—–\-=(]+$/, '').trim();
      const [kcal, p, c, f] = last.map(m => parseFloat(m[0]));
      if (!name) {
        out.push({ line: i + 1, raw: line, name: '', error: 'Missing meal name' });
        return;
      }
      out.push({ line: i + 1, raw: line, name, kcal, p, c, f });
    });
    return out;
  }

  /*
   * Accepts the Menu Reader's saved record or exported file (nutreeze-menus/FORMAT.md):
   * { date, items: [{ name, section, kcal, protein, carbs, fat, banned, bannedReason, needsCheck }] }.
   * Only section "meal" items are used; snacks come from the fixed snack menu.
   */
  function parseMenuJson(text) {
    const t = String(text || '').trim();
    if (!/^[\[{]/.test(t)) return null;
    let data;
    try { data = JSON.parse(t); } catch (e) { return null; }
    const items = Array.isArray(data) ? data : data && Array.isArray(data.items) ? data.items : null;
    if (!items) return null;
    const out = [];
    items.forEach((it, i) => {
      if (!it || (it.section && it.section !== 'meal')) return;
      const m = { line: i + 1, raw: it.name, name: String(it.name || '').trim(), kcal: it.kcal, p: it.protein, c: it.carbs, f: it.fat };
      if (!m.name) return;
      if ([m.kcal, m.p, m.c, m.f].some(v => typeof v !== 'number')) m.error = 'A number was unreadable on the screenshot; fix it in the Menu Reader';
      if (it.banned) m.bannedReason = it.bannedReason || 'Marked never-pick in the Menu Reader';
      if (it.needsCheck) m.needsCheck = true;
      out.push(m);
    });
    out.date = typeof data.date === 'string' ? data.date : null;
    return out;
  }

  const sum = items => items.reduce((t, x) => ({
    kcal: t.kcal + x.kcal, p: t.p + x.p, c: t.c + x.c, f: t.f + x.f,
  }), { kcal: 0, p: 0, c: 0, f: 0 });

  const outside = (v, [lo, hi]) => (v < lo ? lo - v : v > hi ? v - hi : 0);

  // Lower is better.
  function score(meal1, meal2, snacks, totals, opts) {
    let s = 0;
    const dk = totals.kcal - TARGETS.kcal;
    const adk = Math.abs(dk);
    s += adk <= 50 ? adk * 0.2 : 10 + (adk - 50) * (dk > 0 ? 1.3 : 1);
    // Protein minimum is a hard rule: missing it outweighs even the favorite bonus.
    if (totals.p < TARGETS.proteinMin - 0.5) s += 60 + (TARGETS.proteinMin - totals.p) * 8;
    s += outside(totals.f, TARGETS.fat) * 2;
    s += outside(totals.c, TARGETS.carbs) * 0.5;
    // Meal 1 sits ~1.5 h before training on weekdays: keep it lower in fat.
    if (opts.dayType === 'training' && meal1.f > 20) s += (meal1.f - 20);
    for (const m of [meal1, meal2]) { const l = likeOf(m.name); if (l) s -= l.bonus; }
    if (snacks.some(x => x.cat === 'Sweet')) s -= 10;
    else if (snacks.some(x => x.cat === 'Fruit')) s -= 4;
    return s;
  }

  // Meal 1 = the lighter, lower-fat, higher-carb meal.
  function orderMeals(a, b) {
    const key = m => m.f * 9 - m.c * 2 + m.kcal * 0.2;
    return key(a) <= key(b) ? [a, b] : [b, a];
  }

  // Which time slot each snack goes with.
  function snackTiming(snacks, meal1, opts) {
    const heavyMeal1 = meal1.kcal >= 700;
    return snacks.map(s => {
      const evening = s.cat === 'Nuts' || /pro mud cake/i.test(s.name) || (heavyMeal1 && s.cat === 'Sweet');
      return { ...s, with: evening ? 'meal2' : 'meal1' };
    });
  }

  function slotLabels(dayType) {
    if (dayType === 'saturday') return { meal1: 'lunch, after training', meal2: 'evening' };
    if (dayType === 'rest') return { meal1: 'lunch', meal2: 'evening' };
    if (dayType === 'friday') return { meal1: 'midday', meal2: 'evening' };
    return { meal1: '2 pm, pre-workout', meal2: '8–9 pm' };
  }

  /*
   * opts: {
   *   meals: [{name,kcal,p,c,f}], dayType: 'training'|'rest'|'saturday'|'friday',
   *   adonis: bool, gatorade: bool, eggs: bool, extraBans: [str], unavailableSnacks: [name],
   *   lockMeals: [name], lockSnacks: [name], exclude: [name], top: n
   * }
   */
  function pick(opts) {
    const o = Object.assign({ dayType: 'training', adonis: true, gatorade: true, eggs: false, extraBans: [], unavailableSnacks: [], lockMeals: [], lockSnacks: [], exclude: [], top: 5 }, opts);
    const excluded = new Set(o.exclude.map(norm));
    const fixed = [];
    if (o.eggs) fixed.push({ ...SATURDAY_EGGS, slot: 'breakfast' });
    if (o.adonis) fixed.push({ ...ADONIS, slot: 'adonis' });
    if (o.gatorade) fixed.push({ ...GATORADE, slot: 'gatorade' });
    const fixedTotals = sum(fixed);

    const meals = (o.meals || []).filter(m => !m.error && !bannedReason(m, o.extraBans) && !excluded.has(norm(m.name)));
    const snacks = SNACKS.filter(s => !bannedReason(s.name, o.extraBans) && !o.unavailableSnacks.map(norm).includes(norm(s.name)) && !excluded.has(norm(s.name)));
    const lockM = o.lockMeals.map(norm), lockS = o.lockSnacks.map(norm);

    const combos = [];
    for (let i = 0; i < meals.length; i++) for (let j = i + 1; j < meals.length; j++) {
      const pair = [meals[i], meals[j]];
      if (!lockM.every(l => pair.some(m => norm(m.name) === l))) continue;
      const [m1, m2] = orderMeals(meals[i], meals[j]);
      for (let a = 0; a < snacks.length; a++) for (let b = a + 1; b < snacks.length; b++) {
        const sp = [snacks[a], snacks[b]];
        if (!lockS.every(l => sp.some(s => norm(s.name) === l))) continue;
        const totals = sum([fixedTotals, m1, m2, ...sp]);
        combos.push({ meal1: m1, meal2: m2, snacks: snackTiming(sp, m1, o), totals, score: score(m1, m2, sp, totals, o) });
      }
    }
    combos.sort((x, y) => x.score - y.score);

    // Alternatives: best combo per distinct meal pair first, so the list isn't five snack swaps.
    const seen = new Set(), options = [];
    for (const c of combos) {
      const k = c.meal1.name + '|' + c.meal2.name;
      if (seen.has(k)) continue;
      seen.add(k); options.push(c);
      if (options.length >= o.top) break;
    }
    if (options.length < o.top) for (const c of combos) {
      if (options.length >= o.top) break;
      if (!options.includes(c)) options.push(c);
    }
    options.forEach(c => { c.check = evaluate(c); });

    return { fixed, fixedTotals, options, mealCount: meals.length, snackCount: snacks.length, labels: slotLabels(o.dayType) };
  }

  // How well a plan fits, plus warnings to show.
  function evaluate(c) {
    const t = c.totals, notes = [];
    const dk = Math.round(t.kcal - TARGETS.kcal);
    const kcalOk = Math.abs(dk) <= 100;
    const proteinOk = t.p >= TARGETS.proteinMin;
    if (!kcalOk) notes.push(`${Math.abs(dk)} kcal ${dk > 0 ? 'over' : 'under'} 2,000`);
    if (!proteinOk) notes.push(`${Math.round(TARGETS.proteinMin - t.p)} g protein short of 160 g (snacks can't close this; flag it rather than assume a shake)`);
    if (outside(t.f, TARGETS.fat)) notes.push(`fat ${Math.round(t.f)} g is outside 55–70 g`);
    if (outside(t.c, TARGETS.carbs) > 15) notes.push(`carbs ${Math.round(t.c)} g are outside 180–220 g`);
    for (const m of [c.meal1, c.meal2]) if (m.needsCheck) notes.push(`check the numbers for ${m.name} (the Menu Reader flagged them)`);
    if (c.meal1.kcal >= 700) notes.push('Meal 1 is 700+ kcal, so the sweet moves to the evening');
    const fits = kcalOk && proteinOk;
    let verdict;
    if (fits && !notes.length) verdict = `On target: ${fmt(t.kcal)} kcal and ${Math.round(t.p)} g protein.`;
    else if (fits) verdict = `Good fit (${fmt(t.kcal)} kcal, ${Math.round(t.p)} g protein); note: ${notes.join('; ')}.`;
    else verdict = `Closest option from today's menu; misses by ${notes.join('; ')}.`;
    return { fits, notes, verdict };
  }

  const r = n => Math.round(n);
  const fmt = n => r(n).toLocaleString('en-US');

  // Section 14 reply format.
  function formatPlan(plan, fixed, opts) {
    const o = Object.assign({ date: '', dayType: 'training' }, opts);
    const L = slotLabels(o.dayType);
    const lines = [`### ${o.date} — My Meals`];
    const eggs = fixed.find(x => x.slot === 'breakfast');
    if (eggs) lines.push(`**Breakfast (8 am):** ${eggs.name} — ~${eggs.kcal} kcal | ${eggs.p} g protein (estimate)`);
    lines.push(`**Meal 1 (${L.meal1}):** ${plan.meal1.name} — ${r(plan.meal1.kcal)} kcal | ${r(plan.meal1.p)} g protein`);
    lines.push(`**Meal 2 (${L.meal2}):** ${plan.meal2.name} — ${r(plan.meal2.kcal)} kcal | ${r(plan.meal2.p)} g protein`);
    plan.snacks.forEach((s, i) => lines.push(`**Snack ${i + 1} (with Meal ${s.with === 'meal1' ? 1 : 2}):** ${s.name} — ${s.kcal} kcal | ${s.p} g protein`));
    if (fixed.some(x => x.slot === 'adonis')) lines.push(`**Adonis Cookie Dough:** 192 kcal | 22 g protein`);
    if (fixed.some(x => x.slot === 'gatorade')) lines.push(`**Gatorade 1 L (training days):** ~240 kcal | 0 g protein`);
    const t = plan.totals;
    lines.push(`**TOTAL: ${fmt(t.kcal)} kcal | ${r(t.p)} g protein | ${r(t.c)} g carbs | ${r(t.f)} g fat**`);
    lines.push(`**Verdict:** ${plan.check.verdict}`);
    return lines.join('\n');
  }

  /*
   * Convert a chosen plan into the main app's days/{date}.food items
   * ({id, name, slot, kcal, p, c, f, eaten, est}). Planned only: eaten stays false.
   */
  function toFoodItems(plan, fixed) {
    const items = [];
    const add = (x, slot) => items.push({
      id: slot + ':' + norm(x.name).replace(/[^a-z0-9]+/g, '-'),
      name: x.name, slot, kcal: x.kcal, p: x.p, c: x.c, f: x.f, eaten: false, est: !!x.estimate,
    });
    (fixed || []).filter(x => x.slot === 'breakfast').forEach(x => add(x, 'breakfast'));
    add(plan.meal1, 'meal1');
    add(plan.meal2, 'meal2');
    plan.snacks.forEach((s, i) => add(s, 'snack' + (i + 1)));
    (fixed || []).filter(x => x.slot !== 'breakfast').forEach(x => add(x, x.slot));
    return items;
  }

  return { toFoodItems, TARGETS, SNACKS, ADONIS, GATORADE, SATURDAY_EGGS, NEVER, bannedReason, likeOf, parseMenu, pick, formatPlan, slotLabels };
});

</script>
<script>
/* Weekly progress report for the Aziz Cut Tracker ("Check progress").
 * Plain JS, no imports, no network. Reads the app's own collections:
 *   docs = { days: {date: {food:[{kcal,p,eaten,...}]}}, weights: {date: {kg}}, workouts: {date: {session, sets:{name:[{w,r}]}}} }
 * API:
 *   WeeklyReport.css                         -> string, inject once (uses the app's tokens)
 *   WeeklyReport.build(docs, {week, today})  -> report object (numbers + verdict lines)
 *   WeeklyReport.html(docs, {week, today})   -> HTML string for the Progress tab
 *   WeeklyReport.summary(docs, {week, today})-> plain-text summary to paste into a chat
 *   WeeklyReport.weekOf(isoDate)             -> week index (0 = Oct 25–31, 2026)
 * Week navigation buttons carry data-wr-week="<n>"; the host handles the click and re-renders.
 * Calories and protein count only food marked eaten (planned food is not counted).
 */
const WeeklyReport = (() => {
  const START = "2026-10-25", START_KG = 91.9, GOAL = 80;
  const KCAL = 2000, KCAL_LO = 1850, KCAL_HI = 2150, PRO = 160, REVIEW = "2026-11-07";
  // [app exercise name, short label, unit, baseline weight, baseline reps]
  const LIFTS = [
    ["Bench Press (Barbell)", "Bench Press", "kg", 90, 8],
    ["Incline DB Press", "Incline DB Press", "lb", 65, 10],
    ["Gundam (Chest Machine)", "Gundam", "kg", 60, 8],
    ["Seated DB Overhead Press", "DB Overhead Press", "lb", 60, 8],
    ["Lat Pulldown, Wide", "Wide Pulldown", "kg", 80, 8],
    ["Seated Row (Cable)", "Seated Row", "kg", 95, 8],
    ["T-Bar Row", "T-Bar Row", "kg", 50, 8],
    ["Hack Squat", "Hack Squat", "kg", 70, 8],
    ["Leg Extension", "Leg Extension", "kg", 122, 8],
    ["Lying Leg Curl", "Lying Leg Curl", "kg", 63, 8],
  ];
  const DAY = 864e5, WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  const ms = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const add = (s, n) => iso(ms(s) + n * DAY);
  const wday = s => new Date(ms(s)).getUTCDay();
  const short = s => { const d = new Date(ms(s)); return MON[d.getUTCMonth()] + " " + d.getUTCDate(); };
  const longDate = t => { const d = new Date(t); return MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear(); };
  const weekOf = s => Math.floor((ms(s) - ms(START)) / (7 * DAY));
  const localToday = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const num = v => { const n = typeof v === "string" && v.trim() !== "" ? Number(v) : v; return typeof n === "number" && isFinite(n) ? n : null; };
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
  const fint = n => Math.round(n).toLocaleString("en-US");
  const sgn = (n, d = 1) => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toFixed(d);
  const e1rm = (w, r) => w * (1 + Math.min(r, 30) / 30);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- adapters from the app's collections ----------
  function dayRow(docs, date) {
    const w = docs.weights && docs.weights[date];
    const food = ((docs.days && docs.days[date] && docs.days[date].food) || []).filter(i => i && i.eaten);
    const wk = docs.workouts && docs.workouts[date];
    const type = wday(date) === 5 ? "free" : wk && wk.session === "Rest" ? "rest" : "training";
    return {
      date, type,
      weight: w ? num(w.kg) : null,
      kcal: food.length ? food.reduce((s, i) => s + (num(i.kcal) || 0), 0) : null,
      protein: food.length ? food.reduce((s, i) => s + (num(i.p) || 0), 0) : null,
      est: food.some(i => i.est),
    };
  }

  function sessions(docs, name, uptoIso) {
    const [, , , bw, br] = LIFTS.find(l => l[0] === name);
    const out = [{ date: "baseline", w: bw, r: br, e: e1rm(bw, br) }];
    Object.values(docs.workouts || {}).filter(x => x && x.date && x.date <= uptoIso && x.sets && x.sets[name])
      .sort((a, b) => a.date < b.date ? -1 : 1)
      .forEach(x => {
        let best = null;
        x.sets[name].forEach(s => { const w = num(s.w), r = num(s.r); if (w && r) { const e = e1rm(w, r); if (!best || e > best.e) best = { date: x.date, w, r, e }; } });
        if (best) out.push(best);
      });
    return out;
  }

  // A drop = estimated max more than 1% below the session before.
  function liftStatus(s) {
    const n = s.length, D = 0.99;
    if (n < 2) return { cls: "none", label: "Not logged", level: 0 };
    if (n >= 3 && s[n - 1].e < s[n - 2].e * D && s[n - 2].e < s[n - 3].e * D) return { cls: "bad", label: "Down 2 in a row", level: 3 };
    if (s[n - 1].e < s[n - 2].e * D) return { cls: "warn", label: "Down", level: 2 };
    if (s[n - 1].e > s[0].e * 1.01) return { cls: "good", label: "Up", level: 1 };
    return { cls: "good", label: "Holding", level: 1 };
  }

  function weekStats(docs, w) {
    const dates = Array.from({ length: 7 }, (_, i) => add(START, w * 7 + i));
    const rows = dates.map(d => dayRow(docs, d));
    const ws = rows.filter(r => r.weight != null).map(r => r.weight);
    const k = rows.filter(r => r.kcal != null), tgt = k.filter(r => r.type !== "free"), pr = rows.filter(r => r.protein != null);
    return {
      w, dates, rows, weighIns: ws.length,
      avg: ws.length ? mean(ws) : null, min: ws.length ? Math.min(...ws) : null, max: ws.length ? Math.max(...ws) : null,
      kcalDays: k.length, kcalAvg: k.length ? mean(k.map(r => r.kcal)) : null,
      targetDays: tgt.length, onTarget: tgt.filter(r => r.kcal >= KCAL_LO && r.kcal <= KCAL_HI).length,
      over: tgt.filter(r => r.kcal > KCAL_HI).length, tooLow: tgt.filter(r => r.kcal < 1700).length,
      freeKcal: k.filter(r => r.type === "free").map(r => r.kcal),
      proDays: pr.length, proHit: pr.filter(r => r.protein >= PRO).length, proAvg: pr.length ? mean(pr.map(r => r.protein)) : null,
    };
  }

  function lastWeek(docs, today) {
    let last = Math.max(0, weekOf(today));
    for (const c of ["weights", "days", "workouts"]) for (const d of Object.keys(docs[c] || {})) if (d >= START) last = Math.max(last, weekOf(d));
    return last;
  }

  function rateVerdict(rate, w) {
    const loss = -rate.pct;
    if (loss > 1) return w === 0
      ? ["neutral", "Fast (expected)", "Faster than 1% a week, which is normal in week 1 from water and glycogen."]
      : ["warn", "Faster than plan", "Losing more than 1% of body weight a week. Fine for a week, but watch strength and hunger."];
    if (loss >= 0.5) return ["good", "On pace", "Inside the 0.5–1% a week target."];
    if (loss > 0) return ["warn", "Slower than plan", "Under 0.5% a week. One slow week is normal; look at the 2-week trend."];
    return ["bad", "Not dropping", "The average did not go down. Check water, salt and logged calories before changing anything."];
  }

  function build(docs, opts = {}) {
    docs = docs || {};
    const today = opts.today || localToday();
    const lastW = lastWeek(docs, today);
    const weeks = [];
    for (let i = 0; i <= lastW; i++) weeks.push(weekStats(docs, i));
    weeks.forEach((s, i) => {
      s.prevAvg = i === 0 ? START_KG : weeks[i - 1].avg;
      s.prevLabel = i === 0 ? "start weigh-in" : "last week's average";
      s.rate = s.avg != null && s.prevAvg != null ? { ch: s.avg - s.prevAvg, pct: (s.avg - s.prevAvg) / s.prevAvg * 100 } : null;
    });
    const week = Math.min(Math.max(0, opts.week ?? Math.min(Math.max(0, weekOf(today)), lastW)), lastW);
    const s = weeks[week], end = s.dates[6];

    const lifts = LIFTS.map(([name, label, unit]) => {
      const ss = sessions(docs, name, end);
      const inWeek = ss.filter(x => x.date !== "baseline" && x.date >= s.dates[0]);
      const best = inWeek.length ? inWeek.reduce((a, b) => b.e > a.e ? b : a) : null;
      return { name, label, unit, base: ss[0], best, vsBase: best ? (best.e / ss[0].e - 1) * 100 : null, status: liftStatus(ss) };
    });

    // Road to 80 kg: latest weekly average up to this week
    let cur = null, curWeek = null;
    for (let i = week; i >= 0; i--) if (weeks[i].avg != null) { cur = weeks[i].avg; curWeek = i; break; }
    let road = null;
    if (cur != null) {
      const left = Math.max(0, cur - GOAL), lost = START_KG - cur, endMs = ms(end);
      const withAvg = weeks.slice(0, week + 1).filter(x => x.avg != null);
      let pace;
      if (withAvg.length >= 2) {
        const a = withAvg[0], b = withAvg[withAvg.length - 1], per = (a.avg - b.avg) / (b.w - a.w);
        pace = per > 0.05
          ? "At your pace of " + f1(per) + " kg a week (week " + (a.w + 1) + " to week " + (b.w + 1) + " averages), about " + Math.ceil(left / per) + " more weeks: around " + longDate(endMs + left / per * 7 * DAY) + "."
          : "Your weekly averages are flat so far, so there is no finish date to estimate yet.";
      } else {
        pace = "At the planned 0.5–0.8 kg a week, about " + Math.ceil(left / 0.8) + "–" + Math.ceil(left / 0.5) + " more weeks: between " + longDate(endMs + left / 0.8 * 7 * DAY) + " and " + longDate(endMs + left / 0.5 * 7 * DAY) + ". Your own pace shows after 2 weekly averages.";
      }
      road = { cur, curWeek, lost, left, pct: Math.max(0, Math.min(100, lost / (START_KG - GOAL) * 100)), pace };
    }

    // Verdict lines: [cls, label, text]
    const v = [];
    if (!s.weighIns) v.push(["none", "No weigh-ins", "No morning weights logged this week yet."]);
    else {
      const avgText = "Average " + f1(s.avg) + " kg, " + sgn(s.rate.ch) + " kg (" + sgn(s.rate.pct, 2) + "%) vs " + s.prevLabel + ". ";
      if (s.weighIns < 4) v.push(["neutral", "Too early", avgText + "Only " + s.weighIns + " of 7 weigh-ins so far. The pace verdict shows from 4 weigh-ins."]);
      else { const [c, l, t] = rateVerdict(s.rate, week); v.push([c, l, avgText + t]); }
    }
    if (s.targetDays) {
      let t = s.onTarget + " of " + s.targetDays + " logged days on target (1,850–2,150 kcal eaten).";
      if (s.over) t += " " + s.over + " over.";
      if (s.tooLow) t += " " + s.tooLow + " under 1,700, which the plan says to avoid.";
      v.push([s.onTarget >= s.targetDays * 0.7 ? "good" : "warn", "Calories", t]);
    } else v.push(["none", "Calories", "No eaten food ticked this week yet."]);
    if (s.proDays) v.push([s.proHit >= s.proDays * 0.7 ? "good" : "warn", "Protein", "Hit 160 g on " + s.proHit + " of " + s.proDays + " logged days (average " + fint(s.proAvg) + " g)."]);
    const two = lifts.filter(l => l.status.level === 3), one = lifts.filter(l => l.status.level === 2), logged = lifts.filter(l => l.status.level > 0);
    if (two.length) v.push(["bad", "Strength", two.map(l => l.label).join(", ") + " dropped 2 sessions in a row. Check sleep, pre-workout food and volume before touching calories."]);
    else if (one.length) v.push(["warn", "Strength", one.map(l => l.label).join(", ") + " dipped last session. One dip is normal on a cut; act only if it drops again."]);
    else if (logged.length) v.push(["good", "Strength", "All " + logged.length + " logged main lifts are holding or up."]);
    if (end < REVIEW) v.push(["neutral", "Plan", "Keep 2,000 kcal. The calorie review comes after Nov 7, based on the 2-week average."]);
    else if (end === REVIEW) {
      const a = weeks[0].avg, b = weeks[1] && weeks[1].avg;
      let t = "Log both weeks to get the review.";
      if (a != null && b != null) {
        const p = (b - a) / a * 100;
        t = "Week 2 average is " + sgn(p, 2) + "% vs week 1, " + (-p > 1 ? "faster than target. Keep 2,000 kcal; don't go lower." : -p >= 0.5 ? "inside target. Keep 2,000 kcal." : "slower than target. Worth a calorie review.");
      }
      v.push(["neutral", "Review", "14-day tracking ends this week. " + t]);
    }
    return { week, lastWeek: lastW, weeks, s, lifts, road, verdict: v };
  }

  // ---------- rendering ----------
  const pill = (c, t) => '<span class="wr-pill ' + c + '">' + esc(t) + '</span>';
  const stat = (lab, v, sub) => '<div class="wr-stat"><span class="label">' + lab + '</span><span class="v">' + v + '</span><span class="wr-sub">' + sub + '</span></div>';

  function weightSvg(s) {
    const vals = s.rows.filter(r => r.weight != null).map(r => r.weight);
    if (!vals.length) return '<p class="muted wr-empty">No weigh-ins this week. Log one on the Today tab.</p>';
    const refs = [s.avg, s.prevAvg].filter(x => x != null);
    let lo = Math.floor((Math.min(...vals, ...refs) - 0.3) * 2) / 2, hi = Math.ceil((Math.max(...vals, ...refs) + 0.3) * 2) / 2;
    if (hi - lo < 1.5) { const m = (hi + lo) / 2; lo = Math.floor((m - 0.75) * 2) / 2; hi = lo + 1.5; }
    const W = 480, H = 230, L = 40, R = 92, T = 12, B = 30;
    const x = i => L + (W - L - R) * (i + 0.5) / 7, y = v => T + (H - T - B) * (hi - v) / (hi - lo);
    let g = "";
    const step = hi - lo > 3 ? 1 : 0.5;
    for (let v = lo; v <= hi + 1e-9; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v.toFixed(1) + '</text>';
    s.rows.forEach((r, i) => { g += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + WD[wday(r.date)] + " " + new Date(ms(r.date)).getUTCDate() + '</text>'; });
    const labs = [];
    if (s.prevAvg != null) labs.push({ v: s.prevAvg, t: (s.w === 0 ? "Start " : "Last wk ") + f1(s.prevAvg), dash: true });
    if (s.avg != null) labs.push({ v: s.avg, t: "Avg " + f1(s.avg) });
    if (labs.length === 2 && Math.abs(y(labs[0].v) - y(labs[1].v)) < 14) { const up = labs[0].v > labs[1].v ? 0 : 1; labs[up].off = -7; labs[1 - up].off = 7; }
    labs.forEach(l => {
      g += '<line x1="' + L + '" x2="' + (W - R + 6) + '" y1="' + y(l.v) + '" y2="' + y(l.v) + '" stroke="' + (l.dash ? "var(--muted)" : "var(--accent)") + '" stroke-width="1.5"' + (l.dash ? ' stroke-dasharray="5 4"' : "") + '/>';
      g += '<text class="lab" x="' + (W - R + 10) + '" y="' + (y(l.v) + 4 + (l.off || 0)) + '">' + l.t + '</text>';
    });
    let p = "", on = false;
    s.rows.forEach((r, i) => { if (r.weight == null) { on = false; return; } p += (on ? "L" : "M") + x(i).toFixed(1) + " " + y(r.weight).toFixed(1); on = true; });
    g += '<path d="' + p + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
    s.rows.forEach((r, i) => { if (r.weight != null) g += '<circle cx="' + x(i) + '" cy="' + y(r.weight) + '" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"><title>' + WD[wday(r.date)] + " " + short(r.date) + ": " + f1(r.weight) + ' kg</title></circle>'; });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Morning weights this week with the weekly average">' + g + '</svg>';
  }

  function kcalSvg(s) {
    const vals = s.rows.map(r => r.kcal).filter(v => v != null);
    const hi = Math.max(2500, Math.ceil((Math.max(0, ...vals) + 100) / 500) * 500);
    const W = 480, H = 210, L = 44, R = 6, T = 12, B = 30;
    const x = i => L + (W - L - R) * (i + 0.5) / 7, y = v => T + (H - T - B) * (hi - v) / hi;
    const bw = Math.min(44, (W - L - R) / 7 * 0.55);
    let g = '<defs><pattern id="wr-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--muted)" stroke-width="2.5"/></pattern></defs>';
    g += '<rect x="' + L + '" y="' + y(KCAL_HI) + '" width="' + (W - L - R) + '" height="' + (y(KCAL_LO) - y(KCAL_HI)) + '" fill="var(--sunk)"/>';
    for (let v = 0; v <= hi; v += 500) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fint(v) + '</text>';
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(KCAL) + '" y2="' + y(KCAL) + '" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    g += '<text class="lab" x="' + (W - R - 4) + '" y="' + (y(KCAL_HI) - 5) + '" text-anchor="end">Target 2,000</text>';
    s.rows.forEach((r, i) => {
      g += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + WD[wday(r.date)] + (r.type === "free" ? "*" : "") + '</text>';
      if (r.kcal == null) { g += '<text x="' + x(i) + '" y="' + (y(0) - 6) + '" text-anchor="middle">—</text>'; return; }
      const h = Math.max(2, y(0) - y(r.kcal)), rx = Math.min(4, h / 2), x0 = x(i) - bw / 2, x1 = x(i) + bw / 2, top = y(0) - h;
      const fill = r.type === "free" ? "url(#wr-hatch)" : r.kcal > KCAL_HI || r.kcal < 1700 ? "var(--warn)" : "var(--accent)";
      g += '<path d="M' + x0 + ' ' + y(0) + 'V' + (top + rx) + 'Q' + x0 + ' ' + top + ' ' + (x0 + rx) + ' ' + top + 'H' + (x1 - rx) + 'Q' + x1 + ' ' + top + ' ' + x1 + ' ' + (top + rx) + 'V' + y(0) + 'Z" fill="' + fill + '"' + (r.type === "free" ? ' stroke="var(--muted)"' : "") + '><title>' + WD[wday(r.date)] + " " + short(r.date) + ": " + fint(r.kcal) + " kcal" + (r.protein != null ? ", " + fint(r.protein) + " g protein" : "") + (r.est ? " (includes estimates)" : "") + '</title></path>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Calories eaten each day against the 2,000 kcal target">' + g + '</svg>';
  }

  function html(docs, opts) {
    const R = build(docs, opts), s = R.s, road = R.road;
    const nav = '<div class="wr-nav"><button class="iconbtn" data-wr-week="' + (R.week - 1) + '" aria-label="Previous week"' + (R.week === 0 ? " disabled" : "") + '>‹</button>' +
      '<div><span class="label">Week ' + (R.week + 1) + '</span><b>' + short(s.dates[0]) + " – " + short(s.dates[6]) + '</b></div>' +
      '<button class="iconbtn" data-wr-week="' + (R.week + 1) + '" aria-label="Next week"' + (R.week >= R.lastWeek ? " disabled" : "") + '>›</button></div>';
    const verdict = '<ul class="wr-verdict">' + R.verdict.map(([c, l, t]) => '<li>' + pill(c, l) + '<span>' + esc(t) + '</span></li>').join("") + '</ul>';
    const weight = '<div class="wr-stats">' +
      stat("7-day average", s.avg != null ? f1(s.avg) + ' <small>kg</small>' : "—", s.weighIns + " of 7 weigh-ins") +
      stat("Change", s.rate ? sgn(s.rate.ch) + ' <small>kg</small>' : "—", s.rate ? sgn(s.rate.pct, 2) + "% vs " + s.prevLabel : "vs " + s.prevLabel) +
      stat("Range", s.min != null ? f1(s.min) + "–" + f1(s.max) : "—", "lowest to highest") + '</div><div class="wr-chart">' + weightSvg(s) + '</div>';
    const tick = v => (START_KG - v) / (START_KG - GOAL) * 100;
    const roadHtml = road
      ? '<div class="wr-stats">' + stat("Lost", f1(road.lost) + ' <small>kg</small>', Math.round(road.pct) + "% of 11.9 kg") + stat("To go", f1(road.left) + ' <small>kg</small>', "from the week " + (road.curWeek + 1) + " average") + stat("Now", f1(road.cur) + ' <small>kg</small>', "goal 80.0 kg") + '</div>' +
        '<div class="prog" role="progressbar" aria-label="Progress to 80 kg" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(road.pct) + '"><i style="width:' + road.pct + '%"></i></div>' +
        '<div class="wr-ticks"><span style="left:0">91.9 start</span><span style="left:' + tick(88) + '%">88</span><span style="left:' + tick(85) + '%">85</span><span style="left:100%">80 goal</span></div>' +
        '<p class="wr-small">' + esc(road.pace) + '</p>'
      : '<p class="muted">Log a weigh-in to see progress.</p>';
    const food = '<div class="wr-stats">' +
      stat("Average eaten", s.kcalAvg != null ? fint(s.kcalAvg) + ' <small>kcal</small>' : "—", s.kcalDays + " of 7 days logged") +
      stat("On target", s.targetDays ? s.onTarget + '<small> / ' + s.targetDays + '</small>' : "—", "1,850–2,150, free day excluded") +
      stat("Protein ≥ 160 g", s.proDays ? s.proHit + '<small> / ' + s.proDays + '</small>' : "—", s.proAvg != null ? "average " + fint(s.proAvg) + " g" : "nothing logged") +
      stat("Free day", s.freeKcal.length ? s.freeKcal.map(fint).join(", ") + ' <small>kcal</small>' : "—", "Friday, usually under maintenance") + '</div>' +
      '<div class="wr-chart">' + kcalSvg(s) + '</div>' +
      '<div class="wr-pro">' + s.rows.map(r => '<div class="' + (r.protein == null ? "" : r.protein >= PRO ? "ok" : "low") + '"><span>' + WD[wday(r.date)] + '</span><b class="num">' + (r.protein == null ? "—" : fint(r.protein)) + '</b></div>').join("") + '</div>' +
      '<p class="wr-small muted">* Friday free day, not counted against the target. Protein by day in grams. Counts only food ticked as eaten.</p>';
    const set = (l, x) => x.w + " " + l.unit + " × " + x.r;
    const lifts = '<div class="tablewrap"><table><thead><tr><th>Lift</th><th>Baseline</th><th>Best this week</th><th class="n">vs baseline</th><th>Trend</th></tr></thead><tbody>' +
      R.lifts.map(l => '<tr><td>' + esc(l.label) + '</td><td class="num">' + set(l, l.base) + '</td><td class="num">' + (l.best ? set(l, l.best) + ' <span class="muted">' + short(l.best.date) + '</span>' : '<span class="muted">—</span>') + '</td><td class="n">' + (l.vsBase == null ? "—" : sgn(l.vsBase) + "%") + '</td><td>' + pill(l.status.cls, l.status.label) + '</td></tr>').join("") +
      '</tbody></table></div><p class="wr-small muted">Best set compared by estimated 1-rep max. A drop means more than 1% below the session before.</p>';
    const hist = '<div class="tablewrap"><table><thead><tr><th>Week</th><th class="n">Avg weight</th><th class="n">Change</th><th class="n">Avg kcal</th><th class="n">On target</th><th class="n">Protein ≥160</th></tr></thead><tbody>' +
      R.weeks.map(w => '<tr><td><button class="wr-link" data-wr-week="' + w.w + '">Week ' + (w.w + 1) + '</button> <span class="muted">' + short(w.dates[0]) + '</span></td><td class="n">' + (w.avg != null ? f1(w.avg) : "—") + '</td><td class="n">' + (w.rate ? sgn(w.rate.ch) + " kg" : "—") + '</td><td class="n">' + (w.kcalAvg != null ? fint(w.kcalAvg) : "—") + '</td><td class="n">' + (w.targetDays ? w.onTarget + "/" + w.targetDays : "—") + '</td><td class="n">' + (w.proDays ? w.proHit + "/" + w.proDays : "—") + '</td></tr>').join("") +
      '</tbody></table></div>';
    return '<div class="wr">' +
      '<div class="card hero"><div class="spread"><h2>Weekly report</h2>' + nav + '</div>' + verdict + '<div class="row"><button class="btn ghost small" data-wr-copy>Copy summary</button></div></div>' +
      '<section class="grid"><div class="card"><h3>Weight</h3>' + weight + '</div><div class="card"><h3>Road to 80 kg</h3>' + roadHtml + '</div></section>' +
      '<div class="card"><div class="spread"><h3>Calories and protein</h3><span class="muted wr-small">Target 2,000 kcal and 160–170 g protein</span></div>' + food + '</div>' +
      '<div class="card"><h3>Main lifts</h3>' + lifts + '</div>' +
      '<div class="card"><h3>All weeks</h3>' + hist + '</div>' +
      '</div>';
  }

  function summary(docs, opts) {
    const R = build(docs, opts), s = R.s;
    const out = ["Week " + (R.week + 1) + " (" + short(s.dates[0]) + " – " + short(s.dates[6]) + ")"];
    R.verdict.forEach(([, l, t]) => out.push("- " + l + ": " + t));
    s.rows.forEach(r => {
      const b = [r.weight != null ? f1(r.weight) + " kg" : null, r.kcal != null ? fint(r.kcal) + " kcal" : null, r.protein != null ? fint(r.protein) + " g P" : null].filter(Boolean);
      if (b.length) out.push("  " + WD[wday(r.date)] + " " + short(r.date) + ": " + b.join(", ") + (r.type === "free" ? " (free day)" : ""));
    });
    R.lifts.filter(l => l.best).forEach(l => out.push("  " + l.label + ": " + l.best.w + " " + l.unit + " × " + l.best.r + " (" + l.status.label + ")"));
    return out.join("\n");
  }

  const css = [
    ".wr{display:flex;flex-direction:column;gap:18px}",
    ".wr-nav{display:flex;align-items:center;gap:8px;text-align:center}.wr-nav b{display:block;font-family:var(--display);font-size:1.15rem}",
    ".wr-nav .iconbtn:disabled{opacity:.4;cursor:default}",
    ".wr-verdict{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}",
    ".wr-verdict li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}",
    ".wr-pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}",
    ".wr-pill.good{color:var(--good)}.wr-pill.warn{color:var(--warn)}.wr-pill.bad{color:var(--bad)}.wr-pill.neutral{color:var(--accent)}.wr-pill.none{color:var(--muted)}",
    ".wr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}",
    ".wr-stat{display:flex;flex-direction:column;gap:2px}.wr-stat .v{font-family:var(--display);font-size:1.8rem;font-weight:700;line-height:1.05}",
    ".wr-stat .v small{font-size:1rem;color:var(--muted)}.wr-sub,.wr-small{font-size:.85rem;color:var(--muted)}",
    ".wr-chart svg{display:block;width:100%;height:auto;overflow:visible}.wr-chart text{fill:var(--muted);font-family:var(--body);font-size:13px}.wr-chart .lab{fill:var(--ink);font-weight:600}",
    ".wr-empty{padding:24px 8px;text-align:center}",
    ".wr-ticks{position:relative;height:18px;font-size:.75rem;color:var(--muted)}.wr-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}",
    ".wr-ticks span:first-child{transform:none}.wr-ticks span:last-child{transform:translateX(-100%)}",
    ".wr-pro{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}",
    ".wr-pro div{border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;display:flex;flex-direction:column}",
    ".wr-pro span{font-size:.7rem;color:var(--muted)}.wr-pro .ok{border-color:var(--good)}.wr-pro .ok b{color:var(--good)}.wr-pro .low b{color:var(--warn)}",
    ".wr-link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}",
  ].join("\n");

  return { css, build, html, summary, weekOf, START, LIFTS };
})();

window.WeeklyReport=WeeklyReport;

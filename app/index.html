<script>
/*
 * Protein gap closer.
 * Pure logic, no DOM. Works as a browser global (window.ProteinGap)
 * or as a CommonJS module, so the main app can inline it as-is.
 *
 * Given today's food items (the app's days/{date}.food shape), it says how
 * much protein and kcal are left against the plan (2,000 kcal, 160-170 g
 * protein) and suggests the smallest add, in kcal, that reaches 160 g
 * protein without going over 2,000 kcal. Dislikes are never suggested.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ProteinGap = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const TARGETS = { kcal: 2000, proteinMin: 160, proteinMax: 170 };

  // Things Aziz can add on the day. `est` marks values not yet from a label.
  // `max` is how many servings one suggestion may use.
  const CATALOG = [
    { id: 'iso100', name: 'Dymatize ISO100 scoop (in water)', kcal: 120, p: 25, c: 2, f: 0.5, max: 2, est: true },
    { id: 'milk', name: 'Low-fat milk 250 ml', kcal: 115, p: 8.5, c: 12, f: 4, max: 1, est: true },
    { id: 'adonis', name: 'Adonis Protein Cookie Dough (50 g)', kcal: 192, p: 22, c: 11.4, f: 6.2, max: 1 },
    { id: 'eggs', name: '2 boiled eggs', kcal: 155, p: 13, c: 1, f: 11, max: 1, est: true },
    { id: 'seeds', name: 'Tamari Roasted Seeds (Pumpkin & Sunflower)', kcal: 167, p: 6, c: 11, f: 11, max: 1 },
    { id: 'almonds', name: 'Roasted Rosemary Almonds', kcal: 183, p: 6, c: 6, f: 15, max: 1 },
    { id: 'walnut', name: 'Herbs Roasted Walnut', kcal: 248, p: 6, c: 11, f: 20, max: 1 },
    { id: 'cookies', name: 'Chocolate Chip Cookies', kcal: 113, p: 3, c: 14, f: 5, max: 1 },
    { id: 'zaafaran', name: 'Zaafaran Cake', kcal: 105, p: 2, c: 13, f: 5, max: 1 },
    { id: 'pro-mud', name: 'Pro Mud Cake', kcal: 252, p: 4, c: 14, f: 20, max: 1 },
    { id: 'kinder', name: 'Kinder Protein Ball', kcal: 162, p: 3, c: 15, f: 10, max: 1 },
    { id: 'popcorn', name: 'Popcorn', kcal: 61, p: 7, c: 6, f: 1, max: 1 },
    { id: 'muffin', name: 'Blueberry Vanilla Muffin', kcal: 166, p: 8, c: 11, f: 10, max: 1 },
  ];

  // Never-pick entries from meal-preferences.js (snacks and rules that can hit an add).
  const DEFAULT_NEVER = [
    { list: 'never', terms: ['protein ball', 'Kinder'], except: [] },
    { list: 'never', terms: ['Popcorn'], except: [] },
    { list: 'never', terms: ['Blueberry Vanilla Muffin', 'Blueberry Muffin'], except: [] },
    { list: 'never', terms: ['tuna', 'fish', 'shrimp', 'prawn', 'salmon', 'hammour', 'seafood', 'cod', 'sea bass', 'calamari'], except: [] },
    { list: 'never', terms: ['Chicken Shawarma', 'Shawarma'], except: [] },
    { list: 'never', terms: ['sandwich', 'panini', 'sub'], except: ['French Tacos'] },
  ];

  const norm = s => String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
  const hasPhrase = (text, phrase) => {
    const p = norm(phrase);
    if (!p) return false;
    const re = new RegExp('(^| )' + p + '(e?s)?( |$)');
    return re.test(norm(text));
  };

  /*
   * True when `name` is disliked. `dislikes` are free-text strings (the app's
   * prefs/main.dislikes, matched as substrings like the app does); `never` are
   * meal-preferences entries (whole-word terms with except).
   */
  function isDisliked(name, opts) {
    const o = opts || {};
    const n = norm(name);
    if ((o.dislikes || []).some(d => norm(d) && n.includes(norm(d)))) return true;
    const never = (o.never || DEFAULT_NEVER).filter(e => !e.list || e.list === 'never');
    return never.some(e => (e.terms || []).some(t => hasPhrase(name, t)) && !(e.except || []).some(t => hasPhrase(name, t)));
  }

  const r1 = x => Math.round(x * 10) / 10;
  function sum(items) {
    return items.reduce((t, x) => {
      const k = x.servings || 1;
      t.kcal += (+x.kcal || 0) * k; t.p += (+x.p || 0) * k; t.c += (+x.c || 0) * k; t.f += (+x.f || 0) * k;
      return t;
    }, { kcal: 0, p: 0, c: 0, f: 0 });
  }

  /*
   * What is left today. basis "plan" counts every item (eaten + planned),
   * basis "eaten" counts only items ticked as eaten.
   */
  function remaining(food, opts) {
    const o = Object.assign({ basis: 'plan', targets: TARGETS }, opts);
    const items = (food || []).filter(i => i && (o.basis === 'eaten' ? i.eaten : true));
    const t = sum(items);
    return {
      basis: o.basis,
      totals: { kcal: Math.round(t.kcal), p: r1(t.p), c: r1(t.c), f: r1(t.f) },
      kcalLeft: Math.round(o.targets.kcal - t.kcal),
      proteinLeft: r1(Math.max(0, o.targets.proteinMin - t.p)),
      proteinToMax: r1(o.targets.proteinMax - t.p),
    };
  }

  // Every multiset of candidates with at most `maxItems` servings in total.
  function combos(cands, maxItems) {
    const out = [];
    const walk = (i, picked, count) => {
      if (i === cands.length) { if (picked.length) out.push(picked.slice()); return; }
      walk(i + 1, picked, count);
      for (let n = 1; n <= (cands[i].max || 1) && count + n <= maxItems; n++) {
        picked.push({ c: cands[i], n }); walk(i + 1, picked, count + n); picked.pop();
      }
    };
    walk(0, [], 0);
    return out;
  }

  function describe(combo) {
    const items = combo.map(({ c, n }) => ({ id: c.id, name: c.name, servings: n, kcal: c.kcal, p: c.p, c: c.c, f: c.f, est: !!c.est }));
    const t = sum(items);
    return { items, add: { kcal: Math.round(t.kcal), p: r1(t.p), c: r1(t.c), f: r1(t.f) }, servings: items.reduce((s, x) => s + x.servings, 0) };
  }

  /*
   * Suggest the smallest add that closes the protein gap.
   * opts: basis ("plan" | "eaten"), dislikes (strings), never (meal-preferences
   *       entries), extra (more candidates: {name,kcal,p,c,f,max?}), exclude
   *       (ids or names to skip, e.g. "adonis" when he's had his), maxItems (3),
   *       targets.
   * status: "met"      protein already at 160 g or more
   *         "closable" best closes the gap within the kcal left
   *         "partial"  nothing closes it; best is the most protein that fits
   *         "no-room"  no kcal left, or nothing fits at all
   */
  function suggest(food, opts) {
    const o = Object.assign({ basis: 'plan', maxItems: 3, targets: TARGETS, extra: [], exclude: [] }, opts);
    const left = remaining(food, o);
    const res = Object.assign({}, left, { status: 'met', best: null, alternatives: [], skipped: [] });
    if (left.proteinLeft <= 0) return res;
    if (left.kcalLeft <= 0) { res.status = 'no-room'; return res; }

    const excl = new Set(o.exclude.map(norm));
    const pool = CATALOG.concat((o.extra || []).map((x, i) => Object.assign({ id: 'extra-' + i, max: 1 }, x)));
    const cands = [];
    pool.forEach(c => {
      if (excl.has(norm(c.id)) || excl.has(norm(c.name))) return;
      if (isDisliked(c.name, o)) { res.skipped.push(c.name); return; }
      if (!(c.p > 0) || c.kcal > left.kcalLeft) return;
      cands.push(c);
    });

    const fits = combos(cands, o.maxItems).map(describe).filter(d => d.add.kcal <= left.kcalLeft);
    if (!fits.length) { res.status = 'no-room'; return res; }

    const closes = fits.filter(d => d.add.p >= left.proteinLeft - 0.05);
    let ranked;
    if (closes.length) {
      res.status = 'closable';
      // Smallest add first; then fewer servings; then less overshoot past 170 g.
      ranked = closes.sort((a, b) => a.add.kcal - b.add.kcal || a.servings - b.servings || a.add.p - b.add.p);
    } else {
      res.status = 'partial';
      ranked = fits.sort((a, b) => b.add.p - a.add.p || a.add.kcal - b.add.kcal || a.servings - b.servings);
    }
    const withAfter = d => Object.assign(d, {
      after: { kcal: left.totals.kcal + d.add.kcal, p: r1(left.totals.p + d.add.p) },
      short: r1(Math.max(0, left.proteinLeft - d.add.p)),
    });
    res.best = withAfter(ranked[0]);
    // Alternatives: different item sets, not the best plus something on top.
    const bestIds = ranked[0].items.map(x => x.id);
    for (const d of ranked.slice(1)) {
      if (res.alternatives.length >= 2) break;
      if (bestIds.every(id => d.items.some(x => x.id === id))) continue;
      res.alternatives.push(withAfter(d));
    }
    return res;
  }

  const label = it => (it.servings > 1 ? it.servings + ' × ' : '') + it.name;

  // One-line summary for a card or the copyable day text.
  function summary(res) {
    const head = `${res.proteinLeft} g protein and ${res.kcalLeft} kcal left`;
    if (res.status === 'met') return `Protein is covered (${res.totals.p} g). ${res.kcalLeft} kcal left.`;
    if (res.status === 'no-room') return `${head}. No add fits without going over 2,000 kcal.`;
    const b = res.best;
    const what = b.items.map(label).join(' + ');
    if (res.status === 'closable') return `${head}. Add ${what}: +${b.add.p} g protein, +${b.add.kcal} kcal (ends at ${b.after.p} g, ${b.after.kcal} kcal).`;
    return `${head}. Nothing closes it under 2,000 kcal; ${what} gets closest (+${b.add.p} g, still ${b.short} g short).`;
  }

  // Map a suggestion into days/{date}.food items (planned, slot "add").
  function toFoodItems(s) {
    const out = [];
    (s && s.items || []).forEach(it => {
      for (let i = 0; i < it.servings; i++) {
        out.push({ id: 'add:' + it.id + ':' + Date.now().toString(36) + i, name: it.name, slot: 'add', kcal: it.kcal, p: it.p, c: it.c, f: it.f, eaten: false, est: it.est });
      }
    });
    return out;
  }

  return { TARGETS, CATALOG, DEFAULT_NEVER, isDisliked, remaining, suggest, summary, toFoodItems };
});

<script>
/* BarcodeFood: scan a packaged food's barcode, look it up on Open Food Facts and turn it
 * into a food row for days/{date}.food[]. Plain JS, no imports. The only network call is
 * lookup(), and it goes through an injectable fetch so the app decides whether it may run.
 *
 *   BarcodeFood.clean(text)                    -> digits only ("6 281007 03" -> "628100703")
 *   BarcodeFood.isValid(code)                  -> true for an EAN-8 / UPC-A / EAN-13 / GTIN-14 with a good check digit
 *   BarcodeFood.lookup(code, {fetch, timeoutMs}) -> Promise<{status:"found"|"not_found"|"offline"|"invalid", product?, error?}>
 *   BarcodeFood.parseProduct(json, code)       -> {code, name, brand, per100:{kcal,p,c,f}, serving:{g,label}|null, missing:[...], source:"off"}
 *   BarcodeFood.toFoodItem(product, {grams, slot, eaten}) -> {name, slot, kcal, p, c, f, eaten, est, barcode, grams}
 *   BarcodeFood.canDetect()                    -> true when the browser has BarcodeDetector (Android Chrome does)
 *   BarcodeFood.detect(source)                 -> Promise<code|null>; source is an image Blob/File, <img>, <video> or ImageBitmap
 *   BarcodeFood.mount(el, opts)                -> renders the scan card; returns {destroy()}
 *     opts.onAdd(item)       required. item is a food row without id (the app adds id).
 *     opts.slots             slot names for the picker. Default ["Breakfast","Meal 1","Meal 2","Snack","Extra"].
 *     opts.slot              preselected slot. Default "Snack".
 *     opts.library           {get(code)->product|null, put(code, product)} for remembered and hand-entered products.
 *                            Default: localStorage key "barcodeFood.library". Pass a db-backed one to sync.
 *     opts.fetch             fetch to use for lookups. Default window.fetch. Pass null to skip the network.
 *
 * Numbers are rounded the way the app shows them: kcal whole, macros to 0.1 g.
 * est is true when any macro was missing from Open Food Facts or kcal had to be derived.
 */
const BarcodeFood = (() => {
  const OFF = "https://world.openfoodfacts.org/api/v2/product/";
  const FIELDS = "code,product_name,product_name_en,generic_name,brands,quantity,serving_size,serving_quantity,nutriments";
  const LS_KEY = "barcodeFood.library";
  const FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "itf"];

  const clean = t => String(t == null ? "" : t).replace(/\D+/g, "");

  function isValid(code) {
    const c = clean(code);
    if (![8, 12, 13, 14].includes(c.length)) return false;
    let sum = 0;
    for (let i = c.length - 2, w = 3; i >= 0; i--, w = w === 3 ? 1 : 3) sum += +c[i] * w;
    return (10 - (sum % 10)) % 10 === +c[c.length - 1];
  }

  const num = v => {
    if (v == null || v === "") return null;
    const n = typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
    return Number.isFinite(n) && n >= 0 ? n : null;
  };
  const r1 = n => Math.round(n * 10) / 10;

  function parseServing(p) {
    let g = num(p.serving_quantity);
    const label = (p.serving_size || "").trim();
    if (g == null && label) {
      const m = label.match(/([\d.,]+)\s*(g|ml)\b/i);
      if (m) g = num(m[1]);
    }
    return g ? { g: r1(g), label: label || `${r1(g)} g` } : null;
  }

  function parseProduct(json, code) {
    const p = (json && json.product) || {};
    const n = p.nutriments || {};
    const missing = [];
    let kcal = num(n["energy-kcal_100g"]);
    const kj = num(n["energy-kj_100g"]) ?? (n.energy_unit === "kcal" ? null : num(n.energy_100g));
    const pr = num(n.proteins_100g), c = num(n.carbohydrates_100g), f = num(n.fat_100g);
    let derived = false;
    if (kcal == null && kj != null) { kcal = kj / 4.184; derived = true; }
    if (kcal == null && pr != null && c != null && f != null) { kcal = pr * 4 + c * 4 + f * 9; derived = true; }
    if (kcal == null) missing.push("kcal");
    if (pr == null) missing.push("p");
    if (c == null) missing.push("c");
    if (f == null) missing.push("f");
    const name = (p.product_name_en || p.product_name || p.generic_name || "").trim();
    return {
      code: clean(code || p.code || json && json.code),
      name: name || "Unnamed product",
      brand: (p.brands || "").split(",")[0].trim(),
      quantity: (p.quantity || "").trim(),
      per100: { kcal: kcal == null ? 0 : Math.round(kcal), p: r1(pr || 0), c: r1(c || 0), f: r1(f || 0) },
      serving: parseServing(p),
      missing, derived,
      source: "off",
    };
  }

  async function lookup(code, opts = {}) {
    const c = clean(code);
    if (!isValid(c)) return { status: "invalid" };
    const f = "fetch" in opts ? opts.fetch : (typeof fetch === "function" ? fetch : null);
    if (!f) return { status: "offline", error: "no network" };
    const ctrl = typeof AbortController === "function" ? new AbortController() : null;
    const t = ctrl && setTimeout(() => ctrl.abort(), opts.timeoutMs || 8000);
    try {
      const res = await f(`${OFF}${c}.json?fields=${FIELDS}`, { signal: ctrl && ctrl.signal, headers: { Accept: "application/json" } });
      if (res.status === 404) return { status: "not_found" };
      if (!res.ok) return { status: "offline", error: `HTTP ${res.status}` };
      const json = await res.json();
      if (!json || json.status === 0 || !json.product) return { status: "not_found" };
      return { status: "found", product: parseProduct(json, c) };
    } catch (e) {
      return { status: "offline", error: e && e.name === "AbortError" ? "timed out" : String(e && e.message || e) };
    } finally { if (t) clearTimeout(t); }
  }

  function toFoodItem(product, opts = {}) {
    const grams = num(opts.grams) || (product.serving && product.serving.g) || 100;
    const k = grams / 100, m = product.per100;
    const label = [product.brand && !product.name.toLowerCase().includes(product.brand.toLowerCase()) ? product.brand : "", product.name]
      .filter(Boolean).join(" ");
    return {
      name: `${label} (${r1(grams)} g)`,
      slot: opts.slot || "Snack",
      kcal: Math.round(m.kcal * k), p: r1(m.p * k), c: r1(m.c * k), f: r1(m.f * k),
      eaten: !!opts.eaten,
      est: !!(product.missing && product.missing.length) || !!product.derived,
      barcode: product.code, grams: r1(grams),
    };
  }

  const canDetect = () => typeof window !== "undefined" && "BarcodeDetector" in window;

  let detector = null;
  async function detect(source) {
    if (!canDetect()) return null;
    if (!detector) {
      let formats = FORMATS;
      try { const s = await window.BarcodeDetector.getSupportedFormats(); formats = FORMATS.filter(x => s.includes(x)); } catch (_) {}
      detector = new window.BarcodeDetector(formats.length ? { formats } : undefined);
    }
    let src = source;
    if (typeof Blob !== "undefined" && source instanceof Blob) src = await createImageBitmap(source);
    const hits = await detector.detect(src);
    const good = hits.map(h => clean(h.rawValue)).find(isValid);
    return good || (hits[0] ? clean(hits[0].rawValue) : null);
  }

  function lsLibrary() {
    const read = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (_) { return {}; } };
    return {
      get: code => read()[code] || null,
      put: (code, product) => { try { const all = read(); all[code] = product; localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch (_) {} },
    };
  }

  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

  function mount(el, opts = {}) {
    if (!el || typeof opts.onAdd !== "function") throw new Error("BarcodeFood.mount needs an element and onAdd");
    const slots = opts.slots || ["Breakfast", "Meal 1", "Meal 2", "Snack", "Extra"];
    const lib = opts.library || lsLibrary();
    const fetchFn = "fetch" in opts ? opts.fetch : (typeof fetch === "function" ? fetch.bind(window) : null);
    const st = { phase: "idle", code: "", product: null, msg: "", grams: "", slot: opts.slot || "Snack", eaten: true };
    let stream = null, raf = 0, alive = true;

    function stopCam() {
      if (raf) cancelAnimationFrame(raf), raf = 0;
      if (stream) stream.getTracks().forEach(t => t.stop()), stream = null;
    }

    const slotSel = () => `<select data-bf="slot">${slots.map(s => `<option${s === st.slot ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>`;

    function view() {
      const scan = canDetect()
        ? `<div class="row bf-row">
             <button type="button" class="btn" data-bf="cam">Scan with camera</button>
             <label class="btn ghost">Photo of barcode<input type="file" accept="image/*" capture="environment" data-bf="photo" hidden></label>
           </div>`
        : `<p class="muted bf-small">This browser can't read barcodes from the camera (Chrome on Android can). Type the numbers under the barcode instead.</p>`;
      const manual = `<form class="row bf-row" data-bf="manual">
          <input type="text" inputmode="numeric" autocomplete="off" placeholder="Barcode number" value="${esc(st.code)}" data-bf="code" style="flex:1;min-width:0">
          <button class="btn ghost" type="submit">Look up</button>
        </form>`;
      let body = "";
      if (st.phase === "camera") body = `<div class="bf-cam"><video playsinline muted data-bf="video"></video><div class="bf-aim"></div></div>
          <div class="row bf-row"><span class="muted bf-small">Hold the barcode inside the box.</span><button type="button" class="btn ghost" data-bf="stop">Cancel</button></div>`;
      else if (st.phase === "loading") body = `<p class="muted">Looking up ${esc(st.code)}…</p>`;
      else if (st.phase === "found") body = foundView();
      else if (st.phase === "manualEntry") body = entryView();
      const msg = st.msg ? `<p class="${st.phase === "error" ? "note" : "muted"} bf-small">${esc(st.msg)}</p>` : "";
      el.innerHTML = `<div class="bf">${st.phase === "camera" ? "" : scan + manual}${msg}${body}</div>`;
      if (st.phase === "camera") startVideo();
    }

    function foundView() {
      const p = st.product, item = toFoodItem(p, { grams: st.grams, slot: st.slot, eaten: st.eaten });
      const serving = p.serving ? `<button type="button" class="chip" data-bf="g" data-g="${p.serving.g}">1 serving · ${esc(p.serving.label)}</button>` : "";
      return `<div class="bf-card">
          <div class="spread"><b>${esc(p.brand && !p.name.toLowerCase().includes(p.brand.toLowerCase()) ? p.brand + " · " : "")}${esc(p.name)}</b><span class="label num">${esc(p.code)}</span></div>
          <p class="muted bf-small num">Per 100 g: ${p.per100.kcal} kcal · P ${p.per100.p} · C ${p.per100.c} · F ${p.per100.f}${p.source === "off" ? " · Open Food Facts" : " · your entry"}</p>
          ${p.missing && p.missing.length ? `<p class="note bf-small">Open Food Facts is missing ${p.missing.join(", ")}; this row is marked as an estimate.</p>` : ""}
          <div class="row bf-row">${serving}<button type="button" class="chip" data-bf="g" data-g="100">100 g</button></div>
          <div class="row bf-row">
            <label class="bf-small">Grams <input type="number" inputmode="decimal" min="1" step="any" value="${esc(item.grams)}" data-bf="grams" style="width:6em"></label>
            ${slotSel()}
            <label class="bf-small"><input type="checkbox" data-bf="eaten"${st.eaten ? " checked" : ""}> Eaten</label>
          </div>
          <p class="num" data-bf="total">${totalText(item)}</p>
          <div class="row bf-row">
            <button type="button" class="btn" data-bf="add">Add to food</button>

            <button type="button" class="btn ghost" data-bf="reset">Scan another</button>
          </div>
        </div>`;
    }

    function totalText(item) { return `<b>${item.kcal} kcal</b> · P ${item.p} g · C ${item.c} g · F ${item.f} g`; }

      const p = st.product || { name: "", brand: "", per100: { kcal: "", p: "", c: "", f: "" }, serving: null };

      return `<form class="bf-card" data-bf="entry">
          <p class="bf-small">Enter it once from the label and it will fill in by itself next time you scan <span class="num">${esc(st.code)}</span>.</p>
          <input type="text" placeholder="Name, e.g. Almarai Greek yoghurt" data-bf="m-name" value="${esc(p.name)}" required>
          <p class="muted bf-small">Per 100 g from the nutrition label:</p>

    }

    async function go(code) {
      stopCam();
      const c = clean(code);
      st.code = c; st.grams = ""; st.msg = "";

      if (known) { st.product = known; st.phase = "found"; return view(); }
      st.phase = "loading"; view();
      const r = await lookup(c, { fetch: fetchFn });
      if (!alive) return;

      else if (a === "g") { st.grams = t.dataset.g; view(); }
      else if (a === "edit") { st.phase = "manualEntry"; st.msg = ""; view(); }
      else if (a === "add") {
        const item = toFoodItem(st.product, { grams: st.grams, slot: st.slot, eaten: st.eaten });

        st.msg = "Reading the photo…"; st.phase = "idle"; view();

      }
    }

      const t = e.target, a = t.dataset && t.dataset.bf; if (!a) return;
      e.preventDefault();
      if (a === "manual") go(t.querySelector('[data-bf="code"]').value);

        const v = k => num(t.querySelector(`[data-bf="m-${k}"]`).value);
        const pr = v("p") || 0, c = v("c") || 0, f = v("f") || 0;
        const kcal = v("kcal") ?? (pr * 4 + c * 4 + f * 9);
        const serv = v("serv");

          code: st.code, name: t.querySelector('[data-bf="m-name"]').value.trim() || "Unnamed product",

          missing: [], derived: v("kcal") == null, source: "manual",
        };
        try { await lib.put(st.code, product); } catch (_) {}
        st.product = product; st.phase = "found"; st.msg = ""; view();
      }
    }

    function onInput(e) {
      const t = e.target;
      if (!t.dataset || t.dataset.bf !== "grams" || st.phase !== "found") return;
      st.grams = t.value;

      if (out) out.innerHTML = totalText(toFoodItem(st.product, { grams: st.grams }));

    el.addEventListener("click", onClick);
    el.addEventListener("input", onInput);
    el.addEventListener("change", onChange);
    el.addEventListener("submit", onSubmit);
    view();
    return {
      lookupCode: go,
      destroy() { alive = false; stopCam(); el.removeEventListener("click", onClick); el.removeEventListener("input", onInput); el.removeEventListener("change", onChange); el.removeEventListener("submit", onSubmit); el.innerHTML = ""; },

  const CSS = `.bf{display:flex;flex-direction:column;gap:10px}.bf-row{flex-wrap:wrap;gap:8px;align-items:center}.bf-small{font-size:.88rem}
.bf-card{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r,12px)}

.bf-aim{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}`;

})();

</script>

.pp-tile .pp-busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--surface,#fff) 70%,transparent)}
.pp-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px;font-size:.82rem;min-height:28px}
.pp-foot .pp-btn{flex:1 1 auto;white-space:nowrap;padding:4px 6px}
.pp-foot span:empty{display:none}
.pp-tile .pp-tag{bottom:6px;left:6px;font-size:.72rem}
.pp-btn{border:1px solid var(--line,#ddd);background:transparent;color:var(--ink,#111);border-radius:8px;padding:4px 9px;cursor:pointer;font:inherit;font-size:.82rem;font-weight:600}
.pp-btn.warn{border-color:var(--bad,#c33);color:var(--bad,#c33)}
.pp-btn[aria-pressed=true]{background:var(--ink,#111);color:var(--bg,#fff);border-color:var(--ink,#111)}
.pp-seg{display:inline-flex;border:1px solid var(--line,#ddd);border-radius:999px;padding:2px;gap:2px}
.pp-seg button{border:0;background:transparent;color:var(--ink,#111);border-radius:999px;padding:5px 12px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}
.pp-seg button[aria-pressed=true]{background:var(--ink,#111);color:var(--bg,#fff)}
.pp-cmp{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line,#ddd);padding-top:14px}
.pp-stage{position:relative;aspect-ratio:3/4;width:100%;max-width:440px;margin-inline:auto;border-radius:12px;overflow:hidden;background:var(--sunk,#eee);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;--x:50%}
.pp-layer{position:absolute;inset:0;overflow:hidden}
.pp-layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;transform-origin:50% 50%}
.pp-pair .pp-layer img{position:absolute}
.pp-stage .pp-before{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.pp h4{margin:4px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted,#666)}
.pp-align{display:flex;flex-direction:column;gap:10px;border:1px solid var(--ink,#111);border-radius:12px;padding:12px}
.pp-astage{cursor:move;touch-action:none}
.pp-ghost{opacity:.5}
.pp-sliders{display:grid;grid-template-columns:1fr;gap:6px;max-width:440px;width:100%;margin-inline:auto}
.pp-sliders label{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:8px;font-size:.86rem;color:var(--muted,#666)}
.pp-sliders input{accent-color:var(--accent,#111)}
.pp-btn.solid{background:var(--ink,#111);color:var(--bg,#fff);border-color:var(--ink,#111)}
.pp-btn.wide{flex:1}
.pp-tlstage{cursor:default}
.pp-tlstage .pp-layer{opacity:0;transition:opacity .35s ease}
.pp-tlstage .pp-layer.is-on{opacity:1}
.pp-ov{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:2px;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.62);color:#fff;font-family:var(--mono,ui-monospace,monospace);font-size:.82rem;pointer-events:none}
.pp-ov span:empty{display:none}
.pp-tlbar{max-width:440px;width:100%;margin-inline:auto;flex-wrap:nowrap}
.pp-tlbar .pp-range{flex:1;min-width:60px}
@media (max-width:420px){.pp-tlbar{flex-wrap:wrap}.pp-tlbar .pp-range{order:3;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.pp-tlstage .pp-layer{transition:none}}
.pp-handle{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.pp-handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);
  background-image:linear-gradient(90deg,transparent 9px,#555 9px,#555 11px,transparent 11px,transparent 23px,#555 23px,#555 25px,transparent 25px)}
.pp-tag{position:absolute;bottom:8px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.78rem;font-weight:600;pointer-events:none}
.pp-tag.l{left:8px}.pp-tag.r{right:8px}
.pp-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:560px;width:100%;margin-inline:auto}
.pp-pair figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--sunk,#eee)}
.pp-pair img{width:100%;height:100%;object-fit:cover;display:block}
.pp-range{width:100%;max-width:440px;margin-inline:auto;accent-color:var(--accent,#111)}
.pp-delta{text-align:center;font-size:.92rem;font-variant-numeric:tabular-nums}
.pp-delta b{font-family:var(--mono,ui-monospace,monospace);font-weight:500}
.pp-hist{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line,#ddd);padding-top:14px}
.pp-hrow{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line,#ddd);border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer;text-align:left;width:100%}
.pp-hrow[aria-current=true]{border-color:var(--ink,#111)}
.pp-thumbs{display:flex;gap:4px;flex:none}
.pp-thumbs span{width:30px;height:40px;border-radius:5px;background:var(--sunk,#eee);overflow:hidden;display:block}
.pp-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pp-hrow b{font-size:.92rem}
.pp-err{color:var(--bad,#c33);font-size:.86rem}
.pp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
`;
  let cssDone = false;
  function injectCss() {
    if (cssDone || typeof document === 'undefined') return;
    cssDone = true;
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  }

  // ---------- mount ----------
  function mount(root, opts) {
    opts = opts || {};
    injectCss();
    const storage = opts.storage || localDocs();
    const store = opts.assets ? assetStore(opts.assets) : idbStore();
    const today = isDate(opts.today) ? opts.today : localToday();
    const st = { docs: {}, weights: [], edit: today, pose: 'front', before: null, after: null, mode: 'slider', x: 50, busy: {}, armed: null, err: '', loaded: false,
      waists: [], align: null, draft: null, tl: { i: -1, playing: false, speed: 'normal' } };
    let alive = true, armTimer = null, tlTimer = null;
    const SPEEDS = { slow: 1500, normal: 900, fast: 450 };

    const file = document.createElement('input');
    file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
    let pickPose = null;

    async function load() {
      try {
        const list = await storage.list(COLL);
        const o = {}; (list || []).forEach(d => { if (d && isDate(d.date)) o[d.date] = d; });
        st.docs = o;
      } catch (e) { st.err = 'Could not load photos: ' + (e.message || e.code || e); }
      try { st.weights = opts.weights ? (await opts.weights.list()) || [] : []; } catch (e) { st.weights = []; }
      try { st.waists = opts.measures ? (await opts.measures.list()) || [] : []; } catch (e) { st.waists = []; }
      st.loaded = true;
      if (alive) render();
    }

    function pair() {
      const ds = datesWith(st.docs, st.pose);
      if (ds.length < 2) return null;
      let b = ds.includes(st.before) ? st.before : ds[0];
      let a = ds.includes(st.after) ? st.after : ds[ds.length - 1];
      if (a === b) { a = ds[ds.length - 1]; b = ds[0]; }
      if (a < b) [a, b] = [b, a];
      return { before: b, after: a, dates: ds };
    }

    function label(date) {
      const w = weightNear(st.weights, date);
      return short(date) + (w ? ' · ' + w.kg.toFixed(1) + ' kg' : '');
    }

    function dueLine() {
      const n = nextDue(st.docs, today);
      if (n.state === 'start') return ['Take your first set today', true];
      if (n.state === 'partial') return ['Still to take: ' + n.missing.join(', '), true];
      if (n.state === 'due') return ['Photos due' + (n.date < today ? ' since ' + withDay(n.date) : ' today'), true];
      return ['Next photos ' + withDay(n.date), false];
    }

    function img(ref, cls, alt, style) {
      const s = srcOf(ref);
      return `<img ${cls ? `class="${cls}" ` : ''}${style ? `style="${style}" ` : ''}alt="${esc(alt)}" ${s ? `src="${esc(s)}"` : `data-pp-ref="${esc(ref)}"`}>`;
    }
    // a full-frame layer whose photo carries its alignment; clipping goes on the layer so the divider stays straight
    function layer(date, cls, alt) {
      const d = st.docs[date] || {};
      return `<div class="pp-layer${cls ? ' ' + cls : ''}">${img(d[st.pose], '', alt, xform(d.align && d.align[st.pose]))}</div>`;
    }
    const refDate = pose => datesWith(st.docs, pose)[0] || null;
    const fmtKg = f => f.kg == null ? '' : f.kg.toFixed(1) + ' kg' + (f.dKg ? ' (' + sgn(f.dKg, 1) + ')' : '');
    const fmtWaist = f => f.waist == null ? '' : 'Waist ' + (Math.round(f.waist * 10) / 10) + ' cm' + (f.dWaist ? ' (' + sgn(f.dWaist, 1).replace('.0', '') + ')' : '');

    function render() {
      if (!alive) return;
      const doc = st.docs[st.edit] || {};
      const [due, isDue] = dueLine();
      const p = pair();
      const all = sets(st.docs).slice().reverse();

      const slots = POSES.map(([k, l]) => {
        const ref = doc[k], busy = st.busy[k];
        const armed = st.armed === st.edit + ':' + k;
        return `<div class="pp-slot">
          <button type="button" class="pp-tile${ref ? ' has' : ''}" data-pp-pick="${k}" aria-label="${ref ? 'Replace' : 'Add'} ${l.toLowerCase()} photo for ${esc(withDay(st.edit))}">
            ${ref ? img(ref, '', l + ' photo, ' + withDay(st.edit)) + `<span class="pp-tag l">${l}</span>` : `<span>+ ${l}</span>`}
            ${busy ? `<span class="pp-busy">Saving…</span>` : ''}
          </button>
          <div class="pp-foot">${ref && !busy ? (armed
            ? `<button type="button" class="pp-btn warn wide" data-pp-del="${k}">Tap to delete</button>`
            : (refDate(k) && refDate(k) < st.edit ? `<button type="button" class="pp-btn" data-pp-align="${k}" aria-label="Line up ${l.toLowerCase()} photo with the first one">Line up</button>` : '<span></span>')
              + `<button type="button" class="pp-btn" data-pp-del="${k}" aria-label="Delete ${l.toLowerCase()} photo">Delete</button>`) : ''}</div>
        </div>`;
      }).join('');

      let cmp;
      if (!p) {
        const n = datesWith(st.docs, st.pose).length;
        cmp = `<p class="pp-meta">${n ? 'One ' + st.pose + ' photo so far. Next week\'s photo unlocks the before/after slider.' : 'Take ' + st.pose + ' photos on two different weeks to compare them here.'}</p>`;
      } else {
        const opt = sel => p.dates.map(d => `<option value="${d}"${d === sel ? ' selected' : ''}>${esc(withDay(d))}</option>`).join('');
        const wb = weightNear(st.weights, p.before), wa = weightNear(st.weights, p.after);
        const days = Math.round((ms(p.after) - ms(p.before)) / DAY);
        const span = days >= 14 ? Math.round(days / 7) + ' weeks' : days + ' day' + (days === 1 ? '' : 's');
        const delta = wb && wa ? (wa.kg - wb.kg <= 0 ? '−' : '+') + Math.abs(wa.kg - wb.kg).toFixed(1) + ' kg over ' + span : span + ' apart';
        const view = st.mode === 'slider'
          ? `<div class="pp-stage" data-pp-stage style="--x:${st.x}%">
              ${layer(p.after, '', 'After, ' + withDay(p.after))}
              ${layer(p.before, 'pp-before', 'Before, ' + withDay(p.before))}
              <div class="pp-handle"></div>
              <span class="pp-tag l">Before · ${esc(short(p.before))}</span><span class="pp-tag r">After · ${esc(short(p.after))}</span>
            </div>
            <input class="pp-range" type="range" min="0" max="100" step="1" value="${st.x}" data-pp-range aria-label="Slide between before and after">`
          : `<div class="pp-pair">
              <figure>${layer(p.before, '', 'Before, ' + withDay(p.before))}<span class="pp-tag l">Before · ${esc(short(p.before))}</span></figure>
              <figure>${layer(p.after, '', 'After, ' + withDay(p.after))}<span class="pp-tag l">After · ${esc(short(p.after))}</span></figure>
            </div>`;
        cmp = `<div class="pp-row">
            <label>Before <select data-pp-before>${opt(p.before)}</select></label>
            <label>After <select data-pp-after>${opt(p.after)}</select></label>
            <span class="pp-seg" role="group" aria-label="View">
              <button type="button" data-pp-mode="slider" aria-pressed="${st.mode === 'slider'}">Slider</button>
              <button type="button" data-pp-mode="pair" aria-pressed="${st.mode === 'pair'}">Side by side</button>
            </span>
          </div>
          ${view}
          <p class="pp-delta">${esc(label(p.before))} → ${esc(label(p.after))}<br><b>${esc(delta)}</b></p>`;
      }

      const hasPhoto = POSES.some(([k]) => doc[k]);
      const waistRow = hasPhoto ? `<div class="pp-row"><label>Waist at the navel <input type="number" inputmode="decimal" step="0.5" min="40" max="200" data-pp-waist value="${+doc.waist > 0 ? doc.waist : ''}" placeholder="optional" style="width:6.5em"> cm</label></div>` : '';

      // line-up panel: this day's photo, half see-through, over the first photo of that pose
      let alignPanel = '';
      if (st.align && doc[st.align] && refDate(st.align) && refDate(st.align) < st.edit) {
        const k = st.align, l = POSES.find(x => x[0] === k)[1], r0 = st.docs[refDate(k)], dr = st.draft || { x: 0, y: 0, s: 1 };
        alignPanel = `<div class="pp-align">
          <h3>Line up ${l.toLowerCase()} with ${esc(withDay(refDate(k)))}</h3>
          <p class="pp-meta">Drag the photo, or use the sliders, until your body sits on the first photo's outline. Shoulders, hips and feet are the best guides.</p>
          <div class="pp-stage pp-astage" data-pp-astage>
            <div class="pp-layer">${img(r0[k], '', 'First ' + l.toLowerCase() + ' photo')}</div>
            <div class="pp-layer pp-ghost">${img(doc[k], '', 'This photo', xform(dr) || 'transform:none')}</div>
          </div>
          <div class="pp-sliders">
            <label>Size <input type="range" min="70" max="140" step="1" value="${Math.round(dr.s * 100)}" data-pp-a="s"></label>
            <label>Left / right <input type="range" min="-30" max="30" step="0.5" value="${dr.x}" data-pp-a="x"></label>
            <label>Up / down <input type="range" min="-30" max="30" step="0.5" value="${dr.y}" data-pp-a="y"></label>
          </div>
          <div class="pp-row"><button type="button" class="pp-btn solid" data-pp-asave>Save</button><button type="button" class="pp-btn" data-pp-areset>Reset</button><button type="button" class="pp-btn" data-pp-acancel>Cancel</button></div>
        </div>`;
      }

      // timelapse of every photo of the pose, aligned, with weight and waist on top
      const fr = frames(st.docs, st.pose, st.weights, st.waists);
      let tl;
      if (fr.length < 2) tl = `<p class="pp-meta">The timelapse starts once there are two weeks of ${st.pose} photos.</p>`;
      else {
        if (st.tl.i < 0 || st.tl.i >= fr.length) st.tl.i = fr.length - 1;
        const f = fr[st.tl.i];
        tl = `<div class="pp-stage pp-tlstage" data-pp-tl>
            <div class="pp-layer pp-tl-a is-on">${img(f.ref, '', st.pose + ' photo, ' + withDay(f.date), xform(f.align))}</div>
            <div class="pp-layer pp-tl-b"><img alt=""></div>
            <div class="pp-ov" aria-live="off"><b data-pp-ov="t">Week ${f.week} · ${esc(short(f.date))}</b><span data-pp-ov="k">${esc(fmtKg(f))}</span><span data-pp-ov="w">${esc(fmtWaist(f))}</span></div>
          </div>
          <div class="pp-row pp-tlbar">
            <button type="button" class="pp-btn solid" data-pp-play aria-pressed="${st.tl.playing}">${st.tl.playing ? 'Pause' : 'Play'}</button>
            <input class="pp-range" type="range" min="0" max="${fr.length - 1}" step="1" value="${st.tl.i}" data-pp-scrub aria-label="Timelapse frame">
            <span class="pp-seg" role="group" aria-label="Speed">${['slow', 'normal', 'fast'].map(k => `<button type="button" data-pp-speed="${k}" aria-pressed="${st.tl.speed === k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</span>
          </div>
          <p class="pp-meta">${fr.length} photos, ${esc(short(fr[0].date))} to ${esc(short(fr[fr.length - 1].date))}.${fr.some((x, i) => i && !x.align) ? ' Use “Line up” on a photo day to keep the body in the same place from frame to frame.' : ''}</p>`;
      }

      const hist = all.length ? `<div class="pp-hist"><h3>All photo days</h3>${all.map(d => `
          <button type="button" class="pp-hrow" data-pp-open="${d.date}" aria-current="${d.date === st.edit}">
            <span class="pp-thumbs">${POSES.map(([k, l]) => `<span>${d[k] ? img(d[k], '', l + ' ' + short(d.date)) : ''}</span>`).join('')}</span>
            <span><b>${esc(withDay(d.date))}</b><br><span class="pp-meta">${esc((() => { const w = weightNear(st.weights, d.date); const n = POSES.filter(([k]) => d[k]).length; return (w ? w.kg.toFixed(1) + ' kg · ' : '') + n + ' of 3'; })())}</span></span>
          </button>`).join('')}</div>` : '';

      root.innerHTML = `<section class="pp" aria-label="Progress photos">
        <div class="pp-head"><h2>Progress photos</h2><span class="pp-due${isDue ? ' is-due' : ''}">${esc(due)}</span></div>
        <p class="pp-sub">Once a week: same spot, same light, same time of day (morning, before food). Front, side and back.</p>
        <div class="pp-row"><label>Photos for <input type="date" data-pp-date value="${st.edit}" max="${today}"></label>${st.edit !== today ? `<button type="button" class="pp-btn" data-pp-today>Today</button>` : ''}</div>
        <div class="pp-slots">${slots}</div>
        ${waistRow}
        ${st.err ? `<p class="pp-err" role="alert">${esc(st.err)}</p>` : ''}
        ${alignPanel}
        <div class="pp-cmp">
          <div class="pp-head"><h3>Compare</h3>
            <span class="pp-seg" role="group" aria-label="Pose">${POSES.map(([k, l]) => `<button type="button" data-pp-pose="${k}" aria-pressed="${st.pose === k}">${l}</button>`).join('')}</span>
          </div>
          <h4>Before / after</h4>
          ${cmp}
          <h4>Timelapse</h4>
          ${tl}
        </div>
        ${hist}
        <p class="pp-note">${store.kind === 'assets' ? 'Private to this app: only people you share it with can see these photos.' : 'Saved in this browser only, on this device.'} Photos are shrunk and location data is removed before saving.</p>
      </section>`;
      root.appendChild(file);
      fillAsync();
      tlFront = 'a'; tlSeq++;
      if (st.tl.playing) { if (fr.length < 2) stopTl(); else if (!tlTimer) startTl(); }
    }

    // ---------- timelapse playback (touches only the stage, never re-renders) ----------
    let tlFront = 'a', tlSeq = 0;
    function showFrame(i) {
      const fr = frames(st.docs, st.pose, st.weights, st.waists), stage = root.querySelector('[data-pp-tl]');
      if (!stage || !fr.length) return;
      st.tl.i = ((i % fr.length) + fr.length) % fr.length;
      const f = fr[st.tl.i], seq = ++tlSeq;
      const back = tlFront === 'a' ? 'b' : 'a';
      const la = stage.querySelector('.pp-tl-' + tlFront), lb = stage.querySelector('.pp-tl-' + back), im = lb.querySelector('img');
      const swap = () => {
        if (seq !== tlSeq || !stage.isConnected) return;
        im.setAttribute('style', xform(f.align)); im.alt = st.pose + ' photo, ' + withDay(f.date);
        lb.classList.add('is-on'); la.classList.remove('is-on'); tlFront = back;
        stage.querySelector('[data-pp-ov="t"]').textContent = 'Week ' + f.week + ' · ' + short(f.date);
        stage.querySelector('[data-pp-ov="k"]').textContent = fmtKg(f);
        stage.querySelector('[data-pp-ov="w"]').textContent = fmtWaist(f);
        const sc = root.querySelector('[data-pp-scrub]'); if (sc) sc.value = st.tl.i;
      };
      store.src(f.ref).then(u => {
        if (seq !== tlSeq) return;
        if (!u) { swap(); return; }
        if (im.getAttribute('src') === u && im.complete) { swap(); return; }
        im.onload = swap; im.onerror = swap; im.src = u;
      });
    }
    function startTl() {
      clearInterval(tlTimer);
      let hold = 0;
      tlTimer = setInterval(() => {
        const n = frames(st.docs, st.pose, st.weights, st.waists).length;
        if (st.tl.i === n - 1 && hold < 2) { hold++; return; } // linger on the latest photo before looping
        hold = 0; showFrame(st.tl.i + 1);
      }, SPEEDS[st.tl.speed] || 900);
    }
    function stopTl() { clearInterval(tlTimer); tlTimer = null; st.tl.playing = false; }

    // ---------- line-up ----------
    function setDraft(k, v) {
      const d = st.draft || (st.draft = { x: 0, y: 0, s: 1 });
      d[k] = k === 's' ? Math.max(0.7, Math.min(1.4, v)) : Math.max(-30, Math.min(30, Math.round(v * 2) / 2));
      const g = root.querySelector('.pp-ghost img'); if (g) g.setAttribute('style', xform(d) || 'transform:none');
      root.querySelectorAll('[data-pp-a]').forEach(r => { const kk = r.getAttribute('data-pp-a'); r.value = kk === 's' ? Math.round(d.s * 100) : d[kk]; });
    }
    async function saveAlign() {
      const k = st.align, date = st.edit, d = st.draft || { x: 0, y: 0, s: 1 };
      const cur = Object.assign({}, st.docs[date]);
      const a = Object.assign({}, cur.align);
      if (!d.x && !d.y && d.s === 1) delete a[k]; else a[k] = { x: d.x, y: d.y, s: Math.round(d.s * 100) / 100 };
      cur.align = a;
      try { await storage.put(COLL, date, cur); st.docs[date] = cur; st.align = null; st.draft = null; st.err = ''; }
      catch (e) { st.err = 'Not saved: ' + ((e && (e.message || e.code)) || 'unknown error'); }
      render();
    }
    async function saveWaist(v) {
      const date = st.edit, cur = Object.assign({}, st.docs[date]);
      if (!POSES.some(([k]) => cur[k])) return;

    root.addEventListener('change', onChange);
    root.addEventListener('input', onInput);
    root.addEventListener('pointerdown', onDown);
    root.addEventListener('pointermove', onMove);
    root.addEventListener('pointerup', onUp);

<script>
/* Diet-break planner. Works for anyone; nothing about one person is built in.
 * Schedules a 1–2 week maintenance break after every 8–12 weeks of cutting and tells
 * the app which calorie target applies on any day. Plain JS, no imports, no network.
 *
 * Adaptive:
 *   - Maintenance (TDEE) comes from TrendTDEE.estimate(docs, {today}) when that module is
 *     inlined, else from logged food and the weight trend, else from the profile or body weight.
 *   - Cut calories come from the profile, else the person's own average intake, else 80% of maintenance.
 *   - Block length follows the deficit: bigger deficits get breaks sooner (8 weeks at 25%+,
 *     10 at 15–25%, 12 under 15%); break length is 2 weeks at 20%+ deficit, else 1.
 *     Tapping Sooner/Later or choosing a length overrides this.
 *   - A stall from week 8 (under 0.25% of body weight lost in 2 weeks while on target)
 *     suggests starting the break early.
 *   - With a goal weight it projects the goal date and stops planning breaks before it;
 *     without one it keeps planning breaks a few blocks ahead.
 *
 * Reads the app's own collections:
 *   docs = { days: {date: {food:[{kcal,p,eaten}]}}, weights: {date: {kg}} }
 * opts.profile (all optional): { start, startKg, goalKg, cutKcal, protein, fat, maintenance }
 *   start defaults to the first logged day; startKg to the first weigh-in.
 * state, stored by the host (suggested `prefs/main.dietBreak`), all optional, {} is fine:
 *   { blockWeeks: 8–12 | null, breakWeeks: 1 | 2 | null, auto: bool, breaks: [{start, end}] }
 *   null block/break lengths mean "adapt". auto (default true): planned breaks start on their
 *   own; auto:false: the target stays at the cut level until the user taps Start.
 *
 * API:
 *   DietBreak.css                                    -> string, inject once (uses the app's tokens)
 *   DietBreak.build(docs, state, {today, tdee, profile}) -> plan object
 *   DietBreak.target(docs, state, date, opts)        -> {mode:"cut"|"break"|"maintain", kcal, lo, hi, protein, carbs, fat}
 *   DietBreak.html(docs, state, opts)                -> HTML card
 *   DietBreak.apply(state, action, today, docs, opts)-> new state; action = "start" | "end" | "length:1" | "length:2" |
 *                                                       "length:auto" | "block:<8-12>" | "block:auto" | "auto:on" | "auto:off"
 *   DietBreak.estimateTdee(docs, today, breaks, profile) -> {kcal, source, confidence, ...}
 * Buttons carry data-db-action="<action>"; the host calls apply(), saves the state and re-renders.
 */
const DietBreak = (() => {
  const KCAL_PER_KG = 7700, MIN_BLOCK = 8, MAX_BLOCK = 12;
  const DAY = 864e5;
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const DATE = /^\d{4}-\d{2}-\d{2}$/;

  const ms = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const add = (s, n) => iso(ms(s) + n * DAY);
  const diff = (a, b) => Math.round((ms(b) - ms(a)) / DAY);
  const short = s => { const d = new Date(ms(s)); return MON[d.getUTCMonth()] + " " + d.getUTCDate(); };
  const longDate = s => short(s) + ", " + new Date(ms(s)).getUTCFullYear();
  const localToday = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const num = v => { const n = typeof v === "string" && v.trim() !== "" ? Number(v) : v; return typeof n === "number" && isFinite(n) ? n : null; };
  const pos = v => { const n = num(v); return n != null && n > 0 ? n : null; };
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const r50 = n => Math.round(n / 50) * 50;
  const r5 = n => Math.round(n / 5) * 5;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const fint = n => Math.round(n).toLocaleString("en-US");
  const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
  const kcalTxt = n => n == null ? "—" : fint(n);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- state and profile ----------
  function norm(state) {
    state = state || {};
    const b = num(state.blockWeeks), k = num(state.breakWeeks);
    const breaks = (Array.isArray(state.breaks) ? state.breaks : [])
      .filter(x => x && DATE.test(x.start))
      .map(x => ({ start: x.start, end: DATE.test(x.end || "") && x.end >= x.start ? x.end : add(x.start, 13) }))
      .sort((a, c) => a.start < c.start ? -1 : 1);
    return {
      blockWeeks: b != null ? clamp(Math.round(b), MIN_BLOCK, MAX_BLOCK) : null,
      breakWeeks: k === 1 || k === 2 ? k : null,
      breaks, auto: state.auto !== false,
    };
  }

  function firstLogged(docs) {
    let first = null;
    for (const [d, w] of Object.entries(docs.weights || {})) { const date = (w && w.date) || d; if (DATE.test(date) && num(w && w.kg) && (!first || date < first)) first = date; }
    for (const [d, x] of Object.entries(docs.days || {})) { const date = (x && x.date) || d; if (DATE.test(date) && ((x && x.food) || []).some(i => i && i.eaten) && (!first || date < first)) first = date; }
    return first;
  }

  function profileOf(docs, opts, today) {
    const P = opts.profile || {};
    const start = DATE.test(P.start || "") ? P.start : firstLogged(docs) || today;
    const first = weightSeries(docs, start, today)[0];
    return {
      start,
      startKg: pos(P.startKg) || (first ? first.kg : null),
      goalKg: pos(P.goalKg),
      cutKcal: pos(P.cutKcal), protein: pos(P.protein), fat: pos(P.fat), maintenance: pos(P.maintenance),
    };
  }

  // ---------- data ----------
  function weightSeries(docs, from, upto) {
    return Object.entries(docs.weights || {})
      .map(([d, w]) => ({ date: (w && w.date) || d, kg: pos(w && w.kg) }))
      .filter(x => x.kg != null && DATE.test(x.date) && x.date >= from && x.date <= upto)
      .sort((a, b) => a.date < b.date ? -1 : 1);
  }

  // Exponentially smoothed trend weight (10% per day, gaps carried forward).
  function trend(series) {
    const out = [];
    let t = null, prev = null;
    series.forEach(p => {
      t = t == null ? p.kg : t + (1 - Math.pow(0.9, Math.max(1, diff(prev, p.date)))) * (p.kg - t);
      out.push({ date: p.date, kg: t });
      prev = p.date;
    });
    return out;
  }

  // Least-squares slope, kg per day.
  function slope(points) {
    if (points.length < 2) return null;
    const xs = points.map(p => diff(points[0].date, p.date)), ys = points.map(p => p.kg);
    const mx = mean(xs), my = mean(ys);
    let n = 0, d = 0;
    xs.forEach((x, i) => { n += (x - mx) * (ys[i] - my); d += (x - mx) * (x - mx); });
    return d ? n / d : null;
  }

  function eatenKcal(docs, date) {
    const food = ((docs.days && docs.days[date] && docs.days[date].food) || []).filter(i => i && i.eaten);
    return food.length ? food.reduce((s, i) => s + (num(i.kcal) || 0), 0) : null;
  }

  const inAny = (breaks, d) => breaks.some(b => b.start <= d && d <= b.end);

  function intake(docs, from, to, breaks) {
    const k = [];
    for (let d = from; d <= to; d = add(d, 1)) if (!inAny(breaks, d)) { const x = eatenKcal(docs, d); if (x != null && x > 0) k.push(x); }
    return k;
  }

  // TDEE from the last 28 days: average eaten kcal minus the trend change in stored energy.
  // Break days and the first cut week (water and glycogen) are left out.
  function estimateTdee(docs, today, breaks, profile) {
    docs = docs || {};
    today = today || localToday();
    breaks = breaks || [];
    const prof = profile && profile.start ? profile : profileOf(docs, { profile }, today);
    const from = add(today, -27) < add(prof.start, 7) ? add(prof.start, 7) : add(today, -27);
    const all = weightSeries(docs, prof.start, today);
    const series = all.filter(p => p.date >= from && !inAny(breaks, p.date));
    const tr = trend(all).filter(p => p.date >= from && !inAny(breaks, p.date));
    const kcals = intake(docs, from, today, breaks);
    const span = series.length ? diff(series[0].date, series[series.length - 1].date) : 0;
    if (series.length >= 10 && kcals.length >= 10 && span >= 13) {
      const sl = slope(tr), kcal = r50(mean(kcals) - sl * KCAL_PER_KG);
      if (kcal >= 1200 && kcal <= 5000) return { kcal, source: "estimate", confidence: span >= 24 && kcals.length >= 20 ? "high" : "medium", days: span + 1, ratePerWeek: sl * 7 };
    }
    if (prof.maintenance) return { kcal: r50(prof.maintenance), source: "profile", confidence: "low", days: span ? span + 1 : 0 };
    // Rough starting point from body weight (~30 kcal per kg for an active adult).
    const kg = all.length ? all[all.length - 1].kg : prof.startKg;
    if (kg) return { kcal: r50(kg * 30), source: "bodyweight", confidence: "low", days: span ? span + 1 : 0 };
    return { kcal: null, source: "none", confidence: "low", days: 0 };
  }

  // opts.tdee: a number, {kcal, lo, hi} (TrendTDEE shape) or {kcal, confidence}. Left out,
  // TrendTDEE is used when it is inlined in the app, then the fallback estimator.
  function readTdee(opt, docs, today, breaks, prof) {
    if (opt === undefined && typeof TrendTDEE !== "undefined" && TrendTDEE.estimate) {
      try { const E = TrendTDEE.estimate(docs, { today }); if (E && E.ready) opt = { kcal: E.tdee, lo: E.tdeeLo, hi: E.tdeeHi }; } catch (e) { /* fall through */ }
    }
    if (opt != null) {
      const o = typeof opt === "object" ? opt : { kcal: opt };
      const kcal = num(o.kcal);
      if (kcal && kcal >= 1200 && kcal <= 5000) {
        const w = num(o.hi) != null && num(o.lo) != null ? (num(o.hi) - num(o.lo)) / 2 : null;
        return { kcal: r50(kcal), source: o.source || "trend", confidence: o.confidence || (w == null ? "medium" : w <= 150 ? "high" : w <= 350 ? "medium" : "low") };
      }
    }
    return estimateTdee(docs, today, breaks, prof);
  }

  // ---------- plan ----------
  // Cut blocks of blockWeeks, each followed by a break, honouring breaks the user recorded,
  // until the projected weight reaches the goal (or a year past today without a goal).
  function schedule(st, start, today, cutDaysLeft) {
    const phases = [], taken = st.breaks.slice(), horizon = add(today, 365);
    let cursor = start, guard = 0;
    while (guard++ < 60) {
      const next = taken.find(b => b.start >= cursor);
      // Manual mode: a planned break never starts by itself; the cut runs on until the user taps Start.
      let plannedStart = add(cursor, st.blockWeeks * 7);
      if (!st.auto && plannedStart <= today) plannedStart = add(today, 1);
      if (next && next.start <= plannedStart) {
        if (next.start > cursor) phases.push({ type: "cut", start: cursor, end: add(next.start, -1) });
        phases.push({ type: "break", start: next.start, end: next.end, taken: true });
        taken.splice(taken.indexOf(next), 1);
        cursor = add(next.end, 1);
        continue;
      }
      // Future cut days count toward the goal; past ones are already in the weight.
      const blockEnd = add(plannedStart, -1);
      const futureFrom = cursor > today ? cursor : add(today, 1);
      const futureDays = blockEnd >= futureFrom ? diff(futureFrom, blockEnd) + 1 : 0;
      if (futureDays >= cutDaysLeft && blockEnd >= today) {
        let end = add(futureFrom, Math.max(0, cutDaysLeft - 1));
        if (end < cursor) end = cursor;
        phases.push({ type: "cut", start: cursor, end, last: true });
        phases.push({ type: "maintain", start: add(end, 1) });
        break;
      }
      cutDaysLeft -= futureDays;
      phases.push({ type: "cut", start: cursor, end: blockEnd });
      const bEnd = add(plannedStart, st.breakWeeks * 7 - 1);
      phases.push({ type: "break", start: plannedStart, end: bEnd, planned: true });
      cursor = add(bEnd, 1);
      if (cursor > horizon) break;
    }
    return phases;
  }

  function macros(kcal, prof, kg) {
    const ref = prof.goalKg && kg ? Math.max(prof.goalKg, kg * 0.85) : kg;
    const protein = prof.protein || (ref ? r5(ref * 1.8) : null);
    const fat = prof.fat || (ref ? r5(ref * 0.8) : null);
    const carbs = kcal != null && protein != null && fat != null ? Math.max(0, r5((kcal - protein * 4 - fat * 9) / 4)) : null;
    return { protein, fat, carbs };
  }

  function build(docs, state, opts = {}) {
    docs = docs || {};
    const today = opts.today || localToday();
    const st = norm(state);
    const prof = profileOf(docs, opts, today);
    const tdee = readTdee(opts.tdee, docs, today, st.breaks, prof);
    const series = weightSeries(docs, prof.start, today), tr = trend(series);
    const kgNow = tr.length ? tr[tr.length - 1].kg : prof.startKg;

    // Cut calories: profile, else the person's own average over cut days, else 80% of maintenance.
    const own = intake(docs, add(today, -27) < prof.start ? prof.start : add(today, -27), today, st.breaks);
    const cutKcal = prof.cutKcal || (own.length >= 7 ? r50(mean(own)) : tdee.kcal ? r50(tdee.kcal * 0.8) : null);
    const cutSource = prof.cutKcal ? "profile" : own.length >= 7 ? "intake" : tdee.kcal ? "default" : "none";
    const deficit = tdee.kcal && cutKcal ? clamp((tdee.kcal - cutKcal) / tdee.kcal, 0, 0.5) : null;

    // Adapt block and break length to the size of the deficit unless the user chose them.
    const adaptBlock = deficit == null ? 10 : deficit >= 0.25 ? 8 : deficit >= 0.15 ? 10 : 12;
    const adaptBreak = deficit != null && deficit < 0.2 ? 1 : 2;
    const plan = { ...st, blockWeeks: st.blockWeeks || adaptBlock, breakWeeks: st.breakWeeks || adaptBreak,
      blockAdaptive: st.blockWeeks == null, breakAdaptive: st.breakWeeks == null };

    // Expected rate: observed trend with 2+ weeks of data, else from the deficit; 0.25–1.25% of body weight a week.
    const recent = tr.filter(p => p.date >= add(today, -20) && !inAny(st.breaks, p.date));
    const obs = recent.length >= 10 && diff(recent[0].date, recent[recent.length - 1].date) >= 14 ? -slope(recent) * 7 : null;
    const fromDeficit = tdee.kcal && cutKcal ? (tdee.kcal - cutKcal) * 7 / KCAL_PER_KG : null;
    const raw = obs != null && obs > 0 ? obs : fromDeficit;
    const rate = raw != null && kgNow ? clamp(raw, kgNow * 0.0025, kgNow * 0.0125) : null;

    // Days since the last weigh-in are assumed to follow the plan, so a logging gap does not push the goal out.
    let cutDaysLeft = Infinity;
    if (prof.goalKg && kgNow && rate) {
      const known = tr.length ? tr[tr.length - 1] : { date: prof.start, kg: prof.startKg };
      const rough = schedule(plan, prof.start, today, Infinity);
      let gap = 0;
      for (let d = add(known.date, 1); d <= today; d = add(d, 1)) if (!rough.some(x => x.type === "break" && x.start <= d && d <= x.end)) gap++;
      const kg = known.kg - rate * gap / 7;
      cutDaysLeft = kg > prof.goalKg ? Math.ceil((kg - prof.goalKg) / rate * 7) : 0;
    }
    const phases = schedule(plan, prof.start, today, cutDaysLeft);
    const now = phases.find(p => p.start <= today && (!p.end || today <= p.end)) || phases[0];
    const blockIdx = phases.filter(p => p.type === "cut" && p.start <= now.start).length;
    const nextBreak = phases.find(p => p.type === "break" && p.start > today) || null;
    const curBreak = now.type === "break" ? now : null;
    const cutStart = now.type === "cut" ? now.start : null;
    const weekInBlock = cutStart ? Math.floor(diff(cutStart, today) / 7) + 1 : null;

    // Early break: from week 8, raw weigh-ins (the trend lags a stall) dropped under 0.25% of
    // body weight in 2 weeks while eating on target.
    let early = null;
    if (now.type === "cut" && weekInBlock >= MIN_BLOCK && kgNow && cutKcal) {
      const last14 = series.filter(p => p.date > add(today, -14));
      const sl = last14.length >= 6 ? slope(last14) : null;
      const loss = sl != null ? -sl * 13 : null;
      const k = intake(docs, add(today, -13), today, []);
      if (loss != null && loss < kgNow * 0.0025 && k.length >= 8 && mean(k) <= cutKcal * 1.075) early = { loss, avgKcal: mean(k) };
    }

    const lastCut = phases.find(p => p.type === "cut" && p.last);
    return {
      today, state: plan, profile: prof, tdee, kgNow, cutKcal, cutSource, deficit,
      rate, rateSource: obs != null && obs > 0 ? "trend" : "deficit",
      phases, now, blockIdx, weekInBlock, cutStart, curBreak, nextBreak, early,
      daysToBreak: nextBreak ? diff(today, nextBreak.start) : null,
      breakDay: curBreak ? diff(curBreak.start, today) + 1 : null,
      breakKcal: tdee.kcal, breakMacros: macros(tdee.kcal, prof, kgNow), cutMacros: macros(cutKcal, prof, kgNow),

    const p = build(docs, state, { ...opts, today: opts.today || date });
    const ph = p.phases.find(x => x.start <= date && (!x.end || date <= x.end)) || p.now;
    const kcal = ph.type === "cut" ? p.cutKcal : p.breakKcal;
    const band = kcal != null ? r50(kcal * 0.075) : null;
    return { mode: ph.type, kcal, lo: kcal != null ? kcal - band : null, hi: kcal != null ? kcal + band : null, ...macros(kcal, p.profile, p.kgNow), phase: ph };

  // Records what the user does. Pass docs/opts so a break that started on its own can be ended or resized.
  function apply(state, action, today, docs, opts) {
    today = today || localToday();
    const p = build(docs || {}, state, { ...(opts || {}), today });
    const s = norm(state);
    const out = { blockWeeks: s.blockWeeks, breakWeeks: s.breakWeeks, breaks: s.breaks.map(b => ({ ...b })), auto: s.auto };
    let cur = out.breaks.find(b => b.start <= today && today <= b.end);
    if (!cur && p.curBreak) { cur = { start: p.curBreak.start, end: p.curBreak.end }; out.breaks.push(cur); }
    const weeks = out.breakWeeks || p.state.breakWeeks;
    if (action === "start" && !cur) out.breaks.push({ start: today, end: add(today, weeks * 7 - 1) });
    else if (action === "end" && cur) {

      else cur.end = add(today, -1);

    shown.forEach(x => {

      bars += '<div class="db-seg ' + x.type + '" style="left:' + pct(s) + '%;width:' + ((e - s) / span * 100).toFixed(2) + '%" title="' +
        esc((x.type === "cut" ? "Cut" : x.type === "break" ? "Maintenance break" : "At goal") + ": " + short(x.start) + (x.end ? " – " + short(x.end) : "")) + '"></div>';
    });
    bars += '<div class="db-now" style="left:' + clamp(Number(pct(ms(p.today) + DAY / 2)), 0, 100) + '%"><span>Today</span></div>';
    return '<div class="db-track" role="img" aria-label="Cut and break schedule">' + bars + '</div>' +
      '<div class="db-legend"><span><i class="cut"></i>Cut, ' + kcalTxt(p.cutKcal) + ' kcal</span><span><i class="break"></i>Break, ~' + kcalTxt(p.breakKcal) + ' kcal</span>' +
      (p.goalDate ? '<span><i class="maintain"></i>At goal</span>' : "") + '</div>';
  }

  function html(docs, state, opts = {}) {
    const p = build(docs, state, opts);
    if (p.breakKcal == null) {
      return '<div class="card db-card"><h3>Diet breaks</h3><p>Log a weigh-in to plan your diet breaks. Maintenance calories are estimated from your weight first, then from your logged food and weight trend.</p></div>';
    }
    const m = p.breakMacros, cut = kcalTxt(p.cutKcal);
    const src = { estimate: "estimated from your logged food and weight trend", trend: "from your trend weight and calorie burn", profile: "your starting estimate", bodyweight: "a rough start from your body weight" }[p.tdee.source];
    const tdeeNote = "Maintenance ~" + fint(p.breakKcal) + " kcal, " + src + (p.tdee.source === "estimate" || p.tdee.source === "trend" ? " (" + esc(p.tdee.confidence) + " confidence)." : ". It updates once there are 2+ weeks of weigh-ins and logged food.");
    const deficitNote = p.deficit != null ? " Your deficit is about " + Math.round(p.deficit * 100) + "%." : "";
    let head, body, actions;
    if (p.now.type === "break") {
      const len = diff(p.curBreak.start, p.curBreak.end) + 1;
      head = pill("neutral", "Diet break") + ' <b>Day ' + p.breakDay + ' of ' + len + '</b>';
      body = '<p>Eat at maintenance: <b>~' + fint(p.breakKcal) + ' kcal</b>.' +
        (m.protein ? ' Keep protein at ' + m.protein + ' g; put the extra calories mostly into carbs (~' + m.carbs + ' g) with fat ~' + m.fat + ' g.' : "") + '</p>' +
        '<p class="db-small">Expect the scale to rise a little in the first days (about 0.5–1.5% of body weight). That is glycogen and water, not fat. Keep training as usual. The cut restarts on <b>' + short(add(p.curBreak.end, 1)) + '</b> at ' + cut + ' kcal.</p>';
      actions = btn("end", "End break today", true) + (len === 7 ? btn("length:2", "Make it 2 weeks", true) : btn("length:1", "Make it 1 week", true));
    } else if (p.now.type === "maintain") {
      head = pill("good", "Goal reached") + ' <b>Maintenance</b>';
      body = '<p>Projected at your goal of ' + f1(p.profile.goalKg) + ' kg. Eat ~' + fint(p.breakKcal) + ' kcal to hold it.</p>';

    } else {

      else if (p.early) body = '<p>Your weight dropped only ' + f1(p.early.loss) + ' kg in 2 weeks while eating ~' + fint(p.early.avgKcal) + ' kcal. You are past week 8, so start the maintenance break now instead of waiting.</p>';
      else if (p.nextBreak) body = '<p>Next maintenance break: <b>' + short(p.nextBreak.start) + ' – ' + short(p.nextBreak.end) + '</b>' +
        ' (in ' + (p.daysToBreak <= 14 ? plural(p.daysToBreak, "day") : Math.round(p.daysToBreak / 7) + ' weeks') + '), at ~' + fint(p.breakKcal) + ' kcal a day. Until then stay at ' + cut + '.</p>';
      else body = '<p>No more breaks planned: the last stretch to your goal is shorter than a full block.</p>';
      if (p.weekInBlock < MIN_BLOCK) body += '<p class="db-small">Stalls before week 8 are usually water. Ride them out rather than starting a break early.</p>';
      actions = p.weekInBlock >= MIN_BLOCK ? btn("start", "Start break today", !(p.early || due)) : "";
    }
    const goal = p.goalDate ? 'Projected ' + f1(p.profile.goalKg) + ' kg around <b>' + longDate(p.goalDate) + '</b> at ~' + f1(p.rate) + ' kg/week (' + (p.rateSource === "trend" ? "your trend" : "from your deficit") + '), including ' + plural(p.plannedBreaks.length, "break") + '.' : "";
    const list = p.plannedBreaks.slice(0, 6).map(b =>
      '<li>' + short(b.start) + ' – ' + short(b.end) + (b.start <= p.today ? (b.end < p.today ? " · done" : " · now") : "") + '</li>').join("");
    const why = p.state.blockAdaptive ? " (set by your deficit)" : "";
    const len = '<div class="db-row db-small">Breaks every ' + plural(p.state.blockWeeks, "week") + ' of cutting' + why + ', ' + plural(p.state.breakWeeks, "week") + ' long. ' +
      (p.state.blockWeeks > MIN_BLOCK ? btn("block:" + (p.state.blockWeeks - 1), "Sooner", true) : "") +
      (p.state.blockWeeks < MAX_BLOCK ? btn("block:" + (p.state.blockWeeks + 1), "Later", true) : "") +
      (!p.state.blockAdaptive || !p.state.breakAdaptive ? btn("block:auto", "Adapt automatically", true) : "") + '</div>';
    return '<div class="card db-card"><div class="spread"><h3>Diet breaks</h3><span class="db-small">' + head + '</span></div>' +
      body + (actions ? '<div class="db-row">' + actions + '</div>' : "") + timeline(p) +
      (list ? '<ul class="db-list">' + list + '</ul>' : "") +
      (goal ? '<p class="db-small">' + goal + '</p>' : "") +
      '<p class="db-small">' + tdeeNote + deficitNote + '</p>' + len + '</div>';
  }

  const css = [
    ".db-card p{margin:.4em 0}",
    ".db-small{font-size:.85rem;color:var(--muted)}.db-small b{color:var(--ink)}",
    ".db-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}",
    ".db-pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}",
    ".db-pill.good{color:var(--good)}.db-pill.warn{color:var(--warn)}.db-pill.bad{color:var(--bad)}.db-pill.neutral{color:var(--accent)}",
    ".db-track{position:relative;height:16px;border-radius:999px;background:var(--sunk);margin:22px 0 6px;overflow:visible}",
    ".db-seg{position:absolute;top:0;bottom:0}.db-seg.cut{background:var(--accent);opacity:.85}.db-seg.break{background:var(--carbs)}.db-seg.maintain{background:var(--good);opacity:.6}",
    ".db-seg:first-child{border-radius:999px 0 0 999px}",
    ".db-now{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);transform:translateX(-1px)}",
    ".db-now span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap}",
    ".db-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}",
    ".db-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}",
    ".db-legend i.cut{background:var(--accent)}.db-legend i.break{background:var(--carbs)}.db-legend i.maintain{background:var(--good);opacity:.6}",
    ".db-list{margin:8px 0;padding-left:18px;font-size:.9rem}",
  ].join("\n");

  return { css, build, target, html, apply, estimateTdee };
})();

if (typeof module !== "undefined") module.exports = DietBreak;

window.DietBreak=window.DietBreak||(typeof DietBreak!=="undefined"?DietBreak:undefined);

<script>
/*
 * AppTargets: one place that turns the "Your numbers" profile into the targets every card uses.
 * Plain JS, no imports, no network. Browser global (window.AppTargets) or CommonJS.
 *
 * Why: calories, protein, fat, carbs, the goal weight and the review window used to be constants
 * inside each module (picker, protein gap, daily score, weekly report, budget recovery, Ramadan,
 * logger). Editing "Your numbers" only reached diet breaks and goal date. Modules should take the
 * object from AppTargets.resolve() as an option instead of hard-coding numbers.
 *
 *   AppTargets.resolve(profile, defaults) -> targets
 *     profile  = prefs/main.profile {start, startKg, goalKg, cutKcal, maintenance, protein, fat}, any field optional
 *     defaults = the host's plan numbers, same keys as the result (the module ships none of its own)
 *     targets  = {kcal, kcalLo, kcalHi, proteinMin, proteinMax, fatLo, fatHi, carbsLo, carbsHi,
 *                 goalKg, start, reviewDays, reviewDate, source:{<field>:"profile"|"default"|"derived"|"none"}}
 *   AppTargets.forKcal(targets, kcal)     -> same targets with a different calorie target (e.g. a diet-break day);
 *                                            carbs re-derived, protein kept
 *   AppTargets.lastDays(today, days)      -> {from, to} for the last `days` days ending today, inclusive
 *   AppTargets.reviewWindow(targets, today) -> {from, to, day, days, done} for the strict-tracking review
 *   AppTargets.validate(profile)          -> {clean, errors:[{field, msg}]}
 *
 * Never invents numbers: a field with no profile value and no default comes back null.

  const DAY = 864e5;
  const DATE = /^\d{4}-\d{2}-\d{2}$/;

  const LIMITS = {
    cutKcal: [1000, 6000, 'Calories should be between 1,000 and 6,000'],
    maintenance: [1000, 7000, 'Maintenance should be between 1,000 and 7,000'],
    protein: [40, 400, 'Protein should be between 40 and 400 g'],
    fat: [20, 250, 'Fat should be between 20 and 250 g'],
    goalKg: [30, 300, 'Goal weight should be between 30 and 300 kg'],
    startKg: [30, 300, 'Start weight should be between 30 and 300 kg'],
  };

  const isNum = v => v !== null && v !== '' && v !== undefined && isFinite(+v);
  const r5 = v => Math.round(v / 5) * 5;
  const r1 = v => Math.round(v * 10) / 10;
  const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * DAY).toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / DAY);

      if (isNum(D[key])) { source[key] = 'default'; return +D[key]; }

    };

    t.kcal = pick('kcal', P.cutKcal);

      t.kcalLo = t.kcal != null ? t.kcal - KCAL_BAND : null; t.kcalHi = t.kcal != null ? t.kcal + KCAL_BAND : null;
      source.kcalBand = t.kcal != null ? 'derived' : 'none';

    if (isNum(P.fat)) { t.fatLo = r1(P.fat - FAT_BAND); t.fatHi = r1(P.fat + FAT_BAND); source.fat = 'profile'; }
    else if (isNum(D.fatLo) && isNum(D.fatHi)) { t.fatLo = +D.fatLo; t.fatHi = +D.fatHi; source.fat = 'default'; }

    // Carbs: keep the plan's range unless a profile number moved the others; then fill the remainder.
    const moved = source.kcal === 'profile' || source.proteinMin === 'profile' || source.fat === 'profile';
    if (!moved && isNum(D.carbsLo) && isNum(D.carbsHi)) { t.carbsLo = +D.carbsLo; t.carbsHi = +D.carbsHi; source.carbs = 'default'; }

  }

  function forKcal(targets, kcal) {
    const t = Object.assign({}, targets, { source: Object.assign({}, targets.source) });
    if (!isNum(kcal)) return t;
    t.kcal = +kcal; t.kcalLo = t.kcal - KCAL_BAND; t.kcalHi = t.kcal + KCAL_BAND;
    const mid = carbsFor(t.kcal, t.proteinMin, t.fatLo != null ? (t.fatLo + t.fatHi) / 2 : null);
    if (mid != null) { t.carbsLo = Math.max(0, mid - CARB_BAND); t.carbsHi = mid + CARB_BAND; t.source.carbs = 'derived'; }

  }

  function lastDays(today, days) {
    if (!realDate(today) || !(days >= 1)) return null;

  }

  function reviewWindow(targets, today) {
    if (!targets || !targets.start || !realDate(today)) return null;
    const days = targets.reviewDays || REVIEW_DAYS;
    const day = daysBetween(targets.start, today) + 1;
    return { from: targets.start, to: addDays(targets.start, days - 1), day: Math.max(0, Math.min(day, days)), days, done: day >= days, notStarted: day < 1 };

/* ===================== Store (synced db when available, else this browser) ===================== */
const COLS = ["days","weights","workouts","prefs","meals","barcodes"];
const S = {docs:{days:{},weights:{},workouts:{},prefs:{},meals:{},barcodes:{}}, db:null, mode:"loading"};
let renderPending = false;
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem("aziz-cut")||"null"); if(j) COLS.forEach(c=>S.docs[c]=j[c]||{}); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem("aziz-cut", JSON.stringify(S.docs)); }catch(e){} }
async function put(col,id,data,{quiet}={}){
  const dl=S.docs.prefs.main; if(col==="workouts" && dl && dl.deloadUntil && dl.deloadFrom && id>=dl.deloadFrom && id<=dl.deloadUntil && data && !data.deload) data={...data,deload:true};
  S.docs[col] = {...S.docs[col],[id]:data};
  if(!quiet) render();
  if(S.db){ try{ await S.db.collection(col).doc(id).set(data); }catch(e){ toast("Not saved: "+(e.message||e.code)); } }
  else saveLocal();
}
async function remove(col,id){
  const o = {...S.docs[col]}; delete o[id]; S.docs[col]=o; render();
  if(S.db){ try{ await S.db.collection(col).doc(id).delete(); }catch(e){ toast("Not deleted: "+(e.message||e.code)); } } else saveLocal();
}
const clone = o => JSON.parse(JSON.stringify(o||{}));

async function initStore(){
  loadLocal(); S.mode="local"; render();
  let db = null;
  try{ db = window.claude && await window.claude.use("db"); }catch(e){}
  if(!db){ setSync(); return; }
  S.db = db; S.mode="sync"; COLS.forEach(c=>S.docs[c]={});
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(qs=>{
      const o={}; qs.docs.forEach(d=>{ o[d.id]=d.data(); }); S.docs[c]=o; scheduleRender();
    }, err=>{ toast("Sync problem: "+err.message); });
  });
  setSync();
}
function setSync(){
  document.getElementById("sync").textContent = S.mode==="sync" ? "Synced across your phone and computer" : "Saved in this browser only";
}
function scheduleRender(){
  const a = document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest("main")){ renderPending = true; return; }
  render();
}
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(renderPending){ const a=document.activeElement; if(!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))){ renderPending=false; render(); } } }, 50); });

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const TODAY = iso(new Date());
const fmt = (s,opt={weekday:"short",month:"short",day:"numeric"}) => parse(s).toLocaleDateString("en-US",opt);
function dayType(s){ const w=parse(s).getDay(); return w===5?"friday":w===6?"saturday":"training"; }

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(n), r1 = n => Math.round(n*10)/10;

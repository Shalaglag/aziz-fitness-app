<script>
/* StrongCSV: turns a Strong app export (Settings > Export Strong Data > CSV) into
 * the app's workouts/{date} docs. Plain JS, no imports, no network.
 *
 *   StrongCSV.parse(text, {unit})            -> [{date, title, durationMin, exercises:[{name, sets:[{w,r,kind,unit}]}]}]
 *   StrongCSV.toWorkouts(text, opts)          -> {docs:{<date>:workoutDoc}, report}
 *     opts.program   PROGRAM object ({session:[[name,w,r,sets,unit,...]]}), required
 *     opts.rotation  ROTATION array, required
 *     opts.existing  current workouts docs by date (manual sets are kept for exercises Strong didn't log)
 *     opts.unit      "kg" | "lb": weight unit when the CSV header doesn't say (Strong's own unit setting). Default "kg".
 *     opts.since     ISO date; skip workouts before it
 *   StrongCSV.matchName(strongName, programNames) -> app exercise name or null
 *
 * Handles both export layouts: the older comma file ("Weight", "Duration" like "1h 5m")
 * and the newer semicolon file ("Weight (kg)" / "Weight (lbs)", "Duration (sec)", "Workout #").
 * Warm-up sets ("W") are dropped; drop ("D") and failure ("F") sets are kept. "Rest Timer" rows are ignored.
 * Weights are converted to the unit the program lists for that exercise (lb for the DB lifts).
 */
const StrongCSV = (() => {
  const LB = 0.45359237;

  function splitRows(text, delim) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.some(c => c !== "")) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur); if (row.some(c => c !== "")) rows.push(row);
    return rows;
  }

  const norm = s => String(s || "").toLowerCase().replace(/\(.*?\)/g, m => " " + m.slice(1, -1) + " ")
    .replace(/[^a-z0-9]+/g, " ").trim();

  function num(v) {
    if (v == null) return null;
    const s = String(v).trim().replace(",", ".");
    if (s === "") return null;
    const n = parseFloat(s); return isFinite(n) ? n : null;
  }

  function durationMin(v, secHeader) {
    if (v == null || v === "") return null;
    if (secHeader) { const n = num(v); return n == null ? null : Math.round(n / 60); }
    let m = 0, hit = false;
    String(v).replace(/(\d+)\s*h/, (_, h) => { m += h * 60; hit = true; }).replace(/(\d+)\s*m/, (_, x) => { m += +x; hit = true; });
    if (!hit) { const n = num(v); return n == null ? null : Math.round(n / 60); }
    return m;
  }

  function parse(text, opts) {
    opts = opts || {};
    text = String(text || "").replace(/^﻿/, "");
    const first = text.split(/\r?\n/, 1)[0] || "";
    const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",";
    const rows = splitRows(text, delim);
    if (!rows.length) throw new Error("The file is empty.");
    const head = rows[0].map(h => h.trim());
    const col = re => head.findIndex(h => re.test(h));
    const c = {
      date: col(/^date$/i), title: col(/^workout name$/i), dur: col(/^duration/i), ex: col(/^exercise name$/i),
      order: col(/^set order$/i), w: col(/^weight/i), r: col(/^reps$/i), num: col(/^workout #$/i),
    };
    if (c.date < 0 || c.ex < 0 || c.w < 0 || c.r < 0) throw new Error("This doesn't look like a Strong export (no Date / Exercise Name / Weight / Reps columns).");
    const wHead = head[c.w];
    const unit = /lb/i.test(wHead) ? "lb" : /kg/i.test(wHead) ? "kg" : (opts.unit === "lb" ? "lb" : "kg");
    const secDur = c.dur >= 0 && /sec/i.test(head[c.dur]);

    const byKey = new Map();
    for (const r of rows.slice(1)) {
      const rawDate = (r[c.date] || "").trim();
      const order = c.order >= 0 ? (r[c.order] || "").trim() : "";
      if (!rawDate || /rest/i.test(order)) continue;
      const date = rawDate.slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
      const key = (c.num >= 0 ? r[c.num] : "") + "|" + rawDate + "|" + (r[c.title] || "");
      let wo = byKey.get(key);
      if (!wo) {
        wo = { date, start: rawDate, title: (c.title >= 0 ? r[c.title] : "").trim(), durationMin: c.dur >= 0 ? durationMin(r[c.dur], secDur) : null, exercises: [] };
        byKey.set(key, wo);
      }
      const name = (r[c.ex] || "").trim(); if (!name) continue;
      let ex = wo.exercises.find(e => e.name === name);
      if (!ex) { ex = { name, sets: [] }; wo.exercises.push(ex); }
      const kind = /^w$/i.test(order) ? "warmup" : /^d$/i.test(order) ? "drop" : /^f$/i.test(order) ? "failure" : "working";
      const w = num(r[c.w]), reps = num(r[c.r]);
      if (reps == null && w == null) continue;
      ex.sets.push({ w: w == null ? 0 : w, r: reps == null ? 0 : Math.round(reps), kind, unit });
    }
    return [...byKey.values()].sort((a, b) => (a.start < b.start ? -1 : 1));
  }

  // Strong built-in names Aziz's gym exercises are likely saved under -> app names.
  const ALIASES = {
    "bench press barbell": "Bench Press (Barbell)",
    "lateral raise cable": "Lateral Raise (Cable)",
    "incline bench press dumbbell": "Incline DB Press",
    "incline dumbbell press": "Incline DB Press",
    "cable crossover": "Cable Crossover",
    "triceps extension cable": "Triceps Extension (Cable)",
    "triceps pushdown cable straight bar": "Triceps Pushdown (Straight bar)",
    "triceps pushdown": "Triceps Pushdown (Straight bar)",
    "triceps pushdown cable": "Triceps Pushdown (Straight bar)",
    "triceps pushdown rope": "Triceps Rope",
    "triceps rope pushdown": "Triceps Rope",
    "lateral raise machine": "Standing Side Delts (Machine)",
    "lat pulldown cable": "Lat Pulldown, Wide",
    "lat pulldown wide grip": "Lat Pulldown, Wide",
    "wide grip lat pulldown": "Lat Pulldown, Wide",
    "lat pulldown single arm": "Lat Pulldown, Single Arm",
    "single arm lat pulldown": "Lat Pulldown, Single Arm",
    "seated row cable": "Seated Row (Cable)",
    "seated cable row": "Seated Row (Cable)",
    "pullover machine": "Pullover (Machine)",
    "bicep curl dumbbell": "DB Curl",
    "biceps curl dumbbell": "DB Curl",
    "bicep curl machine": "Seated Bicep Curl",
    "preacher curl machine": "Seated Bicep Curl",
    "reverse fly machine": "Reverse Fly (Machine)",
    "rear delt fly machine": "Reverse Fly (Machine)",
    "leg extension machine": "Leg Extension",
    "hack squat": "Hack Squat",
    "hack squat machine": "Hack Squat",
    "squat smith machine": "Smith Squat",
    "smith machine squat": "Smith Squat",
    "lying leg curl machine": "Lying Leg Curl",
    "leg curl machine": "Lying Leg Curl",
    "hip adductor machine": "Hip Adductor",
    "hip abductor machine": "Hip Abductor",
    "standing calf raise machine": "Standing Calf Raise",
    "calf press on leg press": "Calf Press on Seated Leg Press",
    "calf press machine": "Calf Press on Seated Leg Press",
    "seated calf raise machine": "Calf Press on Seated Leg Press",
    "crunch machine": "Seated Abs",
    "ab crunch machine": "Seated Abs",
    "chest press machine": "Gundam (Chest Machine)",
    "seated overhead press dumbbell": "Seated DB Overhead Press",
    "overhead press dumbbell": "Seated DB Overhead Press",
    "shoulder press dumbbell": "Seated DB Overhead Press",
    "front raise dumbbell": "Front Raise (DB)",
    "lateral raise dumbbell": "Side Delts",
    "t bar row": "T-Bar Row",
    "iso lateral row machine": "Iso-Lateral Low Row",
    "iso lateral low row": "Iso-Lateral Low Row",
    "shrug machine": "Traps Machine",
    "bicep curl cable": "Cable Standing Biceps",
    "biceps curl cable": "Cable Standing Biceps",
  };

  function matchName(strongName, names) {
    const n = norm(strongName);
    const exact = names.find(x => norm(x) === n);
    if (exact) return exact;
    const a = ALIASES[n];
    if (a && names.includes(a)) return a;
    // Token overlap fallback, only when it's clearly one exercise.
    const toks = new Set(n.split(" ").filter(t => t.length > 1));
    let best = null, bestScore = 0, second = 0;
    for (const x of names) {
      const xt = norm(x).split(" ").filter(t => t.length > 1);
      const hit = xt.filter(t => toks.has(t)).length;
      const score = hit / Math.max(xt.length, toks.size);
      if (score > bestScore) { second = bestScore; bestScore = score; best = x; } else if (score > second) second = score;
    }
    return bestScore >= 0.6 && bestScore - second >= 0.2 ? best : null;
  }

  function convert(w, from, to) {
    if (from === to) return w;
    const v = from === "lb" ? w * LB : w / LB;
    return Math.round(v * 4) / 4;
  }

  function toWorkouts(text, opts) {
    const { program, rotation } = opts || {};
    if (!program || !rotation) throw new Error("toWorkouts needs opts.program and opts.rotation.");
    const existing = opts.existing || {};
    const sessions = Object.keys(program);
    const unitOf = {};
    sessions.forEach(s => program[s].forEach(e => { unitOf[e[0]] = e[4] || "kg"; }));
    const allNames = Object.keys(unitOf);
    const parsed = parse(text, opts).filter(w => !opts.since || w.date >= opts.since);

    const docs = {}, report = { workouts: 0, days: 0, sets: 0, unmatched: {}, sessions: {} };
    for (const wo of parsed) {
      // Session: from the Strong workout title ("Push A", "Pull B – day 5"…), else best exercise overlap.
      const t = norm(wo.title);
      let session = sessions.find(s => t.includes(norm(s))) || null;
      if (!session) {
        let best = 0;
        for (const s of sessions) {
          const names = program[s].map(e => e[0]);
          const hits = wo.exercises.filter(e => matchName(e.name, names)).length;
          if (hits > best) { best = hits; session = s; }
        }
      }
      const pool = session ? program[session].map(e => e[0]) : [];
      const doc = docs[wo.date] || Object.assign({ date: wo.date, sets: {} }, JSON.parse(JSON.stringify(existing[wo.date] || {})));
      doc.sets = doc.sets || {};
      if (session && (!doc.session || doc.source === "strong" || !docs[wo.date])) {
        doc.session = session; doc.idx = rotation.indexOf(session);
      }
      for (const ex of wo.exercises) {
        const name = matchName(ex.name, pool) || matchName(ex.name, allNames);
        if (!name) { report.unmatched[ex.name] = (report.unmatched[ex.name] || 0) + 1; }
        const key = name || ex.name;
        const to = unitOf[key] || ex.sets[0]?.unit || "kg";
        const sets = ex.sets.filter(s => s.kind !== "warmup" && s.r > 0).map(s => ({ w: convert(s.w, s.unit, to), r: s.r }));
        if (!sets.length) continue;
        doc.sets[key] = (docs[wo.date] && docs[wo.date].strongNames && docs[wo.date].strongNames.includes(key)) ? doc.sets[key].concat(sets) : sets;
        doc.strongNames = (doc.strongNames || []).concat(key);
        report.sets += sets.length;
      }
      doc.source = "strong";
      doc.strong = { title: wo.title, durationMin: wo.durationMin, importedAt: new Date().toISOString() };
      if (!docs[wo.date]) report.days++;
      docs[wo.date] = doc;
      report.workouts++;
      if (session) report.sessions[session] = (report.sessions[session] || 0) + 1;
    }
    for (const d of Object.values(docs)) delete d.strongNames;
    return { docs, report };
  }

  return { parse, toWorkouts, matchName, ALIASES };
})();
if (typeof module !== "undefined") module.exports = StrongCSV;

window.StrongCSV=StrongCSV;
</script>
<script>
window.WaterH=(function(){
// WaterH import: turns what the phone hands over (a Shortcut line, a Health
// Connect / Health Auto Export CSV, or Apple Health's export.xml) into daily
// water totals, and folds them into a `days/{date}` doc. Plain ES module, no
// dependencies, no network.
//
// WaterH has no public API. It writes every sip to Apple Health (iPhone) or
// Google Fit / Health Connect (Android), so the bridge is the phone's health
// store, not WaterH itself.
//
// Accepted input (any mix, one paste or one file):
//   WATERH 2026-10-25 2350          <- the iPhone Shortcut line (ml)
//   WATERH 2026-10-25 2.35 L        <- units: ml, l, L, oz, fl oz, cup
//   2350                            <- a bare number = today
//   CSV with a date/time column and a water/volume/hydration column
//   Apple export.xml <Record type="HKQuantityTypeIdentifierDietaryWater" .../>
//
// Day doc fields this module owns:
//   waterh: { ml, at (ISO of import), source: "shortcut"|"csv"|"apple-xml"|"manual" }
// `water` stays the manual counter (Gatorade, shakes, glasses not from the
// bottle). The day's total is totalWater(day) = water + waterh.ml.

const UNIT_ML = { ml: 1, milliliter: 1, milliliters: 1, l: 1000, liter: 1000, liters: 1000, litre: 1000, litres: 1000,
  oz: 29.5735, floz: 29.5735, "fl oz": 29.5735, "fl_oz_us": 29.5735, cup: 236.588, cups: 236.588 };

function toMl(value, unit, fallbackUnit) {
  const n = parseFloat(String(value).replace(",", "."));
  if (!isFinite(n)) return null;
  let u = String(unit || fallbackUnit || "").toLowerCase().replace(/[()\s]+/g, " ").trim();
  if (u === "fl oz" || u === "fl_oz" || u === "fl oz us") u = "oz";
  let f = UNIT_ML[u];
  if (f == null) f = n < 20 ? 1000 : 1; // unitless: small numbers are litres
  return Math.round(n * f);
}

function localISODate(d) {
  const z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}

// "2026-10-25 14:03:00 +0300", "2026-10-25T11:03:00Z", "10/25/2026", "25/10/2026 14:03"
function toDate(s) {
  s = String(s || "").trim().replace(/^"|"$/g, "");
  // The date as written is the phone's local day, which is the day Aziz drank it.
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{4})/);
  if (m) {
    let a = +m[1], b = +m[2]; // month/day unless the first can't be a month
    const [mo, da] = a > 12 ? [b, a] : [a, b];
    return `${m[3]}-${String(mo).padStart(2, "0")}-${String(da).padStart(2, "0")}`;
  }
  return null;
}

function splitCsvLine(line, sep) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === sep && !q) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}

function parseShortcutLines(text, today) {
  const rows = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    let m = line.match(/^WATERH\s+(\d{4}-\d{2}-\d{2})\s+([\d.,]+)\s*([a-zA-Z ]*)$/i);
    if (m) { rows.push({ date: m[1], ml: toMl(m[2], m[3], "ml"), source: "shortcut", whole: true }); continue; }
    m = line.match(/^([\d.,]+)\s*(ml|l|oz|fl oz|cups?)?$/i);
    if (m && line) rows.push({ date: today, ml: toMl(m[1], m[2], "ml"), source: "manual", whole: true });
  }
  return rows;
}

function parseAppleXml(text) {
  const rows = [];
  const re = /<Record\b[^>]*type="HKQuantityTypeIdentifierDietaryWater"[^>]*>/g;
  let m;
  while ((m = re.exec(text))) {
    const tag = m[0], attr = k => (tag.match(new RegExp(`\\b${k}="([^"]*)"`)) || [])[1];
    const date = toDate(attr("startDate"));
    const ml = toMl(attr("value"), attr("unit"), "ml");
    if (date && ml != null) rows.push({ date, ml, source: "apple-xml" });
  }
  return rows;
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const sep = [",", ";", "\t"].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0];
  const head = splitCsvLine(lines[0], sep).map(h => h.toLowerCase());
  const dateCol = head.findIndex(h => /(^|\b)(date|start|time|day)/.test(h));
  let volCol = head.findIndex(h => /water|hydration|volume|intake/.test(h) && !/date|time|type/.test(h));
  // Long format (time,type,value,unit): keep only the water rows.
  const typeCol = head.findIndex(h => /^(type|data ?type|metric|record ?type)$/.test(h));
  if (volCol < 0) volCol = head.findIndex(h => /^(value|amount|quantity|qty)/.test(h));
  if (dateCol < 0 || volCol < 0) return [];
  const unitCol = head.findIndex(h => /^unit/.test(h));
  const headUnit = (head[volCol].match(/\(([^)]+)\)/) || [])[1]
    || (head[volCol].match(/\b(ml|l|oz|fl oz|liters?|litres?)\b/) || [])[1];
  const rows = [];
  for (const line of lines.slice(1)) {
    const c = splitCsvLine(line, sep);
    if (typeCol >= 0 && !/water|hydration/i.test(c[typeCol] || "")) continue;
    const date = toDate(c[dateCol]);
    if (!date || c[volCol] === "" || c[volCol] == null) continue;
    const ml = toMl(c[volCol], unitCol >= 0 ? c[unitCol] : headUnit, headUnit || "ml");
    if (ml != null) rows.push({ date, ml, source: "csv" });

}

// Returns [{date, ml, source}] sorted by date, one row per day (summed).
function parseWaterH(text, now = new Date()) {
  text = String(text || "");
  const today = localISODate(now);
  let rows;
  if (/HKQuantityTypeIdentifierDietaryWater/.test(text)) rows = parseAppleXml(text);
  else if (/^\s*WATERH\s|^\s*[\d.,]+\s*(ml|l|oz|fl oz|cups?)?\s*$/im.test(text) && !/[,;\t].*[,;\t]/.test(text.split(/\r?\n/)[0])) rows = parseShortcutLines(text, today);
  else rows = parseCsv(text);
  const byDay = {};
  for (const r of rows) {
    if (!r.ml || r.ml < 0) continue;
    const d = byDay[r.date] || (byDay[r.date] = { date: r.date, ml: 0, source: r.source });
    // A Shortcut line is already the day's total: the latest line wins, never summed.
    d.ml = r.whole ? r.ml : d.ml + r.ml;
  }
  return Object.values(byDay).filter(r => r.ml > 0 && r.ml < 20000).sort((a, b) => a.date.localeCompare(b.date));
}

// Writes the WaterH total onto a day doc (returns a new object). Re-importing
// the same day replaces the old figure, so syncing twice never double counts.
function applyWaterH(day, row, now = new Date()) {
  return Object.assign({}, day, { waterh: { ml: Math.round(row.ml), at: now.toISOString(), source: row.source } });
}

function totalWater(day) {
  return (day && day.water || 0) + (day && day.waterh && day.waterh.ml || 0);
}

return {parseWaterH, applyWaterH, totalWater};
})();

  function niceTicks(min, max, n) {

    if (opts.goal != null) svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(opts.goal) + '" y2="' + sy(opts.goal) + '" class="goal"/><text x="' + (W - R) + '" y="' + (sy(opts.goal) - 4) + '" text-anchor="end" class="ax goaltxt">Goal ' + opts.goal + '</text>';
    if (pts.length > 1) svg += '<polygon class="area" points="' + sx(x0) + ',' + (H - B) + ' ' + line + ' ' + sx(x1) + ',' + (H - B) + '"/><polyline class="ln" points="' + line + '"/>';

    if (updateTpl) {

  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest("main")){ renderPending = true; return; }
  render();
}
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(renderPending){ const a=document.activeElement; if(!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))){ renderPending=false; render(); } } }, 50); });

/* ===================== Dates ===================== */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const TODAY = iso(new Date());
const fmt = (s,opt={weekday:"short",month:"short",day:"numeric"}) => parse(s).toLocaleDateString("en-US",opt);
function dayType(s){ const w=parse(s).getDay(); return w===5?"friday":w===6?"saturday":"training"; }
const DAYTYPE_LABEL = {training:"Training day (Sun–Thu)",saturday:"Saturday · train 10 am",friday:"Friday · free day"};

/* ===================== Helpers ===================== */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(n), r1 = n => Math.round(n*10)/10;
const uid = () => Math.random().toString(36).slice(2,9);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function totalWater(day){ return window.WaterH ? WaterH.totalWater(day) : (day.water||0); }
function getDay(d){ return Object.assign({date:d,food:[],water:0,supps:{},treadmill:false}, clone(S.docs.days[d])); }
function sum(items){ return items.reduce((a,i)=>({kcal:a.kcal+(+i.kcal||0),p:a.p+(+i.p||0),c:a.c+(+i.c||0),f:a.f+(+i.f||0)}),{kcal:0,p:0,c:0,f:0}); }
function isNever(name){ const n=(name||"").toLowerCase(); if(n.includes("french tacos")) return false; return NEVER_KEYS.concat((S.docs.prefs.main?.dislikes||[]).map(x=>x.toLowerCase())).some(k=>k && n.includes(k)); }
function weightsSorted(){ return Object.values(S.docs.weights).filter(w=>w&&w.kg).sort((a,b)=>a.date<b.date?-1:1); }
function avg7(date){ const ws=weightsSorted().filter(w=>w.date<=date && diffDays(w.date,date)<7); return ws.length>=7 ? ws.reduce((a,w)=>a+w.kg,0)/ws.length : null; }
function avgWindow(endDate){ const ws=weightsSorted().filter(w=>w.date<=endDate && diffDays(w.date,endDate)<7); return ws.length ? {avg:ws.reduce((a,w)=>a+w.kg,0)/ws.length,n:ws.length} : null; }

function sessionFor(date){
  const w = S.docs.workouts[date];
  if(w && w.session) return {session:w.session, idx:w.idx, chosen:true};
  const prev = Object.values(S.docs.workouts).filter(x=>x && x.date<date && x.session).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(prev && Number.isInteger(prev.idx)){ const idx=(prev.idx+1)%8; return {session:ROTATION[idx], idx, chosen:false, after:prev}; }
  return null;
}
function e1rm(w,r){ w=+w; r=+r; return w&&r ? w*(1+Math.min(r,30)/30) : 0; }
function bestSet(sets){ let b=null; (sets||[]).forEach(s=>{ const v=e1rm(s.w,s.r); if(v && (!b || v>b.v)) b={...s,v}; }); return b; }
function liftHistory(name){
  return Object.values(S.docs.workouts).filter(w=>w&&w.sets&&w.sets[name]).sort((a,b)=>a.date<b.date?-1:1)
    .map(w=>({date:w.date, best:bestSet(w.sets[name])})).filter(x=>x.best);
}
function dropping(name){ const h=liftHistory(name); if(h.length<3) return false; const [a,b,c]=h.slice(-3); return b.best.v<a.best.v && c.best.v<b.best.v; }

/* ===================== UI state ===================== */
const view = {tab:"today", date:TODAY, q:"", timer:null, trainMode:"quick"};
try{ const m=localStorage.getItem("aziz-cut-tmode"); if(m) view.trainMode=m; }catch(e){}
try{ const t=localStorage.getItem("aziz-cut-tab"); if(t) view.tab=t; }catch(e){}
if(["today","train","food","progress","guide"].includes(location.hash.slice(1))) view.tab=location.hash.slice(1);
const main = document.getElementById("main");

function currentAccent(){ return S.docs.prefs.main?.accent || "blue"; }
function applyAccent(a){ if(["red","blue","yellow","green"].includes(a)) document.documentElement.setAttribute("data-accent",a); }
let lastTab=null;
function render(){
  renderPending=false;
  applyAccent(currentAccent());
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===view.tab?"page":"false"));
  document.getElementById("dateLabel").textContent = fmt(view.date) + (view.date===TODAY?" · today":"");
  document.getElementById("goToday").hidden = view.date===TODAY;
  const y = window.scrollY;
  main.innerHTML = ({today:vToday,train:vTrain,food:vFood,progress:vProgress,guide:vGuide})[view.tab]();
  syncLogger();
  if(lastTab!==view.tab){ [...main.children].forEach((c,i)=>{ c.classList.add("anim-rise"); c.style.setProperty("--i",i); }); lastTab=view.tab; }
  window.scrollTo(0,y);
}

/* ---------- macro bars ---------- */
function macroBars(items){
  const all=sum(items), eaten=sum(items.filter(i=>i.eaten));
  const rows=[["Calories","kcal",TARGET.kcal*0.95,TARGET.kcal*1.05,2400,"kcal",""],["Protein","p",TARGET.pMin,TARGET.pMax,220,"p","g"],["Carbs","c",TARGET.cMin,TARGET.cMax,280,"c","g"],["Fat","f",TARGET.fMin,TARGET.fMax,100,"f","g"]];
  return `<div class="macros">${rows.map(([lab,k,lo,hi,max,cls,u])=>`
    <div class="mrow"><span class="label">${lab}</span>
      <div class="mbar" aria-hidden="true"><span class="planned ${cls}" style="width:${Math.min(100,all[k]/max*100)}%"></span><span class="eaten ${cls}" style="width:${Math.min(100,eaten[k]/max*100)}%"></span><span class="zone" style="left:${lo/max*100}%;width:${(hi-lo)/max*100}%"></span></div>
      <span class="mval">${r0(eaten[k])}${u} <span class="muted">/ ${r0(all[k])}</span></span></div>`).join("")}
    <p class="muted" style="font-size:.8rem">Solid = eaten, faded = planned, brackets = target range.</p></div>`;
}
function verdict(items){
  const t=sum(items); if(!items.length) return "";
  const msgs=[];
  if(t.kcal<1850) msgs.push(["warn",`${r0(2000-t.kcal)} kcal under 2,000`]); else if(t.kcal>2100) msgs.push(["bad",`${r0(t.kcal-2000)} kcal over 2,000`]); else msgs.push(["good","Calories on target"]);
  if(t.p<TARGET.pMin) msgs.push(["warn",`Protein ${r0(TARGET.pMin-t.p)} g short`]); else msgs.push(["good","Protein hit"]);
  if(t.f>TARGET.fMax) msgs.push(["warn","Fat on the high side"]);
  return `<div class="row">${msgs.map(([c,m])=>`<span class="pill ${c}">${m}</span>`).join("")}</div>`;
}

/* ---------- TRAIN ---------- */
function trainSwitch(){
  return `<div class="row" role="group" aria-label="Logger style"><button class="chip" data-act="tmode" data-m="quick" aria-pressed="${view.trainMode==="quick"}">Quick log</button><button class="chip" data-act="tmode" data-m="full" aria-pressed="${view.trainMode==="full"}">Full logger (Strong-style)</button></div>`;
}
function vTrain(){ return view.trainMode==="full" ? `<div class="card">${trainSwitch()}<p class="muted" style="font-size:.88rem">Templates, live workout with rest timer, PRs, plate calculator and history. Finished workouts also land in Today, Progress and the weekly report.</p></div>` : `<div>${trainSwitch()}</div>` + vTrainSession() + otherLogged() + strongCard(); }
function otherLogged(){
  const d=view.date, wk=S.docs.workouts[d]; if(!wk||!wk.sets) return "";
  const known=new Set((PROGRAM[wk.session]||[]).map(e=>e[0]));
  const extra=Object.keys(wk.sets).filter(n=>!known.has(n) && (wk.sets[n]||[]).some(x=>x.w||x.r));
  if(!extra.length) return "";
  return `<div class="card"><h3>Other exercises logged</h3>${wk.source==="strong"?`<p class="muted" style="font-size:.88rem">Imported from Strong${wk.strong&&wk.strong.title?`: ${esc(wk.strong.title)}`:""}</p>`:""}<div class="items">${extra.map(n=>`<div class="item" style="grid-template-columns:1fr auto"><b>${esc(n)}</b><span class="mac">${wk.sets[n].filter(x=>x.w||x.r).map(x=>`${esc(x.w)}×${esc(x.r)}`).join(", ")}</span></div>`).join("")}</div></div>`;
}
function strongCard(){
  return `<div class="card"><div class="spread"><h3>Import from Strong</h3><label class="btn ghost small" style="cursor:pointer">Choose CSV file<input type="file" id="strongFile" accept=".csv,text/csv" hidden></label></div>
  <p class="muted" style="font-size:.9rem">In Strong, open Settings, then Export Strong Data, and pick the CSV here. Warm-ups are skipped, weights convert to each exercise's unit, and importing again replaces that day's Strong sets instead of doubling them.</p>
  ${view.strongMsg?`<p class="note info">${view.strongMsg}</p>`:""}</div>`;
}
function vTrainSession(){
  const d=view.date, ses=sessionFor(d), wk=S.docs.workouts[d]||{};
  const cur = ses ? ses.session : null;
  const picker = `<div class="row">${ROTATION.map((s,i)=>`<button class="chip ${s==="Rest"?"rest":""}" data-act="setses" data-idx="${i}" aria-pressed="${cur===s && (ses.idx===i)}">${s}</button>`).join("")}</div>`;
  if(!cur) return `<div class="card"><h2>Pick today's session</h2>${picker}</div>`;
  if(cur==="Rest") return `<div class="card"><h2>Rest day</h2><p>Recovery is where the strength comes back. Walk, stretch, sleep well, and keep food at 2,000 kcal.</p>${picker}</div>`;
  const ex = PROGRAM[cur];
  return `
  <div class="card hero">
    <div class="spread"><h2>${cur}</h2>${ses.chosen?"":`<span class="pill info">Suggested from rotation</span>`}</div>
    ${picker}
    <div class="row"><span class="label">Rest timer</span><button class="chip" data-act="timer" data-s="90">1:30</button><button class="chip" data-act="timer" data-s="150">2:30</button><button class="chip" data-act="timer" data-s="180">3:00</button></div>
    <p class="muted" style="font-size:.88rem">Big compounds: rest 2.5–3 min. Work in 8–12 reps, 1–2 reps short of failure. Keep loads heavy during the cut.</p>
  </div>
  <div class="card">
    ${ex.map(([name,bw,br,bs,unit,note])=>{
      const logged = (wk.sets&&wk.sets[name]) || [];
      const n = Math.max(bs, logged.length);
      const hist = liftHistory(name).filter(h=>h.date<d);
      const last = hist[hist.length-1];
      const lib = LIB[name];
      const isMain = MAIN_LIFTS.includes(name);
      const todayBest = bestSet(logged);
      let cmp="";
      const ref = last ? last.best : {w:bw,r:br,v:e1rm(bw,br)};
      if(todayBest){ cmp = todayBest.v>=ref.v-0.01 ? `<span class="pill good">At or above ${last?"last time":"baseline"}</span>` : `<span class="pill warn">Below ${last?"last time":"baseline"}</span>`; }
      return `<div class="ex">
        <div class="spread"><div><b>${esc(name)}</b> ${isMain?`<span class="pill info">Main lift</span>`:""}</div>${cmp}</div>
        <div class="muted" style="font-size:.88rem">Baseline <span class="num">${bw} ${unit} × ${br}, ×${bs}</span>${last?` · Last <span class="num">${last.best.w} × ${last.best.r}</span> (${fmt(last.date,{month:"short",day:"numeric"})})`:""}${note?` · ${esc(note)}`:""}</div>
        ${isMain&&dropping(name)?`<p class="note bad">Dropped 2 sessions in a row. Check sleep, pre-workout food and volume before touching calories.</p>`:""}
        <div class="sets">${Array.from({length:n},(_,i)=>{ const s=logged[i]||{}; return `<div class="set"><span class="i">${i+1}</span>
          <input type="number" inputmode="decimal" step="0.5" placeholder="${bw}" value="${esc(s.w??"")}" data-set="${esc(name)}" data-i="${i}" data-k="w" aria-label="${esc(name)} set ${i+1} weight ${unit}"><span class="muted">${unit} ×</span>
          <input type="number" inputmode="numeric" placeholder="${br}" value="${esc(s.r??"")}" data-set="${esc(name)}" data-i="${i}" data-k="r" aria-label="${esc(name)} set ${i+1} reps"></div>`; }).join("")}
          <button class="btn ghost small" data-act="addset" data-n="${esc(name)}">+ set</button></div>
        ${lib?`<details><summary>How to do it</summary><p class="muted" style="font-size:.88rem;margin-top:4px">${lib[0]}</p><ul>${lib[1].map(c=>`<li>${c}</li>`).join("")}</ul><p style="font-size:.88rem;margin-top:4px"><b>Avoid:</b> ${lib[2]}</p></details>`:""}
      </div>`;}).join("")}
    <div class="ex"><label class="row"><input type="checkbox" data-act="tread" ${getDay(d).treadmill?"checked":""}><span><b>30 min treadmill</b> · 4.0 km/h · incline 3</span></label></div>
  </div>`;
}

/* ---------- MEAL PICKER (NutreezePicker engine) ---------- */
const SLOT_MAP = {meal1:"Meal 1", meal2:"Meal 2", snack1:"Snack", snack2:"Snack", adonis:"Fixed", gatorade:"Fixed", eggs:"Breakfast"};
function pickerDayType(d){ const t=dayType(d), ses=sessionFor(d); if(t==="friday") return "friday"; if(t==="saturday") return "saturday"; return ses&&ses.session==="Rest" ? "rest" : "training"; }
function pickerCard(d, training){
  const P = window.NutreezePicker; if(!P) return "";
  let draft=""; try{ draft=localStorage.getItem("aziz-cut-menu")||""; }catch(e){}
  const res = view.pick && view.pick.date===d ? view.pick : null;
  const line = it => `<li>${esc(it.name)} <span class="muted num" style="font-size:.85rem">${r0(it.kcal)} kcal · ${r1(it.p)} P</span></li>`;
  return `<div class="card">
    <div class="spread"><h3>Pick my meals</h3><span class="muted" style="font-size:.85rem">2 meals + 2 snacks + Adonis${training?" + Gatorade":""}</span></div>

    <textarea id="menuText" rows="5" style="width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px;font-family:var(--mono);font-size:.85rem" placeholder="French Tacos Chicken 650 55 60 18&#10;Buffalo Chicken with Sweet Potato 496 65 41 8&#10;Chicken Masala 607 67 60 11">${esc(draft)}</textarea>
    <div class="row"><button class="btn" data-act="pick">Find the best combo</button>${res?`<button class="btn ghost small" data-act="pickclear">Clear results</button>`:""}</div>
    ${res && res.error ? `<p class="note">${esc(res.error)}</p>` : ""}
    ${res && res.skipped && res.skipped.length ? `<p class="muted" style="font-size:.85rem">Removed: ${res.skipped.map(esc).join(", ")}</p>` : ""}
    ${res && res.options ? res.options.map((o,i)=>`<div class="ex">
      <div class="spread"><b>${i===0?"Best option":"Option "+(i+1)}</b><span class="pill ${o.check.fits?"good":"warn"}">${esc(o.check.verdict)}</span></div>
      <ul style="margin:0;padding-left:1.1em">${line(o.meal1)}${line(o.meal2)}${o.snacks.map(line).join("")}</ul>
      <div class="row"><span class="num" style="font-size:.9rem">Total ${r0(o.totals.kcal)} kcal · ${r0(o.totals.p)} P · ${r0(o.totals.c)} C · ${r0(o.totals.f)} F</span><button class="btn small" data-act="usepick" data-i="${i}">Use this plan</button></div>
      ${o.check.notes&&o.check.notes.length?`<p class="muted" style="font-size:.85rem">${o.check.notes.map(esc).join(" ")}</p>`:""}
    </div>`).join("") : ""}
  </div>`;

function runPicker(){
  const P=window.NutreezePicker, d=view.date, text=document.getElementById("menuText").value;
  try{ localStorage.setItem("aziz-cut-menu",text); }catch(e){}
  const meals = P.parseMenu(text);
  const ok = meals.filter(m=>!m.error);
  if(ok.length<2){ view.pick={date:d,error:"Add at least 2 meals, each as: name kcal protein carbs fat."}; render(); return; }
  const dt=pickerDayType(d);
  const bans=S.docs.prefs.main?.dislikes||[];
  const r=P.pick({meals:ok, dayType:dt, gatorade:dt!=="rest"&&dt!=="friday", eggs:dt==="saturday", extraBans:bans, top:3});
  const skipped = ok.filter(m=>P.bannedReason(m,bans)).map(m=>m.name);
  view.pick = r.options && r.options.length ? {date:d, options:r.options, fixed:r.fixed, skipped} : {date:d, error:"No combination fits. Add more meals from the menu.", skipped};
  render();
}
function usePick(i){
  const P=window.NutreezePicker, d=view.date, o=view.pick.options[i];
  const items = P.toFoodItems(o, view.pick.fixed).map(it=>({...it, id:uid(), slot:SLOT_MAP[it.slot]||it.slot, eaten:false}));
  const day=getDay(d);
  day.food = day.food.filter(x=>x.eaten).concat(items.filter(it=>!day.food.some(x=>x.eaten && x.name===it.name)));
  view.pick=null; saveDay(day); toast("Plan added. Tick items as you eat them.");
}

/* ---------- PROGRESS ---------- */
function weightChart(){
  const ws=weightsSorted(); if(!ws.length) return `<p class="muted">Log your first weigh-in on the Today tab.</p>`;
  const W=640,H=220,L=44,R=12,T=14,B=28;
  const first=ws[0].date, last=ws[ws.length-1].date, span=Math.max(6,diffDays(first,last));
  const vals=ws.map(w=>w.kg); let lo=Math.floor(Math.min(...vals)-0.6), hi=Math.ceil(Math.max(...vals)+0.6);
  const x=d=>L+(diffDays(first,d)/span)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[]; const step=(hi-lo)>6?2:1; for(let v=lo; v<=hi; v+=step) ticks.push(v);
  const pts=ws.map(w=>`${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(" ");
  const avgPts=ws.map(w=>{const a=avg7(w.date); return a?`${x(w.date).toFixed(1)},${y(a).toFixed(1)}`:null}).filter(Boolean).join(" ");
  const lastW=ws[ws.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Morning weight over time">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join("")}
    <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fmt(first,{month:"short",day:"numeric"})}</text>
    <text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(addDays(first,span),{month:"short",day:"numeric"})}</text>
    ${ws.length>1?`<polyline points="${pts}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>`:""}
    ${ws.map(w=>`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3.5" fill="var(--muted)"/>`).join("")}
    ${avgPts.includes(" ")?`<polyline points="${avgPts}" fill="none" stroke="var(--accent)" stroke-width="3"/>`:""}
    <circle cx="${x(lastW.date)}" cy="${y(lastW.kg)}" r="5.5" fill="var(--accent)"/>
  </svg>
  <p class="muted" style="font-size:.82rem">Dots = daily weigh-ins. Blue line = 7-day average (shows once there are 7 readings in a week).</p></div>`;
}
function vProgress(){
  const ws=weightsSorted(), lastW=ws[ws.length-1];
  const lost = lastW ? START.kg-lastW.kg : 0;
  const pct = Math.max(0,Math.min(100, lost/(START.kg-GOAL_KG)*100));
  const wkNow = lastW ? avgWindow(lastW.date) : null, wkPrev = lastW ? avgWindow(addDays(lastW.date,-7)) : null;
  const rate = (wkNow && wkPrev && wkNow.n>=4 && wkPrev.n>=4) ? wkNow.avg-wkPrev.avg : null;
  const strictDays = Array.from({length:14},(_,i)=>addDays(STRICT.from,i));
  const logged = strictDays.filter(d=>S.docs.weights[d]).length;
  const foodDays = Object.values(S.docs.days).filter(x=>x && x.food && x.food.some(i=>i.eaten)).sort((a,b)=>a.date<b.date?1:-1).slice(0,14);
  let table=[], prev=null;
  ws.forEach((w,i)=>{ const a=avg7(w.date); table.push({...w,n:diffDays(START.date,w.date)+1,ch:prev?w.kg-prev.kg:null,a}); prev=w; });
  table.reverse();
  const report = window.WeeklyReport ? WeeklyReport.html(S.docs, view.wrWeek==null?{}:{week:view.wrWeek}) : "";
  return `${report}
  <div class="card hero">
    <div class="spread"><h2>${lastW?`${lastW.kg.toFixed(1)} kg`:"No weigh-ins yet"}</h2><span class="label">Goal 80 kg</span></div>
    <div class="prog" aria-label="Progress to goal"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat"><div class="v num">${lastW?(lost>=0?"−":"+")+Math.abs(lost).toFixed(1):"—"}</div><span class="label">kg since 91.9</span></div>
      <div class="stat"><div class="v num">${lastW?(lastW.kg-GOAL_KG).toFixed(1):"11.9"}</div><span class="label">kg to go</span></div>
      <div class="stat"><div class="v num">${wkNow?wkNow.avg.toFixed(1):"—"}</div><span class="label">Avg, last 7 days${wkNow?` (${wkNow.n})`:""}</span></div>
      <div class="stat"><div class="v num">${rate!==null?(rate>0?"+":"")+rate.toFixed(2):"—"}</div><span class="label">kg / week</span></div>
    </div>
    ${rate!==null?`<p class="${rate<=-0.4&&rate>=-1?"muted":"note"}" style="font-size:.9rem">Expected at 2,000 kcal: about −0.5 to −0.8 kg a week (0.5–1% of body weight). ${rate>-0.3?"Slower than expected, but judge it over 2 weeks before changing calories.":rate<-1.0?"Faster than expected. Normal in week 1 (water and glycogen).":"Right on track."}</p>`:`<p class="muted" style="font-size:.9rem">Expected at 2,000 kcal: about −0.5 to −0.8 kg a week. Week 1 usually drops faster from water and glycogen.</p>`}
  </div>
  <div class="card">
    <div class="spread"><h3>14-day strict tracking</h3><span class="muted">${fmt(STRICT.from,{month:"short",day:"numeric"})} → ${fmt(STRICT.to,{month:"short",day:"numeric"})}</span></div>
    <div class="days14">${strictDays.map(d=>`<span class="${S.docs.weights[d]?"has":""} ${d===TODAY?"today":""}" title="${fmt(d)}">${parse(d).getDate()}</span>`).join("")}</div>
    <p style="font-size:.92rem"><b class="num">${logged}/14</b> weigh-ins logged. First 7-day average on <b>Sat, Oct 31</b>. Calorie review only after <b>Sat, Nov 7</b>, based on the trend. Don't cut to 1,800 or 1,700 because of one reading.</p>
  </div>
  <div class="card"><h3>Weight trend</h3>${weightChart()}</div>
  <div class="card"><h3>Weight log</h3>
    ${table.length?`<div class="tablewrap"><table><thead><tr><th>Day</th><th>Date</th><th class="n">Weight</th><th class="n">Change</th><th class="n">7-day avg</th><th class="n">To 80</th></tr></thead>
    <tbody>${table.map(r=>`<tr><td class="n">${r.n}</td><td>${fmt(r.date)}</td><td class="n">${r.kg.toFixed(1)}</td><td class="n">${r.ch===null?"—":(r.ch>0?"+":"")+r.ch.toFixed(1)}</td><td class="n">${r.a?r.a.toFixed(2):"—"}</td><td class="n">${(r.kg-GOAL_KG).toFixed(1)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No entries yet.</p>`}
  </div>
  <div class="card"><h3>Main lifts</h3>
    <div class="tablewrap"><table><thead><tr><th>Lift</th><th class="n">Baseline</th><th class="n">Latest best set</th><th>Status</th></tr></thead><tbody>
    ${MAIN_LIFTS.map(n=>{ const base=Object.values(PROGRAM).flat().find(e=>e[0]===n); const h=liftHistory(n); const l=h[h.length-1];
      const st = !l?`<span class="muted">Not logged yet</span>`:dropping(n)?`<span class="pill bad">Dropping</span>`:l.best.v>=e1rm(base[1],base[2])-0.01?`<span class="pill good">Holding</span>`:`<span class="pill warn">Below baseline</span>`;
      return `<tr><td>${n}</td><td class="n">${base[1]} ${base[4]} × ${base[2]}</td><td class="n">${l?`${l.best.w} × ${l.best.r}`:"—"}</td><td>${st}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:.88rem">Goal on a cut: hold these. If one drops for 2+ sessions in a row, check sleep, pre-workout food and volume before touching calories.</p>
  </div>
  <div class="card"><h3>Calories eaten</h3>
    ${foodDays.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th class="n">kcal</th><th class="n">Protein</th><th>Status</th></tr></thead><tbody>
    ${foodDays.map(x=>{ const t=sum(x.food.filter(i=>i.eaten)); const ok=t.kcal>=1850&&t.kcal<=2100&&t.p>=160; return `<tr><td>${fmt(x.date)}</td><td class="n">${r0(t.kcal)}</td><td class="n">${r0(t.p)} g</td><td>${ok?`<span class="pill good">On target</span>`:`<span class="pill warn">${t.kcal>2100?"Over":t.kcal<1850?"Under":"Low protein"}</span>`}</td></tr>`; }).join("")}
    </tbody></table></div>`:`<p class="muted">Tick food as eaten on the Food tab and your daily totals show up here.</p>`}
  </div>`;
}

function vGuide(){

  const done = S.docs.prefs.main?.open||{};

  <section class="grid guide">

      <li>Judge progress by weekly averages, never one weigh-in.</li>
      <li>Target loss: 0.5–1% of body weight a week, about 0.5–0.8 kg for you.</li>

document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return; view.tab=b.dataset.tab; try{localStorage.setItem("aziz-cut-tab",view.tab)}catch(_){} render(); window.scrollTo(0,0); });
document.getElementById("prevDay").onclick=()=>{ view.date=addDays(view.date,-1); render(); };
document.getElementById("nextDay").onclick=()=>{ view.date=addDays(view.date,1); render(); };
document.getElementById("goToday").onclick=()=>{ view.date=TODAY; render(); };

function saveDay(day,opts){ put("days",day.date,day,opts); }
function addFood(item){ const day=getDay(view.date); day.food.push({id:uid(),eaten:false,...item}); saveDay(day); }

main.addEventListener("click",e=>{
  const wr=e.target.closest("[data-wr-week],[data-wr-copy]");
  if(wr){
    if(wr.hasAttribute("data-wr-copy")){ const t=WeeklyReport.summary(S.docs, view.wrWeek==null?{}:{week:view.wrWeek}); navigator.clipboard.writeText(t).then(()=>toast("Summary copied"),()=>toast("Copy blocked. Select the text in the report instead.")); }
    else { view.wrWeek=+wr.dataset.wrWeek; render(); }
    return;
  }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, d=view.date;
  if(a==="gotrain"){ view.tab="train"; render(); window.scrollTo(0,0); }
  else if(a==="gofood"){ view.tab="food"; render(); window.scrollTo(0,0); }
  else if(a==="setses"){ const idx=+el.dataset.idx; const w=clone(S.docs.workouts[d]); put("workouts",d,{date:d,sets:{},...w,session:ROTATION[idx],idx}); }
  else if(a==="water"){ const day=getDay(d); day.water=Math.max(0,(day.water||0)+(+el.dataset.ml)); saveDay(day); }
  else if(a==="delweight"){ remove("weights",d); }
  else if(a==="timer"){ startTimer(+el.dataset.s); }
  else if(a==="addset"){ const n=el.dataset.n; const w=Object.assign({date:d,sets:{}},clone(S.docs.workouts[d])); const ses=sessionFor(d); if(!w.session){w.session=ses.session;w.idx=ses.idx;} const base=PROGRAM[w.session].find(x=>x[0]===n); const arr=w.sets[n]||[]; while(arr.length<(base?base[3]:0)) arr.push({}); arr.push({}); w.sets[n]=arr; put("workouts",d,w); }
  else if(a==="fixed"){ const day=getDay(d); const type=dayType(d), ses=sessionFor(d); const training=type!=="friday"&&!(ses&&ses.session==="Rest"); const keys=training?["adonis","gatorade"]:["adonis"]; keys.forEach(k=>{ const f=FIXED.find(x=>x.key===k); if(!day.food.some(i=>i.name===f.name)) day.food.push({id:uid(),eaten:false,...f}); }); saveDay(day); }
  else if(a==="quick"){ const f=FIXED.find(x=>x.key===el.dataset.k); addFood({...f}); }
  else if(a==="snack"){ const s=SNACKS[+el.dataset.i]; addFood({name:s[1],slot:"Snack",kcal:s[2],p:s[3],c:s[4],f:s[5]}); }
  else if(a==="delfood"){ const day=getDay(d); day.food=day.food.filter(i=>i.id!==el.dataset.id); saveDay(day); }
  else if(a==="copyday"){ const day=getDay(d), nd=addDays(d,1), next=getDay(nd); next.food=next.food.concat(day.food.map(i=>({...i,id:uid(),eaten:false}))); put("days",nd,next); view.date=nd; toast("Copied to "+fmt(nd)); }
  else if(a==="clearday"){ if(el.dataset.confirm){ const day=getDay(d); day.food=[]; saveDay(day); } else { el.dataset.confirm="1"; el.textContent="Tap again to clear"; } }
  else if(a==="waterh"){ applyWaterHText(document.getElementById("waterhText").value); }
  else if(a==="tmode"){ view.trainMode=el.dataset.m; try{localStorage.setItem("aziz-cut-tmode",view.trainMode)}catch(_){} render(); }
  else if(a==="pick"){ runPicker(); }
  else if(a==="pickclear"){ view.pick=null; render(); }
  else if(a==="usepick"){ usePick(+el.dataset.i); }
  else if(a==="accent"){ const p=Object.assign({},clone(S.docs.prefs.main)); p.accent=el.dataset.k; applyAccent(p.accent); put("prefs","main",p); }
  else if(a==="deldislike"){ const p=Object.assign({dislikes:[]},clone(S.docs.prefs.main)); p.dislikes.splice(+el.dataset.i,1); put("prefs","main",p); }
});
main.addEventListener("change",e=>{
  const el=e.target, d=view.date;
  if(el.id==="strongFile" && el.files && el.files[0]){ importStrong(el.files[0]); return; }
  if(el.id==="waterhFile" && el.files && el.files[0]){ const fr=new FileReader(); fr.onload=()=>applyWaterHText(String(fr.result)); fr.readAsText(el.files[0]); return; }
  if(el.dataset.act==="eat"){ const day=getDay(d); const it=day.food.find(i=>i.id===el.dataset.id); if(it) it.eaten=el.checked; saveDay(day); if(el.checked && window.FitMotion){ const c=main.querySelector(`[data-act="eat"][data-id="${el.dataset.id}"]`); if(c) FitMotion.pop(c); } }
  else if(el.dataset.act==="supp"){ const day=getDay(d); day.supps[el.dataset.k]=el.checked; saveDay(day); }
  else if(el.dataset.act==="tread"){ const day=getDay(d); day.treadmill=el.checked; saveDay(day,{quiet:view.tab==="train"}); }
  else if(el.dataset.act==="open"){ const p=Object.assign({open:{}},clone(S.docs.prefs.main)); p.open={...p.open,[el.dataset.k]:el.checked}; put("prefs","main",p); }
  else if(el.dataset.set){
    const n=el.dataset.set, i=+el.dataset.i, k=el.dataset.k;
    const w=Object.assign({date:d,sets:{}},clone(S.docs.workouts[d])); const ses=sessionFor(d);
    if(!w.session){ w.session=ses.session; w.idx=ses.idx; }
    const arr=w.sets[n]||[]; while(arr.length<=i) arr.push({}); arr[i]={...arr[i],[k]:el.value};
    w.sets[n]=arr; put("workouts",d,w,{quiet:true}); renderPending=true;
  }
});
main.addEventListener("input",e=>{ if(e.target.id==="libq"){ view.q=e.target.value; const pos=e.target.selectionStart; render(); const s=document.getElementById("libq"); s.focus(); try{s.setSelectionRange(pos,pos)}catch(_){} } });
main.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target.dataset.form, d=view.date;
  if(f==="weight"){ const kg=parseFloat(document.getElementById("wkg").value); if(!(kg>30&&kg<250)){ toast("Enter your weight in kg, e.g. 91.4"); return; } document.activeElement.blur(); put("weights",d,{date:d,kg:Math.round(kg*10)/10}); }
  else if(f==="food"){
    const name=document.getElementById("fname").value.trim(); if(!name) return;
    const item={name,slot:document.getElementById("fslot").value,kcal:+document.getElementById("fk").value||0,p:+document.getElementById("fp").value||0,c:+document.getElementById("fc").value||0,f:+document.getElementById("ff").value||0,eaten:document.getElementById("featen").checked};
    if(isNever(name)) toast("Heads up: that's on your never-pick list");
    document.activeElement.blur(); addFood(item);
  }
  else if(f==="dislike"){ const v=document.getElementById("dislike").value.trim(); if(!v) return; const p=Object.assign({dislikes:[]},clone(S.docs.prefs.main)); p.dislikes=[...(p.dislikes||[]),v]; document.activeElement.blur(); put("prefs","main",p); }
});

/* Strong CSV import (StrongCSV module) */
function importStrong(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const {docs, report} = StrongCSV.toWorkouts(String(fr.result), {program:PROGRAM, rotation:ROTATION, existing:S.docs.workouts});
      const list = Array.isArray(docs) ? docs : Object.values(docs);
      let sets=0; list.forEach(doc=>{ Object.values(doc.sets||{}).forEach(a=>sets+=a.length); put("workouts",doc.date,doc,{quiet:true}); });
      const un = (report && report.unmatched) || {};
      const unNames = Array.isArray(un) ? un.map(u=>typeof u==="string"?u:(u.name||"")).filter(Boolean) : Object.keys(un);
      view.strongMsg = `Imported <b>${list.length}</b> workout${list.length===1?"":"s"} with <b>${sets}</b> sets.` + (unNames.length?` Not in your program (saved under their own names): ${unNames.map(esc).join(", ")}.`:"");
    }catch(err){ view.strongMsg = "Couldn't read that file. Export it again from Strong as CSV and pick that file."; }
    render();
  };
  fr.onerror=()=>{ view.strongMsg="Couldn't open that file."; render(); };
  fr.readAsText(file);
}

function applyWaterHText(text){
  let rows=[]; try{ rows=WaterH.parseWaterH(text); }catch(e){}
  if(!rows.length){ toast("No water amounts found. Paste the Shortcut's line, e.g. WATERH 2026-10-25 2350 mL"); return; }
  rows.forEach(r=>{ const day=WaterH.applyWaterH(getDay(r.date), r); put("days", r.date, day, {quiet:true}); });
  render(); toast(rows.length===1 ? `WaterH: ${(rows[0].ml/1000).toFixed(2)} L on ${fmt(rows[0].date)}` : `WaterH synced for ${rows.length} days`);
}

/* Full workout logger (WorkoutLogger module), mounted once into its own host so re-renders don't wipe it */
let lbMounted=false;
function syncLogger(){
  const host=document.getElementById("lbHost"), show = view.tab==="train" && view.trainMode==="full";
  host.hidden = !show;
  if(!show || lbMounted || !window.WorkoutLogger || S.mode==="loading") return;
  lbMounted=true;
  const db=S.db;
  const storage = db ? {
    list: c => db.collection(c).get().then(qs=>qs.docs.map(d=>clone(d.data()))),
    put: (c,id,doc) => db.collection(c).doc(id).set(doc),
    remove: (c,id) => db.collection(c).doc(id).delete()
  } : undefined;
  try{
    WorkoutLogger.mount(host, {
      storage,
      weights: { list: async()=>weightsSorted().map(w=>({date:w.date,kg:w.kg})), put: async(date,kg)=>put("weights",date,{date,kg:Math.round(kg*10)/10},{quiet:true}) },
      onFinish(workout, rec){
        if(!rec || !rec.date) return;
        const w=Object.assign({date:rec.date,sets:{}}, clone(S.docs.workouts[rec.date]));
        if(rec.session){ w.session=rec.session; if(Number.isInteger(rec.idx)) w.idx=rec.idx; }
        w.sets=Object.assign({}, w.sets, rec.sets||{});
        if(rec.durationMin) w.durationMin=rec.durationMin;
        w.source = w.source || "logger";
        put("workouts", rec.date, w, {quiet:true});
        if(rec.treadmill){ const day=getDay(rec.date); day.treadmill=true; put("days", rec.date, day, {quiet:true}); }
        toast("Workout saved");
      }
    });
  }catch(e){ lbMounted=false; host.innerHTML='<div class="card"><p>The full logger could not start. Use Quick log for now.</p></div>'; }
}

/* rest timer */
let tInt=null;
function startTimer(sec){
  const el=document.getElementById("timer"); const end=Date.now()+sec*1000; clearInterval(tInt); el.hidden=false;
  const tick=()=>{ const left=Math.max(0,Math.round((end-Date.now())/1000)); el.innerHTML=`<span class="label" style="color:inherit">${left?"Rest":"Go"}</span><span class="num">${Math.floor(left/60)}:${pad(left%60)}</span><button type="button" id="tStop">${left?"Stop":"Close"}</button>`; document.getElementById("tStop").onclick=()=>{clearInterval(tInt);el.hidden=true;}; if(!left){ clearInterval(tInt); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){} } };
  tick(); tInt=setInterval(tick,500);
}

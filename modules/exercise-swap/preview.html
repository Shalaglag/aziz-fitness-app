<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Swap</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--sunk:#f0efeb;--line:#e2e0da;--ink:#1b1b1a;--muted:#6b6a66;--accent:#2f7d5b;--accent-ink:#fff;--good:#2f7d5b;--warn:#b26a00;--bad:#c0392b;--display:system-ui,sans-serif;--body:system-ui,sans-serif;--mono:ui-monospace,monospace;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--surface:#1c1c1a;--sunk:#252522;--line:#33332f;--ink:#efeee9;--muted:#9c9b95;--accent:#5cc493;--accent-ink:#0d1f16;--warn:#e5a23a;--bad:#ef6b5b}}
:root[data-theme="dark"]{--bg:#121211;--surface:#1c1c1a;--sunk:#252522;--line:#33332f;--ink:#efeee9;--muted:#9c9b95;--accent:#5cc493;--accent-ink:#0d1f16;--warn:#e5a23a;--bad:#ef6b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{font:inherit;font-size:14px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ex{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.ex b{display:block;font-size:15px}
.ex small{color:var(--muted);font-size:12px}
.ex .was{color:var(--accent)}
.ex .hurt{color:var(--bad)}
.ex button{font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer;flex:0 0 auto}
.foot{color:var(--muted);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>Swap a lift</h1>
  <p class="sub">Machine taken? Tap Swap. Something hurt? Flag it and you'll get a swap next time.</p>
  <div class="tabs" id="tabs"></div>
  <div id="notice"></div>
  <div id="list"></div>
  <p class="foot">Preview only: this keeps its state in this browser. In the app it syncs with the rest of your log.</p>
</main>
<script src="exercise-swap.js"></script>
<script>
const PROGRAM = {
  "Push A":["Bench Press (Barbell)","Lateral Raise (Cable)","Incline DB Press","Cable Crossover","Triceps Extension (Cable)","Triceps Pushdown (Straight bar)","Standing Side Delts (Machine)"],
  "Pull A":["Lat Pulldown, Wide","Lat Pulldown, Single Arm","Seated Row (Cable)","Pullover (Machine)","DB Curl","Seated Bicep Curl","Reverse Fly (Machine)"],
  "Lower A":["Leg Extension","Hack Squat","Smith Squat","Lying Leg Curl","Hip Adductor","Standing Calf Raise","Seated Abs"],
  "Push B":["Gundam (Chest Machine)","Seated DB Overhead Press","Side Delts","Reverse Fly (Machine)","Front Raise (DB)","Triceps Rope","Triceps Pushdown (Straight bar)"],
  "Pull B":["T-Bar Row","Lat Pulldown, Single Arm","Iso-Lateral Low Row","Seated Row (Cable)","Traps Machine","Cable Standing Biceps"],
  "Lower B":["Lying Leg Curl","Leg Extension","Hack Squat","Smith Squat","Hip Abductor","Calf Press on Seated Leg Press","Seated Abs"]
};
const load = () => { try { return JSON.parse(localStorage.getItem('xs-preview')) || null; } catch (e) { return null; } };
const save = () => { try { localStorage.setItem('xs-preview', JSON.stringify(S)); } catch (e) {} };
const S = load() || { session: 'Push A', state: ExerciseSwap.empty(), today: {} };
const workouts = [{ date: '2026-10-20', session: 'Lower A', sets: { 'Hack Squat': [{ w: 70, r: 8 }], 'Leg Press (Machine)': [{ w: 160, r: 10 }] } }];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() {
  document.getElementById('tabs').innerHTML = Object.keys(PROGRAM).map(k => '<button aria-pressed="' + (k === S.session) + '" data-s="' + k + '">' + k + '</button>').join('');
  const slots = PROGRAM[S.session], used = S.today[S.session] || {};
  ExerciseSwap.renderNotice(document.getElementById('notice'), {
    exercises: slots.filter(n => !used[n]), state: S.state, workouts,
    onSwap: (ex, opt) => pick(ex, opt, 'hurt'), onKeep: ex => { S.state = ExerciseSwap.clearHurt(S.state, ex); save(); render(); }
  });
  document.getElementById('list').innerHTML = slots.map((n, i) => {
    const u = used[n], h = ExerciseSwap.hurtInfo(S.state, u || n);
    return '<div class="ex"><div><b>' + esc(u || n) + '</b><small>' + (u ? '<span class="was">In place of ' + esc(n) + '</span>' : 'In your plan') +
      (h ? ' · <span class="hurt">flagged ' + esc(h.date) + '</span>' : '') + '</small></div><button data-i="' + i + '">' + (u ? 'Change' : 'Swap') + '</button></div>';
  }).join('');
}
function pick(slot, opt, reason) {
  const t = S.today[S.session] = S.today[S.session] || {};
  if (ExerciseSwap.canonical(opt.name) === slot) delete t[slot]; else t[slot] = opt.name;
  S.state = ExerciseSwap.recordSwap(S.state, { session: S.session, from: slot, to: opt.name, reason });
  save(); render();
}
document.getElementById('tabs').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { S.session = b.dataset.s; save(); render(); } };
document.getElementById('list').onclick = e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const slot = PROGRAM[S.session][+b.dataset.i], cur = (S.today[S.session] || {})[slot] || slot;
  ExerciseSwap.openSheet({
    exercise: cur, state: S.state, workouts, exclude: PROGRAM[S.session].filter(n => n !== slot),
    onPick: opt => pick(slot, opt, 'taken'),
    onHurt: note => { S.state = ExerciseSwap.flagHurt(S.state, cur, { note }); save(); render(); },
    onFine: () => { S.state = ExerciseSwap.clearHurt(S.state, cur); save(); render(); }
  });
};
render();
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardio preview</title>
<link rel="stylesheet" href="../theme/theme.css">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);padding:16px;max-width:560px}
h3{font-family:var(--display);font-size:1.2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.small{padding:5px 10px;font-size:.88rem}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s}
</style></head><body>
<p class="muted" style="font-size:.85rem">Example data: three weeks of the 30 min walk after lifting. Saving here only changes this page.</p>
<div id="log"></div>
<div id="prog"></div>
<pre class="card" id="sum" style="white-space:pre-wrap;font-size:.8rem"></pre>
<div id="toast"></div>
<script src="cardio.js"></script>
<script>
const TODAY = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
const back = n => { const d = new Date(TODAY + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); };
const docs = { prefs: { main: { cardio: { kind: "treadmill", min: 30, speed: 4.0, incline: 3, hrCeiling: 135 } } }, cardio: {}, days: {}, workouts: {} };
// [days back, speed, incline, avg HR, effort]
[[20, 4, 3, 133, 2], [18, 4, 3, 131, 2], [17, 4, 3, null, 2], [15, 4, 3, 129, 1], [13, 4, 3, 127, 1], [11, 4, 3, 126, 1],
 [10, 4, 4, 132, 2], [8, 4, 4, 129, 1], [6, 4, 4, 127, 1], [4, 4, 4, 126, 1], [3, 4, 4, null, 1], [1, 4, 4, 124, 1]].forEach(([n, speed, incline, hrAvg, effort]) => {
  const d = back(n);
  const { session } = Cardio.clean({ min: 30, speed, incline, hrAvg, effort, at: d + "T16:00:00Z" }, { weightKg: 91.5 });
  docs.cardio[d] = Cardio.withSession(docs.cardio[d], session, d);
  docs.days[d] = { date: d, treadmill: true };
});
for (let n = 0; n <= 21; n++) if (new Date(back(n)).getUTCDay() !== 5 && n % 4 !== 2) docs.workouts[back(n)] = { date: back(n), session: "Push A", sets: { "Bench Press (Barbell)": [{ w: 90, r: 8 }] } };

document.head.insertAdjacentHTML("beforeend", "<style>" + Cardio.css + "</style>");
let cardOpts = {};
const toast = t => { const el = document.getElementById("toast"); el.textContent = t; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 1800); };
function render() {
  document.getElementById("log").innerHTML = Cardio.cardHTML(TODAY, docs, cardOpts);
  document.getElementById("prog").innerHTML = Cardio.progressHTML(docs, { today: TODAY });
  document.getElementById("sum").textContent = Cardio.summary(docs, { today: TODAY });
}
document.addEventListener("click", e => {
  const ctx = { docs, weightKg: 91.5, toast,
    put: (c, id, doc) => { docs[c][id] = doc; cardOpts = {}; render(); },
    rerender: o => { cardOpts = o; render(); } };
  Cardio.handle(e.target, ctx);
});
render();
</script></body></html>

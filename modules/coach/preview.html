<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach preview</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--sunk:#f0eee9;--line:#e2dfd8;--ink:#1d1c1a;--muted:#6f6b63;--accent:#2f6f4f;--accent-ink:#fff;--good:#2f7d4f;--warn:#b26b00;--bad:#b3261e;--mono:ui-monospace,Menlo,monospace;--r:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1d1c1a;--sunk:#262522;--line:#34322e;--ink:#f1efe9;--muted:#a19c92;--accent:#6fc79a;--accent-ink:#0d1f15;--good:#6fc79a;--warn:#f0b35a;--bad:#f2867e}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 4px;font-size:1rem}
</style></head>
<body><main id="root"><p style="color:var(--muted);margin:0">Example data: a cut that started Oct 25 at 92 kg, losing about 0.7 kg a week, with one stalled period. Today is Nov 23.</p><div id="rv"></div><div id="chat"></div></main>
<script src="coach.js"></script>
<script>
const add=(s,n)=>new Date(Date.parse(s+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
const docs={weights:{},days:{},workouts:{},prefs:{main:{}}};
const noise=[0.3,-0.2,0.1,-0.3,0.2,0,-0.1];
for(let i=0;i<29;i++){const d=add("2026-10-25",i);const wk=i<14?-0.8:-0.1;
 docs.weights[d]={date:d,kg:+(92+(i<14?wk*i/7:-1.6+wk*(i-14)/7)+noise[i%7]).toFixed(1)};
 if(i%7!==6) docs.days[d]={food:[{kcal:i%5===0?2350:1980,p:150+(i%4)*6,eaten:true},{kcal:300,p:25,eaten:false}],sleep:6+(i%3)*0.5};
 if(i%8!==3&&i%8!==7) docs.workouts[d]={date:d,session:"Push A",effort:7+(i%3),sets:{"Bench Press":[{w:90-(i>20?2.5:0),r:8}],"Squat":[{w:120+(i>14?2.5:0),r:6}],"Row":[{w:80,r:10}]}};}
const T={kcal:2000,kcalLo:1850,kcalHi:2150,proteinMin:160,proteinMax:170,start:"2026-10-25"};
document.head.insertAdjacentHTML("beforeend","<style>"+Coach.css+"</style>");
const o={today:"2026-11-23",targets:T,rules:{floor:1800}};
function render(){document.getElementById("rv").innerHTML=Coach.reviewHtml(docs,Object.assign({onApply:1},o));document.getElementById("chat").innerHTML=Coach.chatHtml(docs,o);}
Coach.bind(document,{getDocs:()=>docs,today:()=>o.today,targets:()=>T,getSample:()=>window.claude&&window.claude.use?window.claude.use("sample").catch(()=>null):Promise.resolve(null),render,onApply:ch=>{if(confirm("Change your calorie target from "+ch.from+" to "+ch.to+"?")){T.kcal=ch.to;T.kcalLo=ch.to-150;T.kcalHi=ch.to+150;render();}}});
render();
</script></body></html>

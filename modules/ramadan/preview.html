<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramadan mode preview</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--sunk:#efede6;--line:#e2dfd6;--ink:#1d1c19;--muted:#6b675e;--accent:#2f6f5e;--display:Georgia,serif;--body:system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--surface:#1f1e1b;--sunk:#2a2925;--line:#34322d;--ink:#f0eee8;--muted:#a19d93;--accent:#7cc4ad}}
:root[data-theme="dark"]{--bg:#151513;--surface:#1f1e1b;--sunk:#2a2925;--line:#34322d;--ink:#f0eee8;--muted:#a19d93;--accent:#7cc4ad}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
main{max-width:560px;margin:0 auto;padding:16px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ctl label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="ctl">
    <label>Date <input type="date" id="d" value="2027-02-10" min="2027-02-08" max="2027-03-09"></label>
    <label>Day <select id="t"><option value="training">Training</option><option value="saturday">Saturday</option><option value="rest">Rest</option><option value="friday">Friday</option></select></label>
    <label>Train <select id="w"><option value="after-iftar">After iftar</option><option value="before-iftar">Before iftar</option></select></label>
  </div>
  <div id="out"></div>
</main>
<script src="ramadan.js"></script>
<script>
document.head.insertAdjacentHTML("beforeend", "<style>" + Ramadan.css + "</style>");
const $ = (id) => document.getElementById(id);
function draw() { $("out").innerHTML = Ramadan.html($("d").value, { dayType: $("t").value, train: $("w").value }) || "<p>Outside Ramadan.</p>"; }
["d", "t", "w"].forEach((id) => $(id).addEventListener("input", draw));
draw();
</script>
</body>
</html>

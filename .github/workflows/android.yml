# Builds the Android app (Capacitor wrapper around app/) on every PR and push to main.
# PR: the APK is kept as a workflow artifact. main: the APK and AAB are attached to the
# "android-latest" release of this (private) repo, and the APK plus latest.json are copied to the
# public releases-only repo Shalaglag/mizan-releases when the RELEASES_TOKEN secret exists, so the
# app's Update button works on any phone with no GitHub account or key (modules/app-update).
name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time; a newer push cancels the older build, so an older APK (lower version
# number) can never replace the newest one on the android-latest release.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Capacitor
        run: npm ci
      - name: Check the web build is current
        run: node build/build.js --check
      - name: Copy app/ into the Android project
        run: npx cap sync android
      - name: Signing key (from the ANDROID_KEYSTORE_BASE64 secret, else a throwaway key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/aziz-personal.jks
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this APK is signed with a one-off key and will not install over a previous build. See docs/ANDROID.md."
            keytool -genkeypair -keystore android/keystore/aziz-personal.jks -alias aziz -storepass azizfitness -keypass azizfitness -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aziz Fitness (throwaway)"
          fi
      - name: Build APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../aziz-fitness.apk
          cp app/build/outputs/bundle/release/app-release.aab ../aziz-fitness.aab
      - name: Write latest.json (what the in-app updater reads)
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("latest.json", JSON.stringify({
              build: ${{ github.run_number }}, versionName: "1.0.${{ github.run_number }}", sha: "${{ github.sha }}",
              size: fs.statSync("aziz-fitness.apk").size, at: new Date().toISOString(), asset: "aziz-fitness.apk"
            }, null, 2) + "\n");
          '
          cat latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: aziz-fitness-android
          path: |
            aziz-fitness.apk
            aziz-fitness.aab
      - name: Attach to the android-latest release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Mizan for Android (latest)
          body: |
            Newest build from main (build ${{ github.run_number }}, ${{ github.sha }}).
            Install: open this page on the phone, tap **aziz-fitness.apk**, then Open. See docs/ANDROID.md.
          prerelease: true
          files: |
            aziz-fitness.apk
            aziz-fitness.aab
            latest.json
      # Public copy for the in-app updater: only the APK and latest.json, never the code. Needs a
      # fine-grained token for Shalaglag/mizan-releases with Contents: Read and write (secret RELEASES_TOKEN).
      - name: Give the public repo its first commit if it is empty (a release needs one)
        if: ${{ github.event_name != 'pull_request' && env.RELEASES_TOKEN != '' }}
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          api=https://api.github.com/repos/Shalaglag/mizan-releases/contents/README.md
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $RELEASES_TOKEN" "$api")
          if [ "$code" = "404" ]; then
            body=$(printf '%s\n' "# Mizan releases" "" "Android builds of the Mizan fitness app. Install aziz-fitness.apk from the android-latest release; the app updates itself after that." | base64 -w0)
            curl -s -o /dev/null -w 'README created: %{http_code}\n' -X PUT -H "Authorization: Bearer $RELEASES_TOKEN" "$api" -d "{\"message\":\"Mizan releases\",\"content\":\"$body\"}"
          else
            echo "public repo already has content ($code)"
          fi
      - name: Publish to the public releases repo (Shalaglag/mizan-releases)
        if: ${{ github.event_name != 'pull_request' && env.RELEASES_TOKEN != '' }}
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: Shalaglag/mizan-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: android-latest
          name: Mizan for Android (latest)
          body: |
            Mizan build ${{ github.run_number }}. Install: tap **aziz-fitness.apk** on the phone, then Open.
            Updates after that come from inside the app (Settings, App updates).
          files: |
            aziz-fitness.apk
            latest.json
